${flow([['Gerar','Arquivo .txt no leiaute vigente, exportado do ERP'],['Importar no PVA','Programa Validador e Assinador da obrigação'],['Validar','Corrigir erros; analisar advertências'],['Assinar','Certificado digital e-CNPJ (A1 ou A3) ou procurador'],['Transmitir','Pelo próprio PVA ou ReceitaNet'],['Guardar o recibo','Arquivo, recibo e memória de cálculo por 5 anos ou mais']])}
<h2>Checklist mensal do setor fiscal</h2>
<ol><li>Até o dia 5: baixar todos os XMLs e manifestar as notas recebidas.</li><li>Até o dia 8: conciliar notas emitidas, canceladas e recebidas.</li><li>Até o dia 10: revisar CFOP, CST e créditos; apurar ICMS, IPI, PIS e Cofins.</li><li>Até o dia 12: conferir ST e DIFAL, gerar guias estaduais.</li><li>Até o dia 15: EFD-Reinf e eSocial.</li><li>Até o vencimento da UF: transmitir a EFD ICMS/IPI.</li><li>Até o dia 25: pagar IPI, PIS e Cofins.</li><li>Último dia útil: DCTFWeb com MIT.</li><li>10º dia útil do 2º mês: EFD-Contribuições.</li></ol>
<h2>Retificação</h2>
<p>Errou? Transmita um arquivo retificador completo, com o mesmo período, que substitui o anterior. Algumas retificações de EFD ICMS/IPI fora do prazo exigem autorização da SEFAZ. Na DCTFWeb, a retificação de débitos pode exigir também a correção do eSocial ou da Reinf de origem.</p>
${erro('Retificar apenas a declaração e esquecer de recolher a diferença do tributo, ou de pedir a compensação do valor pago a maior.')}
<h2>Multas</h2>
<p>Atraso e omissão geram multas que variam por obrigação e por regime. Na esfera federal, a entrega em atraso de escriturações do SPED pode gerar multa mensal (MP 2.158-35/2001, art. 57) ou multa proporcional à receita, como na ECD (0,02% por dia, limitada a 1%). Nos estados, as multas da EFD costumam ser calculadas por documento ou por valor de operações omitidas.</p>
`},

<p class="lead">Um calendário de referência para o mês típico. Datas que caem em fim de semana ou feriado seguem a regra de cada obrigação (algumas antecipam, outras prorrogam).</p>

{ n:4, title:'Reforma tributária', sub:'EC 132/2023, LC 214/2025, LC 227/2026: IBS, CBS e Imposto Seletivo', lessons:[

{id:'r1', t:'Visão geral da reforma', h:`
<p class="lead">A reforma do consumo substitui cinco tributos por um IVA dual (IBS e CBS) e cria um imposto extrafiscal, o Imposto Seletivo.</p>
${tbl(['Hoje','Esfera','Será substituído por'],[['PIS','Federal','CBS – Contribuição sobre Bens e Serviços'],['Cofins','Federal','CBS'],['IPI','Federal','CBS (IPI vai a zero, exceto para proteger a Zona Franca de Manaus) e Imposto Seletivo'],['ICMS','Estadual','IBS – Imposto sobre Bens e Serviços'],['ISS','Municipal','IBS']])}
<h2>A legislação base</h2>
${lei('Emenda Constitucional 132/2023','Altera a Constituição: cria o IBS (art. 156-A), a CBS (art. 195, V) e o Imposto Seletivo (art. 153, VIII), e define a transição até 2033.')}
${lei('Lei Complementar 214/2025','Institui o IBS, a CBS e o IS: fato gerador, base de cálculo, alíquotas, não cumulatividade, regimes diferenciados e específicos, split payment, cashback e regras de transição. Sancionada em 16/01/2025.')}
${lei('Lei Complementar 227/2026','Fruto do PLP 108/2024, publicada em 14/01/2026. Regulamenta o Comitê Gestor do IBS (CGIBS), a distribuição da arrecadação entre estados e municípios, o processo administrativo do IBS e a cobrança do ITCMD, e altera pontos da LC 214/2025.')}
<h2>Por que mudar</h2>
<ul><li>Fim da guerra fiscal: o imposto passa a pertencer ao local de destino (consumo).</li><li>Fim do efeito cascata: crédito amplo de tudo o que a empresa adquire.</li><li>Transparência: imposto calculado "por fora" e visível na nota.</li><li>Simplificação: uma legislação nacional para o IBS, em vez de 27 RICMS e mais de 5.000 leis de ISS.</li></ul>
`},

{id:'r2', t:'Princípios do novo modelo', h:`
${tbl(['Princípio','Como funciona','O que muda na prática'],[
['Não cumulatividade plena','Crédito sobre tudo o que é adquirido, exceto bens de uso e consumo pessoal listados em lei','Fim das discussões sobre "insumo" e "uso e consumo"'],
['Cobrança "por fora"','O tributo não integra a própria base','A alíquota nominal é a carga real'],
['Princípio do destino','Imposto devido ao local do adquirente ou do consumo','Acaba a disputa entre estados e municípios'],
['Base ampla','Incide sobre bens materiais e imateriais, inclusive direitos, e serviços','Fim da fronteira ICMS x ISS'],
['Alíquota única por ente','Cada estado e município fixa a sua, igual para todos os bens e serviços, salvo regimes previstos em lei','Fim de alíquotas por produto'],
['Split payment','O tributo pode ser separado e recolhido no momento do pagamento eletrônico','Menos inadimplência e sonegação'],
['Cashback','Devolução de parte do IBS e da CBS a famílias de baixa renda inscritas no CadÚnico','Reduz a regressividade'],
['Crédito condicionado ao pagamento','Em regra, o crédito do adquirente depende da extinção do débito do fornecedor','Cuidado redobrado com fornecedores']])}
${ex('Por dentro x por fora',`${tbl(['','Hoje: ICMS 18% por dentro','Novo: IVA 26,5% por fora'],[['Valor da mercadoria sem tributo',R(820),R(1000)],['Tributo',R(180),R(265)],['Preço final',R(1000),R(1265)],['Alíquota nominal','18%','26,5%'],['Carga real sobre o valor sem tributo','21,95%','26,5%']])}
<p>No novo modelo, o que está escrito é o que se paga. No atual, a alíquota "esconde" parte da carga.</p>`)}
${aten('A alíquota de 26,5% (17,7% de IBS e 8,8% de CBS) é uma estimativa de referência usada nos estudos da reforma. As alíquotas efetivas serão fixadas pelo Senado e pelos entes federativos.')}
`},

{id:'r3', t:'Cronograma de transição', h:`
<p class="lead">A troca é gradual. Por alguns anos, os dois sistemas convivem na mesma nota fiscal.</p>
<div class="tl">
<div class="y now"><b>2026</b><p><strong>Ano-teste.</strong> CBS de 0,9% e IBS de 0,1% destacados nas notas. Valores compensáveis com PIS/Cofins; quem cumpre as obrigações acessórias fica dispensado do recolhimento (LC 214/2025, arts. 343, 346 e 348).</p></div>
<div class="y"><b>2027</b><p>CBS entra em vigor com alíquota cheia. <strong>PIS e Cofins são extintos.</strong> IPI vai a zero (exceto produtos da ZFM). Imposto Seletivo começa. IBS segue em 0,1% (0,05% estadual e 0,05% municipal), com a CBS reduzida em 0,1 ponto.</p></div>
<div class="y"><b>2028</b><p>Mesma regra de 2027.</p></div>
<div class="y"><b>2029</b><p>Começa a substituição do ICMS e do ISS: alíquotas reduzidas a 90% das atuais; o IBS cresce na proporção.</p></div>
<div class="y"><b>2030</b><p>ICMS e ISS a 80%.</p></div>
<div class="y"><b>2031</b><p>ICMS e ISS a 70%.</p></div>
<div class="y"><b>2032</b><p>ICMS e ISS a 60%.</p></div>
<div class="y"><b>2033</b><p><strong>ICMS e ISS extintos.</strong> Sistema novo em vigor integral: IBS, CBS e IS.</p></div>
</div>
${dica('Benefícios fiscais de ICMS também vão sendo reduzidos na mesma proporção entre 2029 e 2032. A EC 132 criou um fundo de compensação para benefícios onerosos concedidos até 2032.')}
<p>Veja o efeito ano a ano na <a href="#calc/reforma">calculadora da transição</a>.</p>
`},

{id:'r4', t:'2026 na prática: a nota fiscal com IBS e CBS', h:`
<p class="lead">Em 2026, a principal tarefa do fiscal é emitir e escriturar notas com os novos grupos de IBS e CBS preenchidos corretamente.</p>
${danfe({nat:'Venda de mercadoria adquirida de terceiros',em:['Comercial Alfa Ltda.','SP'],de:['Loja Beta Ltda.','SP'],itens:[{d:'Cadeira de escritório',ncm:'9401.30.10',cst:'000',cfop:'5.102',q:20,v:10000,bc:10000,icms:1800,al:18}],tot:[['ICMS 18%',R(1800)],['PIS + Cofins',R(925)],['CBS 0,9%',R(90),'hl'],['IBS 0,1%',R(10),'hl'],['Total da nota',R(10000)]],obs:'Grupo IBS/CBS preenchido com CST e cClassTrib. Valores de CBS e IBS informativos no ano-teste, compensáveis com PIS/Cofins conforme art. 348 da LC 214/2025.'})}
<h2>O que muda no documento</h2>
<ul><li>Novos campos por item: <strong>CST do IBS/CBS</strong> e <strong>cClassTrib</strong> (código de classificação tributária, que liga a operação ao dispositivo legal), base de cálculo, alíquotas e valores separados de IBS estadual, IBS municipal e CBS.</li><li>Leiaute definido em Notas Técnicas da NF-e (série NT 2025.002 e atualizações). Outros documentos (CT-e, NFS-e padrão nacional, NFC-e) também recebem os grupos.</li><li>Cronograma de obrigatoriedade dos documentos definido pelo Ato Conjunto RFB/CGIBS.</li></ul>
${lei('LC 214/2025, art. 348','Os contribuintes que cumprirem as obrigações acessórias ficam dispensados do recolhimento do IBS e da CBS dos fatos geradores de 2026; o valor da CBS é compensável com PIS/Cofins.')}
${aten('Dispensa de recolhimento não é dispensa de informar. Nota sem os campos corretos pode levar à cobrança do tributo e a penalidades. A base exata de IBS/CBS durante a transição, inclusive quanto à exclusão de ICMS, ISS, PIS e Cofins, segue a LC 214/2025 e as Notas Técnicas vigentes; confira a versão mais recente.')}
`},

{id:'r5', t:'Exemplos de cálculo na cadeia', h:`
<p class="lead">O IVA tributa apenas o valor agregado em cada etapa. Quem vende debita; quem compra credita; no fim, o total arrecadado equivale à alíquota sobre o preço ao consumidor.</p>
${ex('Cadeia com IBS 17,7% e CBS 8,8% (alíquotas de referência)',`${tbl(['Etapa','>Venda sem tributo','>Débito (26,5%)','>Crédito','>Recolhe'],[
['Indústria',R(1000),R(265),R(0),R(265)],['Atacado',R(1500),R(397.50),R(265),R(132.50)],['Varejo',R(2000),R(530),R(397.50),R(132.50)],tot(['Total arrecadado','','','',R(530)])])}
<p>R$ 530 é exatamente 26,5% de R$ 2.000, o valor pago pelo consumidor antes dos tributos. Não há imposto sobre imposto.</p>`)}
${ex('Crédito amplo: material de escritório',`<p>Hoje, o comércio do Lucro Real não credita ICMS nem, em regra, PIS/Cofins na compra de material de escritório. No novo modelo, a compra de R$ 1.000 + R$ 265 de IBS/CBS gera crédito de R$ 265, porque o bem é usado na atividade da empresa.</p>`)}
${ex('Redução de 60%: serviço de saúde',`${tbl(['Item','>Valor'],[['Consulta (valor sem tributo)',R(500)],['Alíquota de referência','26,5%'],['Redução de 60%: alíquota aplicável','10,6%'],tot(['IBS + CBS',R(53)])])}`)}
${ex('Transição em 2029: venda de R$ 10.000 em SP',`${tbl(['Tributo','>Cálculo ilustrativo','>Valor'],[['ICMS a 90% da alíquota de 18%','16,2%',R(1620)],['IBS: 10% da alíquota de referência','1,77%',R(177)],['CBS (alíquota de referência)','8,8%',R(880)]])}
<p>Valores didáticos: a proporção exata do IBS em cada ano será calibrada para manter a arrecadação.</p>`)}
`},

{id:'r6', t:'Regimes diferenciados, específicos e Simples', h:`
${tbl(['Tratamento','Exemplos (LC 214/2025)'],[
['Alíquota zero','Cesta Básica Nacional de Alimentos (Anexo I), hortícolas, frutas e ovos, certos medicamentos e dispositivos médicos e de acessibilidade, ProUni, transporte público coletivo'],
['Redução de 60%','Educação, saúde, dispositivos médicos, medicamentos, alimentos destinados ao consumo humano, higiene e limpeza consumidos por famílias de baixa renda, insumos agropecuários, produções artísticas e culturais'],
['Redução de 30%','Serviços de profissões intelectuais regulamentadas (advogados, contadores, engenheiros, entre outros)'],
['Regimes específicos','Combustíveis (monofásico), serviços financeiros, planos de saúde, bens imóveis, cooperativas, bares e restaurantes, hotelaria, agências de turismo'],
['Produtor rural','Não contribuinte até o limite de receita da lei, com crédito presumido para o adquirente']])}
<h2>Simples Nacional</h2>
<p>O Simples continua existindo. O IBS e a CBS passam a integrar o DAS. A empresa pode optar por recolher IBS e CBS pelo regime regular, fora do DAS, para que seus clientes tenham crédito integral. Para quem vende a outras empresas, essa escolha pode ser decisiva para a competitividade.</p>
${ex('Por que o cliente se importa',`<p>Um fornecedor do Simples que recolhe IBS/CBS no DAS transfere ao cliente crédito apenas no valor efetivamente recolhido no regime. Se optar pelo regime regular, o cliente credita os 26,5% integrais (estimativa). Para o cliente, isso muda o custo líquido da compra.</p>`)}
`},

{id:'r7', t:'Imposto Seletivo', h:`
<p class="lead">O IS é um imposto federal de caráter extrafiscal: busca desestimular o consumo de bens e serviços prejudiciais à saúde ou ao meio ambiente. Começa em 2027.</p>
${tbl(['Incide sobre','Não incide sobre'],[['Veículos, embarcações e aeronaves (com exceções)','Exportações (exceto bens minerais extraídos)'],['Produtos fumígenos','Energia elétrica e telecomunicações'],['Bebidas alcoólicas','Bens e serviços com redução de 60% ou alíquota zero de IBS/CBS'],['Bebidas açucaradas',''],['Bens minerais extraídos',''],['Concursos de prognósticos e fantasy sport','']])}
<p>O IS incide uma única vez (monofásico) e integra a base do IBS e da CBS. As alíquotas são definidas em lei ordinária.</p>
`},

{id:'r8', t:'Como se preparar', h:`
<ol>
<li><strong>Cadastro de produtos:</strong> revisar NCM e NBS; mapear cClassTrib e CST de IBS/CBS por item e operação.</li>
<li><strong>ERP:</strong> garantir a emissão com os grupos de IBS/CBS conforme a Nota Técnica vigente e testar em homologação.</li>
<li><strong>Escrituração:</strong> preparar a apuração assistida de IBS e CBS, que será feita a partir dos documentos fiscais.</li>
<li><strong>Fornecedores:</strong> avaliar quem é do Simples, quem é regular e o efeito no crédito.</li>
<li><strong>Precificação:</strong> simular a carga "por fora" e o fim da cumulatividade nos preços.</li>
<li><strong>Fluxo de caixa:</strong> preparar-se para o split payment, que antecipa o recolhimento ao momento do pagamento.</li>
<li><strong>Benefícios de ICMS:</strong> mapear os incentivos atuais e o impacto da redução gradual de 2029 a 2032.</li>
<li><strong>Contratos:</strong> revisar cláusulas de preço e reajuste em contratos longos que atravessam a transição.</li>
<li><strong>Equipe:</strong> treinar as áreas fiscal, comercial, compras e TI.</li>
</ol>
${dica('Durante a transição, a equipe fiscal vai operar dois sistemas ao mesmo tempo. Manter o domínio do ICMS, PIS/Cofins e obrigações atuais (Níveis 1 a 3) continua indispensável até 2033.')}
`}
]});

const num=id=>{const v=parseFloat(String($('#'+id).value).replace(',','.'));return isNaN(v)?0:v;};
const field=(id,label,val,type='number',extra='')=>`<label>${label}<input id="${id}" type="${type}" inputmode="decimal" step="any" value="${val}" ${extra}></label>`;
const CALCS_FISCAL={
difal:{t:'DIFAL',html:()=>`<h2>Diferencial de alíquotas</h2><p>Calcula o DIFAL por base única e base dupla, com FCP opcional.</p>
<div class="form">${field('dv','Valor da operação (R$)',1000)}${field('dinter','Alíquota interestadual (%)',12)}${field('dint','Alíquota interna no destino (%)',18)}${field('dfcp','FCP no destino (%)',0)}
<label>Método<select id="dm"><option value="dupla">Base dupla</option><option value="unica">Base única</option></select></label></div><div class="res" id="dres"></div>`,
calc(){const v=num('dv'),ai=num('dinter')/100,ad=num('dint')/100,fcp=num('dfcp')/100,m=$('#dm').value;
 const icmsO=v*ai; let s=[],difal,base;
 if(m==='unica'){base=v;difal=v*(ad-ai);s=[`Base: <b>${R(v)}</b>`,`ICMS na origem: ${R(v)} × ${P(ai*100)} = <b>${R(icmsO)}</b>`,`DIFAL: ${R(v)} × (${P(ad*100)} − ${P(ai*100)}) = <b>${R(difal)}</b>`];}
 else{const sem=v-icmsO; base=sem/(1-ad-fcp); const tot=base*ad; difal=tot-icmsO; s=[`ICMS na origem: ${R(v)} × ${P(ai*100)} = <b>${R(icmsO)}</b>`,`Valor sem ICMS de origem: <b>${R(sem)}</b>`,`Base no destino: ${R(sem)} ÷ (1 − ${P((ad+fcp)*100)}) = <b>${R(base)}</b>`,`ICMS no destino: ${R(base)} × ${P(ad*100)} = <b>${R(tot)}</b>`,`DIFAL: ${R(tot)} − ${R(icmsO)} = <b>${R(difal)}</b>`];}
 const f=base*fcp; if(fcp) s.push(`FCP: ${R(base)} × ${P(fcp*100)} = <b>${R(f)}</b>`);
 $('#dres').innerHTML=`<div class="big">${R(difal+f)}</div><div>Total devido ao estado de destino${fcp?' (DIFAL + FCP)':''}</div><div class="steps">${s.map(x=>`<div>${x}</div>`).join('')}</div>`;}},
st:{t:'ICMS-ST',html:()=>`<h2>ICMS por substituição tributária</h2><p>Para operação interna, use a mesma alíquota nos dois campos de alíquota.</p>
<div class="form">${field('sv','Valor dos produtos (R$)',1000)}${field('sipi','IPI (%)',10)}${field('sdesp','Frete e despesas (R$)',0)}${field('smva','MVA original (%)',40)}${field('sop','Alíquota da operação própria (%)',12)}${field('sdest','Alíquota interna no destino (%)',18)}
<label>Ajustar MVA?<select id="saj"><option value="1">Sim (interestadual)</option><option value="0">Não</option></select></label></div><div class="res" id="sres"></div>`,
calc(){const v=num('sv'),ipi=v*num('sipi')/100,d=num('sdesp'),mva=num('smva')/100,ao=num('sop')/100,ad=num('sdest')/100,aj=$('#saj').value==='1'&&ao!==ad;
 const m=aj?((1+mva)*(1-ao)/(1-ad))-1:mva; const bcP=v+d; const icmsP=bcP*ao; const bcST=(v+ipi+d)*(1+m); const st=Math.max(0,bcST*ad-icmsP);
 $('#sres').innerHTML=`<div class="big">${R(st)}</div><div>ICMS-ST a reter · total da nota ${R(v+ipi+d+st)}</div><div class="steps">${[aj?`MVA ajustada: [(1 + ${P(mva*100)}) × (1 − ${P(ao*100)}) ÷ (1 − ${P(ad*100)})] − 1 = <b>${P(m*100)}</b>`:`MVA aplicada: <b>${P(m*100)}</b>`,`ICMS próprio: ${R(bcP)} × ${P(ao*100)} = <b>${R(icmsP)}</b>`,`IPI: <b>${R(ipi)}</b>`,`Base ST: (${R(v)} + ${R(ipi)} + ${R(d)}) × ${(1+m).toFixed(4).replace('.',',')} = <b>${R(bcST)}</b>`,`ICMS total da cadeia: ${R(bcST)} × ${P(ad*100)} = <b>${R(bcST*ad)}</b>`,`ICMS-ST: ${R(bcST*ad)} − ${R(icmsP)} = <b>${R(st)}</b>`].map(x=>`<div>${x}</div>`).join('')}</div>`;}},
apur:{t:'Apuração de ICMS',html:()=>`<h2>Apuração mensal de ICMS</h2><p>Informe os totais do mês. Valores de exemplo da aula de apuração.</p>
<div class="form">${field('ad1','Débitos por saídas (R$)',26400)}${field('ad2','Outros débitos e estornos de crédito (R$)',360)}${field('ac1','Créditos por entradas (R$)',15240)}${field('ac2','Outros créditos (CIAP, ajustes) (R$)',162)}${field('ac3','Saldo credor do mês anterior (R$)',1200)}${field('ad3','Deduções (incentivos) (R$)',0)}</div><div class="res" id="ares"></div>`,
calc(){const deb=num('ad1')+num('ad2'),cred=num('ac1')+num('ac2')+num('ac3'),ded=num('ad3');const s=deb-cred;
 const pay=s>0?Math.max(0,s-ded):0;
 $('#ares').innerHTML=`<div class="big">${s>0?R(pay):R(-s)}</div><div>${s>0?'ICMS a recolher':'Saldo credor a transportar para o próximo mês'}</div>`+
 tbl(['Campo do E110','>Valor'],[['Total de débitos',R(deb)],['Total de créditos (inclui saldo anterior)',R(cred)],['Saldo devedor',R(Math.max(0,s))],['Deduções',R(ded)],tot(['ICMS a recolher',R(pay)]),['Saldo credor a transportar',R(Math.max(0,-s))]]);}},
reforma:{t:'Transição da reforma',html:()=>`<h2>Transição 2026–2033</h2><p>Simula a composição dos tributos sobre o consumo em uma venda, ano a ano. Usa as alíquotas de referência (CBS 8,8% e IBS 17,7%) e proporções didáticas.</p>
<div class="form">${field('rv','Valor da operação (R$)',10000)}${field('ricms','Alíquota de ICMS atual (%)',18)}
<label>Regime de PIS/Cofins<select id="rpc"><option value="9.25">Não cumulativo (9,25%)</option><option value="3.65">Cumulativo (3,65%)</option></select></label>
<label>Ano<input id="ry" type="range" min="2026" max="2033" step="1" value="2026" style="padding:0;accent-color:var(--teal)"></label></div><div class="res" id="rres"></div>`,
calc(){const v=num('rv'),ic=num('ricms'),pc=parseFloat($('#rpc').value),y=+$('#ry').value;
 const icf={2026:1,2027:1,2028:1,2029:.9,2030:.8,2031:.7,2032:.6,2033:0}[y];
 let cbs,ibs,pis,note;
 if(y===2026){cbs=.9;ibs=.1;pis=pc;note='Ano-teste: CBS e IBS destacados e compensáveis/dispensados (art. 348 da LC 214/2025). Carga efetiva igual à de hoje.';}
 else if(y<=2028){cbs=8.7;ibs=.1;pis=0;note='CBS cheia (reduzida em 0,1 ponto), PIS/Cofins extintos, IBS em 0,1%.';}
 else if(y<2033){cbs=8.8;ibs=17.7*(1-icf);pis=0;note=`ICMS a ${Math.round(icf*100)}% da alíquota atual; IBS cresce na mesma proporção (proporção didática).`;}
 else{cbs=8.8;ibs=17.7;pis=0;note='Sistema novo integral: ICMS e ISS extintos.';}
 const items=[['ICMS',v*ic*icf/100,'var(--l1)'],['PIS/Cofins',v*pis/100,'var(--ink3)'],['CBS',v*cbs/100,'var(--l4)'],['IBS',v*ibs/100,'var(--l2)']];
 const real=y===2026?items.filter(i=>i[0]!=='CBS'&&i[0]!=='IBS'):items; const total=real.reduce((a,b)=>a+b[1],0);
 const all=items.reduce((a,b)=>a+b[1],0)||1;
 $('#rres').innerHTML=`<div class="big">${y}</div><div>${note}</div>
 <div class="stack" role="img" aria-label="Composição dos tributos">${items.filter(i=>i[1]>0).map(i=>`<div style="width:${i[1]/all*100}%;background:${i[2]}">${i[1]/all>.08?i[0]:''}</div>`).join('')}</div>
 <div class="legend">${items.map(i=>`<span style="--c:${i[2]}">${i[0]}</span>`).join('')}</div>`+
 tbl(['Tributo','>Alíquota','>Valor'],[...items.map(i=>[i[0]+(y===2026&&(i[0]==='CBS'||i[0]==='IBS')?' (informativo)':''),P(i[0]==='ICMS'?ic*icf:i[0]==='PIS/Cofins'?pis:i[0]==='CBS'?cbs:ibs),R(i[1])]),tot(['Carga efetiva sobre a operação','',R(total)])]);
 }}
};

/* ===== Treinamento: Departamento Pessoal ===== */
function holerite(d){
  const f=(l,v,cls='')=>`<div class="f ${cls}"><small>${l}</small><span>${v}</span></div>`;
  const rows=[...d.prov.map(p=>`<tr><td>${p[0]}</td><td class="r">${p[1]||''}</td><td class="r">${R(p[2])}</td><td class="r"></td></tr>`),...d.desc.map(p=>`<tr><td>${p[0]}</td><td class="r">${p[1]||''}</td><td class="r"></td><td class="r">${R(p[2])}</td></tr>`)].join('');
  const tp=d.prov.reduce((a,b)=>a+b[2],0), td=d.desc.reduce((a,b)=>a+b[2],0);
  return `<div class="danfe"><div class="hd"><span>Recibo de pagamento de salário</span><em>Competência ${d.comp||'09/2026'}</em></div>
  <div class="row" style="grid-template-columns:2fr 1fr">${f('Empregador',d.emp||'Comercial Alfa Ltda.')}${f('CNPJ','12.345.678/0001-90')}</div>
  <div class="row" style="grid-template-columns:2fr 1fr 1fr">${f('Empregado',d.func)}${f('Cargo',d.cargo)}${f('Admissão',d.adm||'01/02/2023')}</div>
  <div class="tw" style="margin:0;border:0;border-bottom:1px solid var(--ink)"><table><thead><tr><th>Descrição</th><th class="r">Referência</th><th class="r">Proventos</th><th class="r">Descontos</th></tr></thead><tbody>${rows}
  <tr class="tot"><td>Totais</td><td></td><td class="r">${R(tp)}</td><td class="r">${R(td)}</td></tr></tbody></table></div>
  <div class="row" style="grid-template-columns:repeat(4,1fr)">${f('Base INSS',R(d.bInss))}${f('Base FGTS',R(d.bFgts))}${f('FGTS do mês (8%)',R(d.bFgts*0.08))}${f('Líquido a receber',R(tp-td),'hl')}</div></div>`;
}

{id:'dp1', t:'O que faz o Departamento Pessoal', h:`
<p class="lead">O Departamento Pessoal (DP) cuida de toda a relação formal entre empresa e empregado: da admissão ao desligamento, passando por jornada, folha, benefícios, encargos e informações ao governo.</p>
<p>Enquanto o RH olha para atração, desenvolvimento e clima, o DP garante que cada direito e cada obrigação legal seja cumprido no prazo, com cálculo correto e informado no eSocial.</p>
<h2>O ciclo mensal do DP</h2>
${flow([['Movimentações','Admissões, afastamentos, férias, alterações salariais'],['Ponto','Fechar jornada, horas extras, faltas e atrasos'],['Folha','Calcular proventos, descontos e encargos'],['Conferência','Revisar bases de INSS, FGTS e IRRF'],['Pagamento','Salário até o 5º dia útil; guias até o dia 20'],['Declarações','eSocial, DCTFWeb e FGTS Digital']])}
<h2>Quem é empregado e quem é empregador</h2>
<p>Pela CLT, empregado é a pessoa física que presta serviço de forma <strong>pessoal, não eventual, onerosa e subordinada</strong>. Faltando um desses requisitos, a relação pode ser outra: autônomo, estagiário, prestador de serviço.</p>
${tbl(['Requisito','Significado','Exemplo de ausência'],[['Pessoalidade','O próprio contratado presta o serviço','Prestador que manda outra pessoa no lugar'],['Não eventualidade','Trabalho ligado à rotina da empresa, com continuidade','Um conserto pontual'],['Onerosidade','Há pagamento pelo trabalho','Voluntariado'],['Subordinação','Recebe ordens e é dirigido pelo empregador','Profissional autônomo que define como trabalha']])}
${lei('CLT, arts. 2º e 3º','Definem empregador (quem assume os riscos da atividade e dirige a prestação de serviços) e empregado (pessoa física que presta serviço não eventual, sob dependência e mediante salário).')}
${erro('Contratar como "PJ" quem trabalha com subordinação, horário e exclusividade. Se os requisitos do art. 3º estiverem presentes, o vínculo pode ser reconhecido na Justiça, com todos os encargos retroativos.')}
`},

{id:'dp2', t:'Legislação base', h:`
<p class="lead">O DP trabalha com normas de origens diferentes. A regra mais favorável, a convenção coletiva e as normas do Ministério do Trabalho se combinam com a CLT.</p>
${flow([['Constituição','Direitos mínimos dos trabalhadores (art. 7º)'],['Leis','CLT e leis específicas (FGTS, 13º, previdência)'],['Decretos e portarias','Regulamentam: ponto, eSocial, tabelas anuais'],['Normas coletivas','Convenção e acordo coletivo da categoria'],['Contrato e regulamento','Regras da empresa e do contrato individual']])}
${tbl(['Tema','Norma base','O que regula'],[
['Direitos fundamentais','CF art. 7º','Salário mínimo, jornada, férias, 13º, FGTS, licenças'],
['Relação de emprego','CLT (Decreto-Lei 5.452/1943)','Contrato, jornada, férias, rescisão, normas coletivas'],
['Reforma trabalhista','Lei 13.467/2017','Negociado sobre o legislado, intermitente, teletrabalho, acordo de rescisão'],
['FGTS','Lei 8.036/1990','Depósitos de 8%, saques, multa rescisória'],
['Contribuições previdenciárias','Lei 8.212/1991','INSS do empregado e da empresa, RAT, terceiros'],
['Benefícios previdenciários','Lei 8.213/1991 e Decreto 3.048/1999','Auxílios, salário-maternidade, salário-família, estabilidade acidentária'],
['13º salário','Lei 4.090/1962 e Lei 4.749/1965','Valor e prazos das parcelas'],
['Vale-transporte','Lei 7.418/1985','Concessão e desconto de até 6%'],
['Repouso semanal','Lei 605/1949','DSR e feriados'],
['Aviso prévio','Lei 12.506/2011','Aviso proporcional ao tempo de serviço'],
['Imposto de renda','Lei 9.250/1995 e Lei 15.270/2025','Tabela do IRRF e a redução para rendas até R$ 7.350'],
['Domésticos','LC 150/2015','Regras próprias do empregado doméstico'],
['Estágio e temporário','Lei 11.788/2008 · Lei 6.019/1974','Estágio (não é emprego) e trabalho temporário/terceirização']])}
<h2>Negociado sobre o legislado</h2>
<p>Desde a Lei 13.467/2017, a convenção e o acordo coletivo prevalecem sobre a lei em temas como banco de horas, intervalo intrajornada (respeitado o mínimo de 30 minutos para jornadas acima de 6 horas), troca de feriado e plano de cargos. Mas não podem reduzir direitos do art. 611-B, como FGTS, 13º, férias e salário mínimo.</p>
${lei('CLT, arts. 611-A e 611-B','Listam o que a negociação coletiva pode ajustar (611-A) e o que é proibido suprimir ou reduzir (611-B).')}
${dica('Tenha sempre à mão a convenção coletiva vigente da categoria. Ela costuma definir piso salarial, reajuste, adicionais maiores que os da lei e benefícios obrigatórios.')}
`},

{id:'dp3', t:'Admissão e tipos de contrato', h:`
<p class="lead">Uma admissão bem feita evita a maioria dos problemas futuros. O ponto crítico é informar o eSocial antes de o empregado começar a trabalhar.</p>
${flow([['Documentos','Identidade, CPF, comprovante de endereço, dependentes, PIS'],['Exame admissional','ASO emitido pelo médico do trabalho (NR-7)'],['Contrato','Tipo, função, salário, jornada e local'],['eSocial S-2200','Até o dia anterior ao início das atividades'],['Benefícios','VT, VA/VR, plano de saúde, dependentes de IR e salário-família']])}
${lei('CLT, arts. 29 e 41 · NR-7','A CTPS é digital e alimentada pelo eSocial. O registro do empregado é obrigatório desde o primeiro dia, e o exame admissional deve ser feito antes de o trabalhador assumir as atividades.')}
<h2>Tipos de contrato</h2>
${tbl(['Contrato','Característica principal','Base legal'],[
['Prazo indeterminado','Regra geral, sem data de término','CLT art. 443'],
['Experiência','Até 90 dias, com uma única prorrogação dentro desse limite','CLT arts. 445 e 451'],
['Prazo determinado','Até 2 anos, em hipóteses específicas','CLT art. 443, §2º'],
['Tempo parcial','Até 30 h semanais sem hora extra, ou até 26 h com até 6 h extras','CLT art. 58-A'],
['Intermitente','Trabalho alternado com períodos de inatividade, pago por hora trabalhada','CLT art. 452-A'],
['Teletrabalho','Prestação preponderante ou não fora da empresa, por jornada, produção ou tarefa','CLT arts. 75-A a 75-F'],
['Aprendiz','14 a 24 anos, com formação técnico-profissional; FGTS de 2%','CLT art. 428'],
['Temporário','Contratado por empresa de trabalho temporário, até 180 dias prorrogáveis por 90','Lei 6.019/1974'],
['Estágio','Ato educativo, sem vínculo de emprego, com termo de compromisso','Lei 11.788/2008']])}
${ex('Contrato de experiência',`<p>Admissão em 01/10/2026 com contrato de experiência de 45 dias, prorrogável por mais 45. O primeiro período termina em 14/11/2026; o segundo, em 29/12/2026, completando 90 dias. Se o empregado continuar trabalhando depois disso, o contrato passa automaticamente a prazo indeterminado.</p>`)}
${erro('Enviar o S-2200 depois que o empregado já começou. Sem o registro prévio, a empresa fica sujeita a multa por empregado sem registro (CLT art. 47).')}
`},

{id:'dp4', t:'Jornada, ponto e intervalos', h:`
<p class="lead">Controlar a jornada é a base de uma folha correta: dela saem horas extras, adicional noturno, faltas e DSR.</p>
${tbl(['Regra','Limite','Base legal'],[
['Jornada normal','8 h por dia e 44 h por semana','CF art. 7º, XIII'],
['Horas extras','Até 2 h por dia, com adicional mínimo de 50%','CLT art. 59'],
['Banco de horas','Compensação em até 6 meses (acordo individual) ou 1 ano (negociação coletiva)','CLT art. 59, §§2º e 5º'],
['Intervalo intrajornada','1 a 2 h para jornada acima de 6 h; 15 min entre 4 e 6 h','CLT art. 71'],
['Intervalo entre jornadas','Mínimo de 11 h','CLT art. 66'],
['Trabalho noturno urbano','Das 22 h às 5 h, adicional de 20% e hora de 52 min 30 s','CLT art. 73'],
['Controle de ponto','Obrigatório para estabelecimentos com mais de 20 empregados','CLT art. 74, §2º']])}
${lei('Portaria MTP 671/2021','Regulamenta os sistemas de registro de ponto: relógio convencional (REP-C), alternativo autorizado em norma coletiva (REP-A) e por programa (REP-P), e os requisitos do comprovante e dos arquivos.')}
${ex('Intervalo suprimido',`<p>Empregado com jornada de 8 h teve só 30 minutos de almoço. Desde a reforma, a empresa paga apenas os 30 minutos suprimidos, com acréscimo de 50% sobre a hora normal, e essa verba tem natureza indenizatória (sem INSS e FGTS).</p>`)}
${ex('Hora noturna reduzida',`<p>Quem trabalha das 22 h às 5 h fica 7 horas no relógio, mas recebe por 8 horas noturnas: 420 minutos ÷ 52,5 = 8 horas, cada uma com adicional de 20%.</p>`)}
${aten('Convenções coletivas costumam prever adicionais de hora extra maiores que 50% e regras próprias de banco de horas. Aplique sempre a regra mais específica da categoria.')}
`},

{id:'dp5', t:'Salário, remuneração e adicionais', h:`
<p class="lead">Salário é o que o empregador paga diretamente pelo trabalho. Remuneração é o salário somado às gorjetas. A diferença importa para saber o que sofre INSS, FGTS e IRRF.</p>
${tbl(['Verba','Integra o salário?','INSS','FGTS','IRRF'],[
['Salário base, horas extras, adicionais, comissões','Sim','Sim','Sim','Sim'],
['DSR sobre horas extras e comissões','Sim','Sim','Sim','Sim'],
['Ajuda de custo, diárias, prêmios e abonos (art. 457, §2º)','Não','Não','Não','Sim, em regra'],
['Vale-transporte e alimentação no PAT (não em dinheiro)','Não','Não','Não','Não'],
['Participação nos lucros (PLR)','Não','Não','Não','Tabela própria'],
['Férias indenizadas e aviso prévio indenizado','—','Não','FGTS só no aviso','Não']])}
<h2>Adicionais legais</h2>
${tbl(['Adicional','Percentual','Base de cálculo'],[['Horas extras','Mínimo de 50% (100% em domingos e feriados na maioria das convenções)','Valor da hora normal'],['Noturno','20% (urbano)','Hora diurna'],['Insalubridade','10%, 20% ou 40%, conforme grau (NR-15)','Salário mínimo, salvo norma coletiva'],['Periculosidade','30%','Salário base (NR-16)'],['Transferência','25%, enquanto durar a transferência provisória','Salário']])}
${ex('Periculosidade',`<p>Eletricista com salário de R$ 3.500,00: adicional de 30% = R$ 1.050,00. Remuneração mensal: R$ 4.550,00, base para INSS, FGTS, férias e 13º.</p>`)}
${lei('CLT, arts. 457, 458, 192 e 193','Definem salário, remuneração, salário in natura, parcelas que não integram o salário e os adicionais de insalubridade e periculosidade.')}
${erro('Pagar "prêmio" fixo todo mês sem metas ou desempenho excepcional. A Receita e a Justiça podem tratá-lo como salário disfarçado, exigindo encargos.')}
`},

{id:'dp6', t:'Folha de pagamento e holerite', h:`
<p class="lead">A folha reúne, para cada empregado, os proventos e os descontos do mês. O holerite é o recibo que mostra esse cálculo.</p>
${holerite({func:'Maria Oliveira',cargo:'Assistente fiscal',prov:[['Salário base','30 dias',4000],['Horas extras 50%','10 h',272.73],['DSR sobre horas extras','',54.55]],desc:[['INSS','progressivo',407.87],['IRRF','isento*',0],['Vale-transporte','6%',240],['Adiantamento salarial','40%',1600]],bInss:4327.28,bFgts:4327.28})}
<p style="font-size:14px;color:var(--ink3)">* Pela tabela, o IRRF seria de R$ 206,38, mas a redução da Lei 15.270/2025 zera o imposto para rendimentos tributáveis de até R$ 5.000,00.</p>
<h2>Como cada linha foi calculada</h2>
${tbl(['Item','>Cálculo'],[
['Valor da hora','4.000 ÷ 220 = R$ 18,18'],['Hora extra 50%','18,18 × 1,5 × 10 h = R$ 272,73'],['DSR sobre HE (25 dias úteis, 5 domingos e feriados)','272,73 ÷ 25 × 5 = R$ 54,55'],
['INSS progressivo sobre R$ 4.327,28','121,58 + 115,37 + 170,93 = R$ 407,87'],['Vale-transporte','6% do salário base = R$ 240,00 (limitado ao custo do benefício)'],['FGTS (não é desconto)','8% de R$ 4.327,28 = R$ 346,18, depositado pela empresa']])}
${dica('O FGTS aparece no holerite apenas como informação. É um encargo da empresa, nunca um desconto do empregado.')}
${aten('O salário deve ser pago até o 5º dia útil do mês seguinte (CLT art. 459, §1º). Para contar dias úteis, o sábado entra; domingos e feriados não.')}
`},

{id:'dp7', t:'Benefícios e licenças', h:`
${tbl(['Benefício','Regra principal','Base legal'],[
['Vale-transporte','Obrigatório quando solicitado; desconto de até 6% do salário base','Lei 7.418/1985'],
['Alimentação (PAT)','Opcional; no PAT não integra o salário','Lei 6.321/1976 e Lei 14.442/2022'],
['Salário-família','R$ 67,54 por filho até 14 anos, para remuneração até R$ 1.980,38 (2026)','Lei 8.213/1991 e Portaria Interministerial MPS/MF 13/2026'],
['Salário-maternidade','120 dias; mais 60 dias no Programa Empresa Cidadã','Lei 8.213/1991 · Lei 11.770/2008'],
['Licença-paternidade','5 dias; mais 15 dias no Programa Empresa Cidadã','CF/ADCT art. 10 · Lei 11.770/2008'],
['Auxílio por incapacidade','Empresa paga os primeiros 15 dias; o INSS, a partir do 16º','Lei 8.213/1991, art. 60']])}
${ex('Salário-família',`<p>Empregado com salário de R$ 1.900,00 e dois filhos de 5 e 9 anos recebe 2 × R$ 67,54 = R$ 135,08 no holerite. A empresa paga e compensa o valor na DCTFWeb. Se o salário passar de R$ 1.980,38, o benefício deixa de ser devido.</p>`)}
<h2>Faltas justificadas mais comuns</h2>
${tbl(['Motivo','Dias sem desconto (CLT art. 473)'],[['Falecimento de cônjuge, ascendente, descendente, irmão ou dependente','Até 2 dias consecutivos'],['Casamento','Até 3 dias consecutivos'],['Nascimento de filho','Licença-paternidade'],['Doação voluntária de sangue','1 dia a cada 12 meses'],['Alistamento eleitoral','Até 2 dias'],['Exames preventivos de câncer','Até 3 dias a cada 12 meses']])}
${aten('Há propostas legislativas para ampliar a licença-paternidade. Confira sempre a regra vigente na data do nascimento.')}
`},

{id:'dp8', t:'Encargos e custo do empregado', h:`
<p class="lead">Além do salário, a empresa recolhe encargos sobre a folha e provisiona férias e 13º. Entender esse custo é essencial para orçamento e precificação.</p>
${tbl(['Encargo','Alíquota usual','Observação'],[
['INSS patronal','20%','Sobre a remuneração; não se aplica ao Simples Nacional (exceto Anexo IV)'],
['RAT/SAT ajustado','1%, 2% ou 3% × FAP (0,5 a 2,0)','Risco de acidente da atividade'],
['Terceiros (Sistema S, salário-educação, Incra)','Em torno de 5,8%','Varia conforme o código FPAS'],
['FGTS','8% (2% para aprendiz)','Depositado via FGTS Digital até o dia 20']])}
${ex('Custo mensal de um empregado de R$ 3.000 (Lucro Presumido, RAT 2%, FAP 1,0)',`${tbl(['Item','>Valor'],[['Salário',R(3000)],['INSS patronal 20%',R(600)],['RAT 2% × FAP 1,0',R(60)],['Terceiros 5,8%',R(174)],['FGTS 8%',R(240)],['Provisão de férias + 1/3 (11,11%)',R(333.33)],['Provisão de 13º (8,33%)',R(250)],tot(['Custo mensal aproximado',R(4657.33)])])}
<p>O custo chega a cerca de 55% acima do salário, antes de benefícios e dos encargos incidentes sobre as próprias provisões. No Simples Nacional (anexos I, II, III e V), o INSS patronal, o RAT e terceiros estão dentro do DAS.</p>`)}
${lei('Lei 8.212/1991, art. 22 · Lei 8.036/1990, art. 15','Fixam a contribuição da empresa sobre a folha e o depósito mensal de 8% do FGTS.')}
`}
]},

{ n:2, title:'Nível intermediário', sub:'INSS, IRRF, horas extras, férias, 13º, afastamentos e rescisão', lessons:[

{id:'dpi1', t:'INSS do empregado em 2026', h:`
<p class="lead">O desconto do INSS é progressivo: cada alíquota incide só sobre a parte do salário que está dentro da faixa, até o teto.</p>
${tbl(['Faixa de salário de contribuição (2026)','Alíquota'],[['Até R$ 1.621,00','7,5%'],['De R$ 1.621,01 a R$ 2.902,84','9%'],['De R$ 2.902,85 a R$ 4.354,27','12%'],['De R$ 4.354,28 a R$ 8.475,55 (teto)','14%']])}
${lei('Portaria Interministerial MPS/MF 13/2026','Fixa o teto de R$ 8.475,55, as faixas de 2026, o salário mínimo de R$ 1.621,00 como piso e os valores do salário-família.')}
${ex('Salário de R$ 3.000,00',`${tbl(['Faixa','>Base na faixa','>Alíquota','>INSS'],[['1ª',R(1621),'7,5%',R(121.58)],['2ª',R(1281.84),'9%',R(115.37)],['3ª',R(97.16),'12%',R(11.66)],tot(['Total','','',R(248.60)])])}<p>O cálculo é feito sem arredondar cada faixa; por isso a soma das parcelas exibidas pode diferir em um centavo. Alíquota efetiva: 8,29%.</p>`)}
${ex('Salário acima do teto: R$ 10.000,00',`<p>A contribuição para no teto de R$ 8.475,55: 121,58 + 115,37 + 174,17 + 576,98 = <strong>R$ 988,09</strong>, o desconto máximo de 2026.</p>`)}
${erro('Aplicar a alíquota da faixa sobre o salário inteiro (ex.: 12% × 3.000 = R$ 360). Sem a progressividade, o desconto fica errado.')}
<p>Use a <a href="#calc/liq">calculadora de salário líquido</a> para testar outros valores.</p>
`},

{id:'dpi2', t:'IRRF em 2026 e a Lei 15.270/2025', h:`
<p class="lead">O IRRF é calculado em três passos: base de cálculo, imposto pela tabela progressiva e, a partir de 2026, a redução da Lei 15.270/2025.</p>
${tbl(['Base de cálculo mensal','Alíquota','Parcela a deduzir'],[['Até R$ 2.428,80','Isento','—'],['De R$ 2.428,81 a R$ 2.826,65','7,5%','R$ 182,16'],['De R$ 2.826,66 a R$ 3.751,05','15%','R$ 394,16'],['De R$ 3.751,06 a R$ 4.664,68','22,5%','R$ 675,49'],['Acima de R$ 4.664,68','27,5%','R$ 908,73']])}
<ul><li><strong>Deduções legais:</strong> INSS, R$ 189,59 por dependente e pensão alimentícia judicial.</li><li><strong>Desconto simplificado:</strong> R$ 607,20, usado no lugar das deduções legais quando for mais vantajoso.</li></ul>
${tbl(['Rendimentos tributáveis no mês','Redução do imposto (Lei 15.270/2025)'],[['Até R$ 5.000,00','Até R$ 312,89, zerando o imposto'],['De R$ 5.000,01 a R$ 7.350,00','R$ 978,62 − (0,133145 × rendimentos tributáveis)'],['Acima de R$ 7.350,00','Sem redução']])}
${lei('Lei 9.250/1995 e Lei 15.270/2025','A Lei 9.250 traz a tabela progressiva e as deduções. A Lei 15.270/2025, sancionada em 26/11/2025, criou a redução mensal a partir de janeiro de 2026.')}
${ex('Salário de R$ 6.000,00, sem dependentes',`${tbl(['Passo','>Valor'],[['INSS',R(641.51)],['Base pelas deduções legais: 6.000 − 641,51',R(5358.49)],['Base pelo simplificado: 6.000 − 607,20',R(5392.80)],['Usa a menor base',R(5358.49)],['Imposto pela tabela: 5.358,49 × 27,5% − 908,73',R(564.85)],['Redução: 978,62 − 0,133145 × 6.000',R(179.75)],tot(['IRRF a descontar',R(385.10)])])}`)}
${ex('Salário de R$ 4.000,00',`<p>INSS de R$ 368,60; base de R$ 3.392,80 pelo simplificado; imposto pela tabela de R$ 114,76. Como o rendimento é de até R$ 5.000,00, a redução zera o imposto: <strong>IRRF = R$ 0,00</strong>.</p>`)}
${aten('O 13º salário tem tributação exclusiva, calculada separadamente. Para aplicar ou não a redução da Lei 15.270/2025 ao 13º, siga a orientação vigente da Receita Federal.')}
`},

{id:'dpi3', t:'Horas extras, DSR e adicional noturno', h:`
${flow([['Valor da hora','Salário ÷ horas mensais (220 para 44 h semanais)'],['Adicional','Hora × (1 + percentual)'],['Total de HE','Valor da HE × quantidade'],['DSR','Total de HE ÷ dias úteis × domingos e feriados']])}
${ex('Salário de R$ 2.200,00, 220 h mensais',`${tbl(['Item','>Cálculo','>Valor'],[['Valor da hora','2.200 ÷ 220',R(10)],['10 HE a 50%','10 × 15,00',R(150)],['4 HE a 100% (feriado)','4 × 20,00',R(80)],['DSR: 25 dias úteis e 5 domingos/feriados','230 ÷ 25 × 5',R(46)],tot(['Total de horas extras com DSR','',R(276)])])}`)}
${ex('Adicional noturno',`<p>Mesmo salário, 20 horas noturnas no mês: hora noturna = 10,00 × 20% = R$ 2,00 de adicional. Total: 20 × 2,00 = R$ 40,00, mais o DSR correspondente. Se a hora noturna também for extra, aplica-se o adicional de HE sobre a hora já acrescida do noturno.</p>`)}
${lei('Lei 605/1949 e Súmula 172 do TST','O repouso semanal remunerado inclui a média das horas extras habituais. Uma falta injustificada na semana faz o empregado perder o DSR daquela semana.')}
<p>Simule na <a href="#calc/he">calculadora de horas extras</a>.</p>
`},

{id:'dpi4', t:'Férias', h:`
${tbl(['Regra','Como funciona','Base legal'],[
['Direito','30 dias a cada 12 meses de trabalho (período aquisitivo)','CLT art. 130'],
['Faltas injustificadas','De 6 a 14 faltas: 24 dias; 15 a 23: 18 dias; 24 a 32: 12 dias; acima de 32: perde o direito','CLT art. 130'],
['Concessão','Nos 12 meses seguintes ao aquisitivo; depois disso, paga-se em dobro','CLT arts. 134 e 137'],
['Fracionamento','Até 3 períodos: um com 14 dias ou mais, os demais com 5 dias ou mais','CLT art. 134, §1º'],
['Aviso','Comunicar com 30 dias de antecedência','CLT art. 135'],
['Pagamento','Até 2 dias antes do início, com o terço constitucional','CLT art. 145 · CF art. 7º, XVII'],
['Abono pecuniário','Venda de até 1/3 das férias, pedida até 15 dias antes do fim do aquisitivo','CLT art. 143']])}
${ex('Férias de 30 dias, salário de R$ 3.000,00',`${tbl(['Item','>Valor'],[['Férias (30 dias)',R(3000)],['1/3 constitucional',R(1000)],['Total bruto',R(4000)],['INSS sobre R$ 4.000,00',R(368.60)],['IRRF (rendimento até R$ 5.000,00, com a redução)',R(0)],tot(['Líquido das férias',R(3631.40)])])}`)}

${erro('Dispensar empregada sem saber da gravidez. A estabilidade independe do conhecimento do empregador, e a reintegração ou a indenização do período é devida.')}

{id:'dpi7', t:'Rescisão do contrato', h:`

${tbl(['Verba','Sem justa causa','Pedido de demissão','Acordo (art. 484-A)','Justa causa'],[

${aten('Informe o desligamento no eSocial (S-2299) em até 10 dias. A guia rescisória do FGTS é emitida no FGTS Digital.')}
<p>Teste outras situações na <a href="#calc/resc">calculadora de rescisão</a>.</p>
`}

{id:'dpa1', t:'eSocial: estrutura e eventos', h:`

{id:'dpa3', t:'DCTFWeb, INSS e IRRF da folha', h:`

${tbl(['Item','Prazo'],[['Transmissão da DCTFWeb','Último dia útil do mês seguinte'],['DARF de INSS e IRRF da folha','Dia 20 do mês seguinte (antecipa se não for dia útil)'],['DCTFWeb do 13º (competência anual)','Até 20 de dezembro']])}
${ex('Compensações na DCTFWeb',`<p>No mês, a empresa deve R$ 18.000,00 de contribuições previdenciárias, pagou R$ 270,16 de salário-família e R$ 4.800,00 de salário-maternidade. A DCTFWeb deduz automaticamente esses benefícios: DARF de R$ 12.929,84.</p>`)}

{id:'dpa5', t:'Como preparar e fechar a folha', h:`

{ n:4, title:'Atualizações 2026', sub:'Lei 15.270/2025, novas tabelas, NR-1, igualdade salarial e reoneração', lessons:[

{id:'dpr1', t:'O que mudou em 2026', h:`
${tbl(['Tema','Antes','Em 2026','Norma'],[
['Salário mínimo','R$ 1.518,00','R$ 1.621,00','Decreto anual do salário mínimo'],
['Teto do INSS','R$ 8.157,41','R$ 8.475,55','Portaria Interministerial MPS/MF 13/2026'],
['Salário-família','R$ 65,00 (limite R$ 1.906,04)','R$ 67,54 (limite R$ 1.980,38)','Portaria Interministerial MPS/MF 13/2026'],
['IRRF','Isenção efetiva até cerca de 2 salários mínimos','Isenção efetiva até R$ 5.000,00 e redução até R$ 7.350,00','Lei 15.270/2025'],
['Riscos psicossociais','Orientação educativa','Obrigatórios no GRO/PGR desde 26/05/2026','NR-1 (Portaria MTE 1.419/2024)'],
['Desoneração da folha','Transição iniciada em 2025','INSS patronal de 10% + 60% da CPRB para setores desonerados','Lei 14.973/2024']])}
${dica('No início de cada ano, revise no sistema de folha: tabela do INSS, tabela e redução do IRRF, salário-família, salário mínimo e pisos das convenções coletivas.')}
`},

{id:'dpr2', t:'Lei 15.270/2025 na prática', h:`
<p class="lead">A lei não mudou a tabela progressiva: criou uma redução do imposto calculado, que zera o IRRF até R$ 5.000,00 de rendimentos tributáveis e diminui gradualmente até R$ 7.350,00.</p>
${tbl(['Salário bruto','>INSS','>IR pela tabela','>Redução','>IRRF final'],[[R(3000),R(248.60),R(0),R(0),R(0)],[R(5000),R(501.51),R(312.89),R(312.89),R(0)],[R(6000),R(641.51),R(564.85),R(179.75),R(385.10)],[R(8000),R(921.51),R(1037.85),R(0),R(1037.85)]])}
<p style="font-size:14px;color:var(--ink3)">Sem dependentes, escolhendo a menor base entre deduções legais e desconto simplificado.</p>
${lei('Lei 15.270/2025','Além da redução do IRRF mensal, institui a tributação mínima das altas rendas e a retenção de 10% sobre lucros e dividendos que excedam R$ 50 mil por mês pagos pela mesma empresa a uma pessoa física.')}
${ex('Reajuste que "faz perder" a isenção',`<p>Um empregado passa de R$ 4.900,00 para R$ 5.100,00. Antes, IRRF zero. Depois: INSS de R$ 515,51 e imposto pela tabela de R$ 335,39 (pelo desconto simplificado, base de R$ 4.492,80, que dá imposto menor que a base legal de R$ 4.584,49), com redução de 978,62 − 0,133145 × 5.100 = R$ 299,58. IRRF: <strong>R$ 35,81</strong>. O aumento líquido continua positivo, porque a redução é gradual.</p>`)}
`},

{id:'dpr3', t:'NR-1 e riscos psicossociais', h:`
<p class="lead">Desde 26 de maio de 2026, as empresas devem identificar, avaliar e controlar os fatores de risco psicossociais no Gerenciamento de Riscos Ocupacionais (GRO) e no PGR.</p>
${lei('NR-1 · Portarias MTE 1.419/2024 e 765/2025','A Portaria 1.419/2024 incluiu os riscos psicossociais no capítulo 1.5 da NR-1; a Portaria 765/2025 adiou a vigência para 26/05/2026. O MTE publicou em março de 2026 um manual de interpretação.')}
<ul><li>Exemplos de fatores: metas excessivas, jornadas extensas, assédio, falta de autonomia, conflitos e violência no trabalho.</li><li>O inventário de riscos e o plano de ação do PGR precisam contemplá-los, com evidências documentais.</li><li>Afastamentos por transtornos mentais e reclamações trabalhistas tendem a usar o PGR como prova.</li></ul>
${dica('O DP fornece dados valiosos para o PGR: horas extras, absenteísmo, afastamentos, turnover e denúncias. Integre esses indicadores ao trabalho de SST.')}
`},

{id:'dpr4', t:'Igualdade salarial', h:`
${lei('Lei 14.611/2023 e Decreto 11.795/2023','Exigem igualdade salarial entre mulheres e homens em trabalho de igual valor ou mesma função, com relatórios semestrais de transparência para empresas com 100 ou mais empregados.')}
<ul><li>Relatório gerado pelo MTE a partir do eSocial, complementado pelas informações da empresa no Portal Emprega Brasil.</li><li>Divulgação em março e setembro, em local visível (site, redes sociais).</li><li>Constatada desigualdade, a empresa deve apresentar plano de ação.</li><li>Multa de até 3% da folha, limitada a 100 salários mínimos, pela não publicação.</li></ul>
${dica('Revise o plano de cargos e salários e os critérios de promoção. Diferenças salariais precisam de justificativa objetiva (tempo na função, produtividade, plano de carreira).')}
`},

{id:'dpr5', t:'Reoneração gradual da folha', h:`
<p class="lead">Os setores que contribuíam sobre a receita bruta (CPRB) voltam gradualmente a pagar o INSS patronal sobre a folha.</p>
${tbl(['Ano','INSS patronal sobre a folha','CPRB sobre a receita'],[['2025','5%','80% da alíquota'],['2026','10%','60% da alíquota'],['2027','15%','40% da alíquota'],['2028','20%','Extinta']])}
${lei('Lei 14.973/2024','Disciplina a transição da desoneração da folha entre 2025 e 2027 e o retorno integral da contribuição sobre a folha em 2028.')}
${ex('Empresa desonerada com folha de R$ 100.000,00 e receita de R$ 1.000.000,00 (CPRB de 4,5%)',`${tbl(['Ano','>Sobre a folha','>CPRB','>Total'],[['2026','R$ 10.000,00','R$ 27.000,00','R$ 37.000,00'],['2027','R$ 15.000,00','R$ 18.000,00','R$ 33.000,00'],['2028','R$ 20.000,00','—','R$ 20.000,00']])}`)}
`},

{id:'dpr6', t:'Como se preparar', h:`
<ol>
<li><strong>Tabelas:</strong> conferir no sistema INSS, IRRF com a redução, salário-família e salário mínimo de 2026.</li>
<li><strong>Rubricas:</strong> revisar incidências da S-1010, especialmente prêmios, abonos e PLR.</li>
<li><strong>Folha:</strong> simular salários próximos de R$ 5.000 e R$ 7.350 para validar a redução do IRRF.</li>
<li><strong>SST:</strong> garantir que o PGR traga os riscos psicossociais e que os eventos S-2220 e S-2240 estejam em dia.</li>
<li><strong>Igualdade salarial:</strong> preparar informações para os relatórios de março e setembro.</li>
<li><strong>Desoneração:</strong> recalcular o custo da folha para os anos de transição.</li>
<li><strong>FGTS Digital:</strong> conciliar guias e pendências mensalmente.</li>
<li><strong>Convenções:</strong> acompanhar data-base e reajustes da categoria.</li>
</ol>
`}
]});

function inss26(s){let t=0,p=0; for(const [l,a] of INSS_F){ if(s>p) t+=(Math.min(s,l)-p)*a; p=l;} return r2(t);}
function irTab(b){for(const [l,a,d] of [[2428.80,0,0],[2826.65,.075,182.16],[3751.05,.15,394.16],[4664.68,.225,675.49],[1e12,.275,908.73]]) if(b<=l) return Math.max(0,r2(b*a-d));}
function irrf26(bruto,inss,dep,pensao,reducao=true){
  const bl=bruto-inss-dep*189.59-(pensao||0), bs=bruto-607.20, simp=bs<bl, base=Math.max(0,Math.min(bl,bs)), t=irTab(base);
  let red=0; if(reducao){ red = bruto<=5000? t : bruto<=7350? Math.max(0,r2(978.62-0.133145*bruto)) : 0; red=Math.min(red,t);} 
  return {bl:r2(bl),bs:r2(bs),simp,base:r2(base),t,red:r2(red),ir:r2(t-red)};
}

function dtv(id){const v=$('#'+id).value; return v?new Date(v+'T12:00:00'):null;}
function avos(a,b){ if(!a||!b||b<a) return 0; let n=0, c=new Date(a); while(n<13){ const nx=new Date(c); nx.setMonth(nx.getMonth()+1); if(nx<=new Date(b.getTime()+864e5)){n++; c=nx;} else { const d=Math.round((b-c)/864e5)+1; if(d>=15) n++; break;} } return Math.min(12,n);}
