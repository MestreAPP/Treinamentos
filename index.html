<p class="lead">O plano de contas é a lista organizada das contas que a empresa usa. Ele padroniza os lançamentos e já nasce na estrutura das demonstrações.</p>
${tbl(['Código','Grupo','Natureza do saldo'],[['1','Ativo (1.1 circulante, 1.2 não circulante)','Devedora'],['2.1 / 2.2','Passivo circulante e não circulante','Credora'],['2.3','Patrimônio líquido','Credora'],['3','Receitas','Credora'],['4','Custos e despesas','Devedora']])}
<ul><li><strong>Circulante:</strong> o que se realiza ou vence em até 12 meses após o balanço.</li><li><strong>Não circulante:</strong> realizável ou exigível a longo prazo, investimentos, imobilizado e intangível.</li><li><strong>Contas redutoras:</strong> têm natureza oposta ao grupo, como depreciação acumulada (reduz o ativo) e PECLD (reduz clientes).</li><li><strong>Contas analíticas</strong> recebem lançamentos; <strong>sintéticas</strong> apenas somam.</li></ul>
${lei('Lei 6.404/1976, arts. 178 a 182','Definem a classificação das contas do balanço: ativo circulante e não circulante, passivo circulante e não circulante e patrimônio líquido.')}
${dica('O plano de contas da empresa deve ser vinculado ao plano referencial da Receita na ECD. Mapear bem desde o início evita retrabalho na entrega anual.')}
<p>Consulte contas e naturezas na aba <a href="#ref">Plano de contas</a>.</p>
`},

{id:'ctb5', t:'Débito, crédito e partidas dobradas', h:`
<p class="lead">Todo fato contábil tem pelo menos um débito e um crédito de mesmo valor. É o método das partidas dobradas: não há débito sem crédito correspondente.</p>
${tbl(['Tipo de conta','Aumenta com','Diminui com'],[['Ativo','Débito','Crédito'],['Passivo','Crédito','Débito'],['Patrimônio líquido','Crédito','Débito'],['Receita','Crédito','—'],['Despesa e custo','Débito','—']])}
${ex('Integralização do capital em dinheiro',`${lanc('01/10/2026',[['D','Bancos conta movimento',50000],['C','Capital social',50000]],'Integralização de capital pelos sócios conforme contrato social')}<p>O ativo (bancos) aumenta com débito; o PL (capital) aumenta com crédito. A equação continua equilibrada.</p>`)}
${ex('Razonetes',`<p>O razonete (ou conta em "T") mostra os débitos à esquerda e os créditos à direita. O saldo é a diferença.</p>${raz(razonete('Bancos',[50000,15000],[2000,8000]),razonete('Fornecedores',[8000],[20000]))}`)}
${erro('Pensar em débito como "coisa ruim" e crédito como "coisa boa". Em contabilidade, são apenas lados do registro: débito é o lado esquerdo, crédito é o direito.')}
`},

{id:'ctb6', t:'Lançamentos do dia a dia', h:`
<p class="lead">A maior parte da rotina se repete todo mês. Dominar estes lançamentos cobre a maioria das operações de uma empresa comercial.</p>
${tbl(['Operação','Débito','Crédito'],[
['Compra de mercadorias a prazo','Estoque (e tributos a recuperar)','Fornecedores'],
['Venda à vista','Caixa/Bancos','Receita de vendas'],
['Baixa do custo da venda','CMV','Estoque'],
['Venda a prazo','Clientes','Receita de vendas'],
['Recebimento de cliente','Bancos','Clientes'],
['Pagamento de fornecedor','Fornecedores','Bancos'],
['Despesa paga à vista','Despesa','Bancos'],
['Despesa a pagar (competência)','Despesa','Contas a pagar'],
['Empréstimo recebido','Bancos','Empréstimos (passivo)'],
['Tarifa bancária','Despesas bancárias','Bancos']])}
${ex('Venda à vista de R$ 15.000 com custo de R$ 9.000',`${lanc('05/10/2026',[['D','Bancos',15000],['C','Receita bruta de vendas',15000]],'Venda conforme NF-e 1.234')}
<div style="height:10px"></div>${lanc('05/10/2026',[['D','Custo das mercadorias vendidas',9000],['C','Estoque de mercadorias',9000]],'Baixa do custo da NF-e 1.234')}
<p>Dois lançamentos: um reconhece a receita, outro o custo. A diferença (R$ 6.000) é o lucro bruto da operação.</p>`)}
${ex('Pagamento de aluguel e de fornecedor',`${lanc('10/10/2026',[['D','Despesa com aluguel',2000],['C','Bancos',2000]],'Aluguel de outubro/2026')}<div style="height:10px"></div>${lanc('15/10/2026',[['D','Fornecedores',8000],['C','Bancos',8000]],'Pagamento parcial da duplicata 556')}`)}
`},

{id:'ctb7', t:'Regime de competência', h:`
<p class="lead">Receitas e despesas são reconhecidas quando acontecem, e não quando o dinheiro entra ou sai. Esse é o regime de competência, obrigatório na contabilidade societária.</p>
${tbl(['Situação','Competência','Caixa'],[['Venda em outubro recebida em novembro','Receita em outubro','Receita em novembro'],['Salário de outubro pago em 5 de novembro','Despesa em outubro','Despesa em novembro'],['Seguro anual pago em janeiro','Despesa de 1/12 por mês','Despesa toda em janeiro']])}
${ex('Seguro anual pago antecipadamente',`<p>Em 01/01, a empresa paga R$ 12.000 de seguro com cobertura de 12 meses.</p>
${lanc('01/01/2026',[['D','Despesas antecipadas – seguros (ativo)',12000],['C','Bancos',12000]],'Apólice 2026')}<div style="height:10px"></div>
${lanc('31/01/2026',[['D','Despesa com seguros',1000],['C','Despesas antecipadas – seguros',1000]],'Apropriação de 1/12')}`)}
${ex('Salários do mês',`${lanc('31/10/2026',[['D','Despesa com salários',50000],['C','Salários a pagar',50000]],'Folha de outubro/2026, paga em novembro')}`)}
${lei('CPC 00 (R2) e Lei 6.404/1976, art. 177','As demonstrações são elaboradas pelo regime de competência. A lei exige que as receitas e despesas sejam incluídas na apuração do resultado do exercício em que ocorrerem.')}
`},

{id:'ctb8', t:'Balancete de verificação', h:`
<p class="lead">O balancete lista todas as contas com seus saldos. Se os lançamentos seguiram as partidas dobradas, a soma dos saldos devedores é igual à soma dos credores.</p>
${ex('Balancete após os lançamentos das aulas anteriores',`${tbl(['Conta','>Devedor','>Credor'],[['Bancos',R(55000),''],['Estoque de mercadorias',R(11000),''],['Fornecedores','',R(12000)],['Capital social','',R(50000)],['Receita bruta de vendas','',R(15000)],['Custo das mercadorias vendidas',R(9000),''],['Despesa com aluguel',R(2000),''],tot(['Totais',R(77000),R(77000)])])}
<p>Movimentos: capital de R$ 50.000, compra a prazo de R$ 20.000, venda de R$ 15.000 (custo R$ 9.000), aluguel de R$ 2.000 e pagamento de R$ 8.000 a fornecedores.</p>`)}
${aten('Balancete fechado não significa contabilidade certa. Um lançamento na conta errada, com débito e crédito iguais, não altera os totais. Por isso as conciliações são indispensáveis.')}
`}
]},

{ n:2, title:'Nível intermediário', sub:'Estoques, receita, imobilizado, provisões, conciliações e encerramento', lessons:[

{id:'cti1', t:'Estoques e CMV', h:`
${lei('CPC 16 (R1) – Estoques','Estoques são mensurados pelo menor valor entre custo e valor realizável líquido. O custo inclui compra, transporte e demais gastos para deixar o item disponível, e exclui tributos recuperáveis. São aceitos PEPS e custo médio; o UEPS não é permitido.')}
${ex('Compra com tributos recuperáveis (Lucro Real)',`<p>Compra de mercadorias por R$ 10.000,00 com ICMS de 18% e PIS/Cofins não cumulativos (9,25% sobre o valor sem ICMS).</p>
${lanc('03/10/2026',[['D','Estoque de mercadorias',7441.50],['D','ICMS a recuperar',1800],['D','PIS/Cofins a recuperar',758.50],['C','Fornecedores',10000]],'NF-e 8.877 – Distribuidora Gama')}
<p>No Simples Nacional ou no Lucro Presumido (PIS/Cofins cumulativos), o que não é recuperável fica no custo do estoque.</p>`)}
${ex('PEPS x custo médio',`<p>Estoque inicial de 100 unidades a R$ 10,00; compra de 200 unidades a R$ 13,00; venda de 150 unidades.</p>
${tbl(['Método','>CMV','>Estoque final'],[['PEPS (primeiro que entra, primeiro que sai)','100 × 10 + 50 × 13 = '+R(1650),'150 × 13 = '+R(1950)],['Custo médio ponderado','150 × 12,00 = '+R(1800),'150 × 12,00 = '+R(1800)]])}
<p>Custo médio: (1.000 + 2.600) ÷ 300 = R$ 12,00. Em preços crescentes, o PEPS mostra CMV menor e lucro maior.</p>`)}
${tbl(['Fórmula do CMV (inventário periódico)'],[['CMV = Estoque inicial + Compras líquidas − Estoque final']])}
<p>Teste na <a href="#calc/estq">calculadora de estoques</a>.</p>
`},

{id:'cti2', t:'Receita e deduções', h:`
${lei('CPC 47 – Receita de contrato com cliente','A receita é reconhecida quando o controle do bem ou serviço é transferido ao cliente, no valor que a empresa espera receber, por meio de cinco etapas: contrato, obrigações de desempenho, preço, alocação e reconhecimento.')}
${ex('Da receita bruta à receita líquida',`${tbl(['DRE','>Valor'],[['Receita bruta de vendas',R(100000)],['(−) Devoluções de vendas','− '+R(5000)],['(−) ICMS sobre vendas (18% de R$ 95.000)','− '+R(17100)],['(−) PIS/Cofins (9,25% sobre R$ 77.900)','− '+R(7205.75)],tot(['Receita líquida',R(70694.25)])])}`)}
${ex('Lançamento do ICMS sobre vendas',`${lanc('31/10/2026',[['D','ICMS sobre vendas (dedução da receita)',17100],['C','ICMS a recolher',17100]],'Apuração do mês')}<div style="height:10px"></div>
${lanc('31/10/2026',[['D','ICMS a recolher',1800],['C','ICMS a recuperar',1800]],'Compensação dos créditos do mês')}`)}
${aten('Com a reforma tributária, IBS e CBS são cobrados "por fora" e tendem a ficar fora da receita bruta, de forma parecida com o IPI hoje. Veja o Nível 4.')}
`},

{id:'cti3', t:'Imobilizado e depreciação', h:`
${lei('CPC 27 – Ativo imobilizado','Itens tangíveis usados na produção, no fornecimento de bens e serviços ou na administração, com uso esperado por mais de um período. São depreciados ao longo da vida útil, considerando o valor residual, com revisão ao menos anual.')}
${ex('Depreciação linear de uma máquina',`${tbl(['Dado','>Valor'],[['Custo de aquisição',R(120000)],['Valor residual estimado',R(12000)],['Vida útil','10 anos'],['Depreciação anual: (120.000 − 12.000) ÷ 10',R(10800)],tot(['Depreciação mensal',R(900)])])}
${lanc('31/10/2026',[['D','Despesa de depreciação',900],['C','(−) Depreciação acumulada – máquinas',900]],'Depreciação mensal')}`)}
${tbl(['Bem','Taxa fiscal usual (IN RFB 1.700/2017, Anexo III)'],[['Edificações','4% ao ano (25 anos)'],['Máquinas e equipamentos','10% ao ano (10 anos)'],['Móveis e utensílios','10% ao ano'],['Veículos','20% ao ano (5 anos)'],['Computadores','20% ao ano']])}
${aten('A taxa fiscal é um limite para dedução no Lucro Real. A depreciação contábil deve refletir a vida útil econômica do bem. Diferenças entre as duas são controladas no LALUR.')}
<p>Simule na <a href="#calc/depr">calculadora de depreciação</a>.</p>
`},

{id:'cti4', t:'Folha, provisões e passivos', h:`
${lei('CPC 25 – Provisões, passivos e ativos contingentes','Provisão é um passivo de prazo ou valor incerto, reconhecido quando há obrigação presente, saída de recursos provável e estimativa confiável. Passivos contingentes possíveis são apenas divulgados em nota.')}
${ex('Lançamentos da folha mensal',`${lanc('31/10/2026',[['D','Despesa com salários',50000],['C','Salários a pagar',41250],['C','INSS a recolher (empregados)',4700],['C','IRRF a recolher',1050],['C','Vale-transporte a recuperar',3000]],'Folha de outubro/2026')}<div style="height:10px"></div>
${lanc('31/10/2026',[['D','Despesa com encargos sociais',17900],['C','INSS a recolher (patronal, RAT e terceiros)',13900],['C','FGTS a recolher',4000]],'Encargos de outubro/2026')}`)}
${ex('Provisão mensal de férias e 13º',`${tbl(['Item','>Cálculo','>Valor'],[['Férias + 1/3','50.000 × 11,11%',R(5555.56)],['13º salário','50.000 × 8,33%',R(4166.67)],['Encargos sobre provisões (INSS 27,8% + FGTS 8%)','9.722,23 × 35,8%',R(3480.56)],tot(['Provisão do mês','',R(13202.79)])])}`)}
${tbl(['Probabilidade de perda','Tratamento contábil'],[['Provável','Reconhece provisão no passivo'],['Possível','Divulga em nota explicativa'],['Remota','Não divulga']])}
`},

{id:'cti5', t:'Clientes, PECLD e fornecedores', h:`
${lei('CPC 48 – Instrumentos financeiros','Exige reconhecer perdas de crédito esperadas sobre contas a receber, e não apenas as já ocorridas. Para recebíveis comerciais, admite-se matriz de provisão por faixa de vencimento.')}
${ex('Matriz de PECLD',`${tbl(['Faixa','>Saldo','>% perda esperada','>PECLD'],[['A vencer',R(150000),'1%',R(1500)],['Vencidos até 90 dias',R(40000),'5%',R(2000)],['Vencidos há mais de 90 dias',R(10000),'30%',R(3000)],tot(['Total',R(200000),'',R(6500)])])}
${lanc('31/10/2026',[['D','Despesa com perdas de crédito esperadas',6500],['C','(−) PECLD',6500]],'Constituição da PECLD')}`)}
${aten('Para o Lucro Real, a dedução fiscal das perdas no recebimento de créditos segue regras próprias (Lei 9.430/1996, art. 9º). A diferença é adicionada no LALUR.')}
${dica('Ajuste a valor presente (CPC 12) é exigido para recebíveis e obrigações de longo prazo e para os de curto prazo com efeito relevante.')}
`},

{id:'cti6', t:'Conciliações', h:`
<p class="lead">Conciliar é comparar o saldo contábil com uma fonte independente e explicar cada diferença. É a principal ferramenta de qualidade do fechamento.</p>
${ex('Conciliação bancária',`${tbl(['Extrato bancário','>Valor','Contabilidade','>Valor'],[['Saldo do extrato',R(48300),'Saldo contábil',R(45000)],['(−) Cheques emitidos não compensados','− '+R(4500),'(−) Tarifa não lançada','− '+R(150)],['(+) Depósito em trânsito',R(2000),'(+) Juros creditados não lançados',R(950)],tot(['Saldo ajustado',R(45800),'Saldo ajustado',R(45800)])])}
<p>Os itens do lado da contabilidade geram lançamentos de ajuste; os do lado do banco se resolvem sozinhos nos dias seguintes.</p>`)}
${tbl(['Conta','Compare com'],[['Bancos e aplicações','Extratos'],['Clientes','Relatório de títulos em aberto do financeiro'],['Fornecedores','Contas a pagar e confirmações'],['Estoques','Inventário físico e relatório de custo'],['Tributos a recolher e a recuperar','Apurações fiscais e guias pagas'],['Folha e encargos','Resumo da folha, DCTFWeb e FGTS Digital'],['Imobilizado','Controle patrimonial e cálculo de depreciação']])}
`},

{id:'cti7', t:'Encerramento do exercício', h:`
${flow([['Ajustes finais','Provisões, depreciação, inventário, conciliações'],['Apuração do resultado','Receitas e despesas transferidas para ARE'],['IR e CSLL','Cálculo dos tributos sobre o lucro'],['Destinação','Reserva legal, outras reservas e dividendos'],['Demonstrações','Balanço, DRE, DMPL, DFC e notas']])}
${ex('Destinação do lucro de uma S.A.',`${tbl(['Item','>Valor'],[['Lucro líquido do exercício',R(60000)],['Reserva legal (5%)',R(3000)],['Lucro ajustado: 60.000 − 3.000',R(57000)],tot(['Dividendo mínimo (estatuto prevê 25%)',R(14250)]),['Saldo à disposição da assembleia',R(42750)]])}
${lanc('31/12/2026',[['D','Lucros acumulados',17250],['C','Reserva legal',3000],['C','Dividendos a pagar',14250]],'Destinação do resultado de 2026')}`)}
${lei('Lei 6.404/1976, arts. 189 a 205','Reserva legal de 5% do lucro até 20% do capital (art. 193). O dividendo obrigatório é o fixado no estatuto; se ele for omisso, é metade do lucro líquido ajustado, e se a assembleia incluir a regra no estatuto não pode fixar menos de 25% (art. 202).')}
${aten('Desde 2026, dividendos acima de R$ 50 mil por mês pagos a uma mesma pessoa física sofrem retenção de 10% de IR (Lei 15.270/2025). Veja o Nível 4.')}
`}
]}
];

LEVELS_CT.push(
{ n:3, title:'Nível avançado', sub:'Demonstrações, análise, ECD, ECF, regimes de tributação e prazos', lessons:[

{id:'cta1', t:'Balanço Patrimonial', h:`
${lei('Lei 6.404/1976, art. 178 · CPC 26 (R1)','O balanço classifica as contas em ativo circulante e não circulante (realizável a longo prazo, investimentos, imobilizado e intangível), passivo circulante e não circulante e patrimônio líquido.')}
${ex('Balanço em 31/12/2026',`${tbl(['Ativo','>Valor','Passivo e PL','>Valor'],[
['<b>Circulante</b>',R(300000),'<b>Circulante</b>',R(200000)],['Caixa e bancos',R(60000),'Fornecedores',R(110000)],['Clientes (líquido de PECLD)',R(120000),'Obrigações trabalhistas e tributárias',R(60000)],['Estoques',R(120000),'Empréstimos de curto prazo',R(30000)],
['<b>Não circulante</b>',R(400000),'<b>Não circulante</b>',R(100000)],['Imobilizado líquido',R(370000),'Empréstimos de longo prazo',R(100000)],['Intangível',R(30000),'<b>Patrimônio líquido</b>',R(400000)],['','','Capital social e reservas',R(400000)],
tot(['Total do ativo',R(700000),'Total do passivo e PL',R(700000)])])}`)}
${aten('A Lei 6.404 também se aplica às sociedades limitadas de grande porte (ativo acima de R$ 240 milhões ou receita acima de R$ 300 milhões), que devem elaborar e auditar as demonstrações (Lei 11.638/2007, art. 3º).')}
`},

{id:'cta2', t:'DRE e resultado abrangente', h:`
${lei('Lei 6.404/1976, art. 187 · CPC 26 (R1)','A DRE apresenta receita bruta, deduções, receita líquida, custo, lucro bruto, despesas operacionais, resultado antes dos tributos, IR e CSLL, participações e lucro líquido.')}
${ex('DRE do exercício de 2026 (Lucro Real)',`${tbl(['Demonstração do resultado','>Valor'],[['Receita bruta',R(1000000)],['(−) Deduções (devoluções e tributos sobre vendas)','− '+R(250000)],tot(['Receita líquida',R(750000)]),['(−) Custo das mercadorias vendidas','− '+R(450000)],tot(['Lucro bruto',R(300000)]),['(−) Despesas com vendas','− '+R(80000)],['(−) Despesas administrativas','− '+R(100000)],['(−) Resultado financeiro líquido','− '+R(20000)],tot(['Resultado antes do IR e CSLL',R(100000)]),['(−) IRPJ 15% (sem adicional: lucro abaixo de R$ 240 mil no ano)','− '+R(15000)],['(−) CSLL 9%','− '+R(9000)],tot(['Lucro líquido',R(76000)])])}
<p>Simplificação: lucro real igual ao contábil, sem adições ou exclusões.</p>`)}
${dica('A Demonstração do Resultado Abrangente (DRA) parte do lucro líquido e soma os "outros resultados abrangentes", como ajustes de conversão e de avaliação patrimonial, que vão direto ao PL.')}
`},

{id:'cta3', t:'DFC, DMPL, DVA e notas explicativas', h:`
${tbl(['Demonstração','Mostra','Obrigatoriedade'],[['DFC – Fluxo de caixa (CPC 03)','Origem e uso do caixa: operacional, investimento, financiamento','Dispensada para companhia fechada com PL inferior a R$ 2 milhões'],['DMPL / DLPA','Movimentação do patrimônio líquido / lucros acumulados','DMPL substitui a DLPA'],['DVA (CPC 09)','Riqueza gerada e distribuída a empregados, governo, financiadores e sócios','Companhias abertas'],['Notas explicativas','Políticas contábeis, estimativas e detalhes das contas','Todas']])}
${ex('DFC pelo método indireto',`${tbl(['Atividades operacionais','>Valor'],[['Lucro líquido',R(76000)],['(+) Depreciação',R(10800)],['(−) Aumento de clientes','− '+R(20000)],['(−) Aumento de estoques','− '+R(15000)],['(+) Aumento de fornecedores',R(8000)],tot(['Caixa líquido das atividades operacionais',R(59800)])])}
<p>O método indireto parte do lucro e ajusta o que não mexe no caixa (depreciação) e as variações do capital de giro.</p>`)}
${lei('Lei 6.404/1976, art. 176','Lista as demonstrações obrigatórias ao fim de cada exercício e a dispensa da DFC para companhias fechadas com patrimônio líquido inferior a R$ 2 milhões.')}
`},

{id:'cta4', t:'Análise por índices', h:`
${ex('Indicadores a partir do balanço e da DRE anteriores',`${tbl(['Índice','Fórmula','>Resultado','Leitura'],[
['Liquidez corrente','AC ÷ PC','1,50','R$ 1,50 de ativo de curto prazo para cada R$ 1 de dívida de curto prazo'],
['Liquidez seca','(AC − Estoques) ÷ PC','0,90','Sem vender estoque, cobre 90% do passivo circulante'],
['Endividamento geral','(PC + PNC) ÷ Ativo total','42,9%','Parcela do ativo financiada por terceiros'],
['Margem bruta','Lucro bruto ÷ Receita líquida','40,0%',''],
['Margem líquida','Lucro líquido ÷ Receita líquida','10,1%',''],
['ROE','Lucro líquido ÷ PL','19,0%','Retorno sobre o capital dos sócios'],
['Giro do ativo','Receita líquida ÷ Ativo total','1,07','']])}`)}
${dica('Indicadores isolados dizem pouco. Compare com períodos anteriores, com o orçamento e com empresas do mesmo setor.')}
<p>Calcule com os seus números na <a href="#calc/ind">calculadora de índices</a>.</p>
`},

{id:'cta5', t:'ECD – Escrituração Contábil Digital', h:`
${lei('IN RFB 2.003/2021','Institui a ECD, que substitui os livros Diário, Razão e balancetes em papel. Obrigatória para o Lucro Real e para o Lucro Presumido que distribui lucros acima da base presumida sem escrituração, entre outros.')}
${tbl(['Item','Regra'],[['Prazo','Último dia útil de junho do ano seguinte'],['Assinatura','Contador (e-CPF) e representante da empresa (e-CPF ou e-CNPJ)'],['Autenticação','Automática pelo SPED (Decreto 8.683/2016), com recibo valendo como autenticação'],['Plano referencial','Vínculo obrigatório das contas analíticas ao plano da Receita'],['Multa por atraso','0,02% por dia sobre a receita bruta, limitada a 1% (Lei 8.218/1991, art. 12, com redações posteriores)']])}
${tbl(['Bloco','Conteúdo'],[['0','Abertura e identificação'],['I','Lançamentos, saldos, plano de contas e demonstrações'],['J','Demonstrações contábeis, termos de abertura e encerramento'],['K','Conglomerados econômicos'],['9','Encerramento']])}
${erro('Transmitir a ECD com o balancete de 31/12 diferente das demonstrações aprovadas ou sem o registro de encerramento das contas de resultado.')}
`},

{id:'cta6', t:'ECF, LALUR e regimes de tributação', h:`
${tbl(['Regime','Quem pode','IRPJ e CSLL'],[
['Simples Nacional','Receita até R$ 4,8 milhões','Dentro do DAS'],
['Lucro Presumido','Receita até R$ 78 milhões no ano anterior','Base presumida sobre a receita: IRPJ 8% (comércio e indústria) ou 32% (serviços); CSLL 12% ou 32%'],
['Lucro Real','Obrigatório acima de R$ 78 milhões e para bancos, factoring e outros','Lucro contábil ajustado no LALUR/LACS'],
['Lucro Arbitrado','Quando a escrituração é imprestável','Base arbitrada pelo fisco ou pela empresa']])}
<ul><li><strong>Alíquotas:</strong> IRPJ de 15% e adicional de 10% sobre a parcela que exceder R$ 20 mil por mês (R$ 60 mil no trimestre); CSLL de 9% para a maioria das empresas.</li><li><strong>LALUR (e-Lalur):</strong> parte A registra adições, exclusões e compensações; parte B controla valores de períodos futuros, como prejuízo fiscal (compensável até 30% do lucro ajustado).</li></ul>
${ex('Lucro Presumido – comércio, receita do trimestre de R$ 900.000',`${tbl(['Item','>Valor'],[['Base do IRPJ: 8% × 900.000',R(72000)],['IRPJ 15%',R(10800)],['Adicional: (72.000 − 60.000) × 10%',R(1200)],['Base da CSLL: 12% × 900.000',R(108000)],['CSLL 9%',R(9720)],tot(['Total de IRPJ e CSLL do trimestre',R(21720)])])}
<p>Como a receita do trimestre não passa de R$ 1,25 milhão, não há acréscimo da LC 224/2025 neste exemplo.</p>`)}
${lei('IN RFB 2.004/2021','Dispõe sobre a ECF, que reúne o e-Lalur, o e-Lacs e as informações econômico-fiscais. Prazo: último dia útil de julho do ano seguinte.')}
<p>Simule na <a href="#calc/lp">calculadora do Lucro Presumido</a>.</p>
`},

{id:'cta7', t:'Fechamento mensal e calendário', h:`
<h2>Checklist de fechamento</h2>
<ol><li>Integrar fiscal, folha e financeiro na contabilidade.</li><li>Conciliar bancos, clientes, fornecedores e tributos.</li><li>Lançar depreciação, amortização, provisões e apropriações.</li><li>Conferir estoque e CMV.</li><li>Revisar o balancete e analisar variações relevantes.</li><li>Apurar IRPJ e CSLL (estimativa mensal ou trimestral).</li><li>Emitir balancete, DRE gerencial e relatório para a gestão.</li></ol>
${tbl(['Quando','Obrigação'],[['Mensal (último dia útil)','DARF de IRPJ/CSLL por estimativa (Lucro Real anual)'],['Trimestral','IRPJ e CSLL do Presumido e do Real trimestral: até o último dia útil do mês seguinte ao trimestre'],['Mensal (último dia útil)','DCTFWeb com MIT (informações vindas da contabilidade e do fiscal)'],['Até 30 de abril','Aprovação das contas pelas S.A. e limitadas (4 meses após o exercício)'],['Último dia útil de junho','ECD'],['Último dia útil de julho','ECF']])}
${aten('Prazos podem ser alterados por instruções normativas. Confira sempre a agenda tributária da Receita Federal.')}
`}
]},

{ n:4, title:'Atualizações 2026', sub:'Reforma tributária na contabilidade, dividendos, LC 224/2025 e sustentabilidade', lessons:[

{id:'ctr1', t:'O que mudou para a contabilidade em 2026', h:`
${tbl(['Tema','Mudança','Norma'],[
['Dividendos','Retenção de 10% sobre lucros acima de R$ 50 mil por mês à mesma pessoa física; IR mínimo para altas rendas','Lei 15.270/2025'],
['Lucro Presumido','Acréscimo de 10% nos percentuais de presunção sobre a receita que exceder R$ 5 milhões no ano','LC 224/2025'],
['Reforma tributária','IBS e CBS destacados nas notas em 2026 (0,1% e 0,9%), com efeitos em estoques, receita e tributos a recuperar','LC 214/2025'],
['Sustentabilidade','Relatórios de sustentabilidade (IFRS S1 e S2) obrigatórios para companhias abertas a partir de 2026','Resolução CVM 193/2023'],
['Folha','Reoneração gradual e novas tabelas de INSS e IRRF afetam provisões e encargos','Lei 14.973/2024 · Lei 15.270/2025']])}
`},

{id:'ctr2', t:'Dividendos e a Lei 15.270/2025', h:`
${lei('Lei 15.270/2025','A partir de 2026, lucros e dividendos pagos por uma pessoa jurídica a uma mesma pessoa física acima de R$ 50 mil no mês sofrem retenção de 10% sobre o total. Os lucros apurados até 2025 mantêm a isenção quando a distribuição foi aprovada até 31/12/2025 e o pagamento ocorre até 2028, nos termos aprovados.')}
${ex('Retenção sobre dividendos',`${tbl(['Pagamento no mês à mesma pessoa física','>IRRF'],[[R(40000),R(0)],[R(50000),R(0)],[R(80000),'10% × 80.000 = '+R(8000)]])}`)}
${tbl(['O que a contabilidade precisa garantir','Por quê'],[['Lucros de até 2025 identificados em conta ou reserva específica','Comprovar a origem isenta'],['Atas e alterações contratuais registradas','Requisito formal da regra de transição'],['Cronograma de pagamento até 2028 seguindo o aprovado','Pagamentos fora do aprovado podem sofrer retenção'],['Controle mensal por sócio','Verificar o limite de R$ 50 mil por fonte pagadora']])}
${aten('Há discussões sobre o prazo da deliberação, a aplicação ao Simples Nacional e a capitalização de lucros, inclusive com manifestações da Receita (perguntas e respostas de dezembro de 2025) e ações judiciais. Acompanhe a orientação vigente.')}
`},

{id:'ctr3', t:'Reforma tributária na contabilidade', h:`
<p class="lead">IBS e CBS são não cumulativos e cobrados "por fora". Na contabilidade, funcionam como tributos recuperáveis: não entram no custo de estoques nem, em regra, na receita.</p>
${ex('Compra em 2027 com CBS (alíquota de referência ilustrativa de 8,8%)',`${lanc('2027',[['D','Estoque de mercadorias',1000],['D','CBS a recuperar',88],['C','Fornecedores',1088]],'Mercadoria de R$ 1.000 + CBS destacada')}`)}
${ex('Venda com CBS destacada',`${lanc('2027',[['D','Clientes',1632],['C','Receita bruta de vendas',1500],['C','CBS a recolher',132]],'Venda de R$ 1.500 + CBS de 8,8%')}
<p>No mês, CBS a recolher de R$ 132 menos CBS a recuperar de R$ 88 = <strong>R$ 44</strong> a pagar, exatamente 8,8% sobre o valor agregado de R$ 500.</p>`)}
<ul><li><strong>2026:</strong> CBS de 0,9% e IBS de 0,1% destacados com efeito informativo e compensável; a contabilidade deve controlar os valores, mesmo sem desembolso.</li><li><strong>Split payment:</strong> parte do valor recebido do cliente já vai ao fisco, afetando a conciliação de clientes e de bancos.</li><li><strong>Transição até 2033:</strong> conviverão ICMS, ISS, IBS e CBS, com planos de contas e conciliações em paralelo.</li><li>Saldos credores de ICMS acumulados até 2032 poderão ser compensados ou ressarcidos conforme regras da EC 132/2023 e da LC 214/2025.</li></ul>
${dica('Crie desde já contas específicas de IBS e CBS a recuperar e a recolher, separadas por ente (IBS estadual, IBS municipal e CBS), e mapeie-as no plano referencial.')}
`},

{id:'ctr4', t:'LC 224/2025 e o Lucro Presumido', h:`
${lei('Lei Complementar 224/2025','Publicada em 26/12/2025, reduz incentivos tributários federais e trata a presunção do Lucro Presumido como benefício. Acresce 10% aos percentuais de presunção sobre a parcela da receita bruta anual que exceder R$ 5 milhões: IRPJ a partir de 1º/01/2026 e CSLL a partir de 1º/04/2026.')}
${ex('Serviços, receita do trimestre de R$ 2.000.000',`<p>Considerando o limite proporcional de R$ 1,25 milhão por trimestre, R$ 750.000 excedem.</p>
${tbl(['Item','>Valor'],[['Base do IRPJ: 32% × 1.250.000',R(400000)],['Base do IRPJ: 35,2% × 750.000',R(264000)],['Base total do IRPJ',R(664000)],['IRPJ 15% + adicional 10% sobre (664.000 − 60.000)','99.600 + 60.400 = '+R(160000)]])}
<p>Sem a LC 224, a base seria de R$ 640.000; o acréscimo aumenta a base em R$ 24.000.</p>`)}
${aten('Há decisões judiciais liminares suspendendo o acréscimo para algumas empresas. Verifique a situação específica e as instruções normativas (IN RFB 2.305/2025 e posteriores).')}
`},

{id:'ctr5', t:'Sustentabilidade e novas normas', h:`
${lei('Resolução CVM 193/2023','Adota no Brasil as normas IFRS S1 (requisitos gerais) e S2 (clima) do ISSB. Obrigatórias para companhias abertas a partir dos exercícios iniciados em 1º/01/2026, com asseguração por auditor independente.')}
<ul><li>O CBPS (Comitê Brasileiro de Pronunciamentos de Sustentabilidade) emite os pronunciamentos correspondentes no Brasil.</li><li>Empresas fechadas que fornecem para companhias abertas podem receber pedidos de informação sobre emissões e riscos climáticos.</li><li>A IFRS 18, que substitui a IAS 1 na apresentação das demonstrações, vale internacionalmente para exercícios a partir de 2027; acompanhe a adoção pelo CPC.</li></ul>
`},

{id:'ctr6', t:'Como se preparar', h:`
<ol>
<li><strong>Plano de contas:</strong> incluir contas de IBS, CBS e Imposto Seletivo e mapear no referencial.</li>
<li><strong>Sistemas:</strong> garantir integração das NF-e com os novos campos e da conciliação com split payment.</li>
<li><strong>Dividendos:</strong> controlar lucros de até 2025 separadamente e acompanhar retenções por sócio.</li>
<li><strong>Regime tributário:</strong> refazer a comparação entre Presumido e Real considerando a LC 224/2025.</li>
<li><strong>Estoques e precificação:</strong> simular o efeito do crédito amplo de IBS/CBS no custo.</li>
<li><strong>Fechamento:</strong> reforçar conciliações de tributos a recuperar durante a transição.</li>
<li><strong>Equipe:</strong> integrar contabilidade, fiscal e DP, porque as mudanças atravessam as três áreas.</li>
</ol>
`}
]});

function ctPlano(){
  setTab('ref'); renderSide(); setLv(1);
  const grupos=[...new Set(CT_PLANO.map(c=>c[3]))];
  main.innerHTML=`<div class="col"><header class="lhead"><div class="meta"><span class="chip">${CT_PLANO.length} contas</span></div><h1>Plano de contas</h1><p class="lead" style="margin:0">Modelo didático com a natureza de cada conta, já com contas de IBS e CBS. Adapte à realidade da empresa e vincule ao plano referencial na ECD.</p></header>
  <div class="search"><input id="pq" type="search" placeholder="Ex.: estoque, 2.1, recuperar, PECLD" aria-label="Pesquisar conta"><select id="pg" aria-label="Filtrar por grupo"><option value="">Todos os grupos</option>${grupos.map(g=>`<option>${g}</option>`).join('')}</select></div><div id="pout"></div>${foot()}</div>`;
  const nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const run=()=>{const q=nz($('#pq').value.trim()), g=$('#pg').value;
    const r=CT_PLANO.filter(c=>(!g||c[3]===g)&&(!q||c[0].startsWith(q)||nz(c[1]).includes(q)));
    $('#pout').innerHTML=r.length?`<div class="tw"><table><thead><tr><th>Código</th><th>Conta</th><th>Natureza</th><th>Grupo</th></tr></thead><tbody>${r.map(c=>`<tr><td class="code">${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td></tr>`).join('')}</tbody></table></div>`:`<div class="note aten"><div class="ni">!</div><p><b>Nenhuma conta encontrada</b>Tente outro termo ou limpe o filtro de grupo.</p></div>`;};
  ['pq','pg'].forEach(id=>$('#'+id).addEventListener('input',run)); run();
}

const _POOL={};
function getPool(cid,lv){
  const k=cid+lv; if(_POOL[k]) return _POOL[k];
  const C=COURSES[cid], out=[], seen=new Set();
  const add=(q,id,tpl)=>{const key=q.q+'|'+q.o[q.a]; if(seen.has(key)) return; seen.add(key); out.push({...q,id,tpl});};
  (C.quiz[lv]||[]).forEach((q,i)=>add(q,`h:${cid}:${lv}:q${i}`,null));
  (C.extra[lv]||[]).forEach((q,i)=>add(q,`h:${cid}:${lv}:e${i}`,null));
  ((GEN[cid]||{})[lv]||[]).forEach(t=>{for(let s=0;s<t.n;s++){try{const r=mulberry(hstr(cid+lv+t.id+':'+s)); const q=t.f(r,s); if(q&&q.o.length===4&&new Set(q.o).size===4) add(q,`g:${cid}:${lv}:${t.id}:${s}`,t.id);}catch(e){}}});
  return _POOL[k]=out;
}
function qHist(lv,kind){const h=D().qhist=D().qhist||{}; return h[kind+lv]||[];}
function selectQs(lv,kind,count){
  const pool=getPool(CUR,lv), H=qHist(lv,kind), recent=new Set(H.slice(-ROTATE).flat()), last={};
  H.forEach((ids,i)=>ids.forEach(id=>last[id]=i));
  const fresh=shuffle(pool.filter(q=>!recent.has(q.id))), old=shuffle(pool.filter(q=>recent.has(q.id))).sort((a,b)=>last[a.id]-last[b.id]);
  const cap=kind==='p'?2:1, out=[], cnt={};
  const take=(list,capped)=>{for(const q of list){ if(out.length>=count) return; if(out.includes(q)) continue; const t=q.tpl||q.id; if(capped&&(cnt[t]||0)>=cap) continue; cnt[t]=(cnt[t]||0)+1; out.push(q);}};
  take(fresh,true); take(fresh,false); take(old,true); take(old,false);
  return shuffle(out);
}
function recordQs(lv,kind,qs){const h=D().qhist=D().qhist||{}, k=kind+lv; (h[k]=h[k]||[]).push(qs.map(q=>q.id)); h[k]=h[k].slice(-ROTATE);}
function freshCount(lv,kind){const H=qHist(lv,kind), rec=new Set(H.slice(-ROTATE).flat()); return getPool(CUR,lv).filter(q=>!rec.has(q.id)).length;}

function linkNorms(root){
  if(!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    if(n.parentElement.closest('a,button,input,select,textarea,label,.norm,.danfe .hd,.lib,.dbody')) return NodeFilter.FILTER_REJECT;
    NORM_RX.lastIndex=0; return NORM_RX.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(node=>{
    const t=node.nodeValue, frag=document.createDocumentFragment(); let last=0, m; NORM_RX.lastIndex=0;
    while((m=NORM_RX.exec(t))){
      const n=NORMS[m.slice(1).findIndex(x=>x!==undefined)];
      if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
      const b=document.createElement('button'); b.type='button'; b.className='norm'; b.dataset.k=n.k; b.textContent=m[0]; b.title='Abrir: '+n.nome;
      frag.appendChild(b); last=m.index+m[0].length;
    }
    if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
}

  main.innerHTML=`<div class="auth"><section class="hero"><div><h1>Treinamentos práticos para a sua equipe</h1><p class="lead">${Object.values(COURSES).map(c=>c.icon+' '+c.nome).join(' · ')}. Quatro níveis em cada treinamento, com legislação clicável, provas e certificados. Seu progresso fica salvo no banco de dados e acompanha você em qualquer dispositivo.</p><div class="cta"><a class="btn glass" href="#validar">Validar um certificado</a></div></div></section>
  <div class="authcard">${card}</div></div>`;
}
function setupView(){
  authShell(`<h2>Configuração pendente</h2><p class="muted">O aplicativo ainda não está ligado ao banco de dados.</p>
  <ol style="font-size:15px"><li>Crie um projeto gratuito em supabase.com.</li><li>No SQL Editor, execute o arquivo <code>supabase.sql</code>.</li><li>No painel do projeto, clique em <b>Connect</b> (topo da tela) e copie a <b>Project URL</b> e a <b>Publishable key</b> (começa com <code>sb_publishable_</code>).</li><li>Cole os dois valores no arquivo <code>config.js</code> e publique novamente.</li></ol>

function authView(mode){
  if(!SB) return setupView();
  mode=mode||'login';
  const titles={login:'Entrar',signup:'Criar conta',forgot:'Recuperar senha',reset:'Definir nova senha'};
  authShell(`<h2>${titles[mode]}</h2><p class="muted">${mode==='login'?'Use o e-mail e a senha cadastrados.':mode==='signup'?'O primeiro cadastro do sistema se torna administrador do treinamento.':mode==='forgot'?'Enviaremos um link para você criar uma nova senha.':'Escolha a nova senha de acesso.'}</p>
  ${mode==='login'||mode==='signup'?`<div class="seg" role="group"><button type="button" data-m="login" aria-pressed="${mode==='login'}">Entrar</button><button type="button" data-m="signup" aria-pressed="${mode==='signup'}">Criar conta</button></div>`:''}
  <div class="stackf" id="af">
  ${mode==='signup'?`<label>Nome completo<input id="fNome" autocomplete="name"></label><label>Cargo ou área<select id="fCargo"><option>Assistente fiscal</option><option>Analista fiscal</option><option>Analista de DP</option><option>Assistente contábil</option><option>Contador</option><option>Estagiário</option><option>Gestor</option><option>Outro</option></select></label>`:''}
  ${mode!=='reset'?`<label>E-mail<input id="fEmail" type="email" autocomplete="email"></label>`:''}
  ${mode!=='forgot'?`<label>${mode==='reset'?'Nova senha':'Senha'}<input id="fPw" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}"></label>`:''}
  ${mode==='signup'||mode==='reset'?'<label>Confirmar senha<input id="fPw2" type="password" autocomplete="new-password"></label><span class="muted">Mínimo de 6 caracteres.</span>':''}
  <div class="msg" id="aMsg"></div>
  <button class="btn" id="aGo" type="button" style="justify-content:center">${{login:'Entrar',signup:'Criar conta e começar',forgot:'Enviar link de recuperação',reset:'Salvar nova senha'}[mode]}</button>
  ${mode==='login'?'<button class="linkbtn" type="button" data-m="forgot">Esqueci minha senha</button>':''}
  ${mode==='forgot'?'<button class="linkbtn" type="button" data-m="login">Voltar para entrar</button>':''}
  </div>`);
  main.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>authView(b.dataset.m));
  const msg=(t,ok)=>{const m=$('#aMsg'); m.className='msg '+(ok?'ok':'err'); m.textContent=t;};
  const busy=on=>{const b=$('#aGo'); b.disabled=on; b.style.opacity=on?.6:1;};
  const go=async()=>{
    const email=$('#fEmail')?$('#fEmail').value.trim().toLowerCase():'', pw=$('#fPw')?$('#fPw').value:'';
    if(mode!=='reset'&&!/^\S+@\S+\.\S+$/.test(email)) return msg('Informe um e-mail válido.');
    busy(true);
    try{
      if(mode==='login'){
        const {data,error}=await SB.auth.signInWithPassword({email,password:pw}); if(error) throw error;
        await loadMe(data.user); toast('Bem-vindo, '+U().nome.split(' ')[0]); location.hash='#home'; route();
      } else if(mode==='signup'){
        const nome=$('#fNome').value.trim(); if(nome.length<3){busy(false); return msg('Informe o nome completo.');}
        if(pw.length<6){busy(false); return msg('A senha precisa ter pelo menos 6 caracteres.');}
        if(pw!==$('#fPw2').value){busy(false); return msg('As senhas não conferem.');}
        const {data,error}=await SB.auth.signUp({email,password:pw,options:{data:{nome,cargo:$('#fCargo').value},emailRedirectTo:BASE_URL}}); if(error) throw error;
        if(!data.session){ busy(false); return msg('Cadastro recebido! Enviamos um e-mail de confirmação para '+email+'. Clique no link e depois entre com sua senha.',true); }
        await loadMe(data.user); toast('Conta criada. Bons estudos!'); location.hash='#home'; route();
      } else if(mode==='forgot'){
        const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:BASE_URL}); if(error) throw error;
        busy(false); return msg('Se o e-mail estiver cadastrado, você receberá um link para criar a nova senha.',true);
      } else if(mode==='reset'){
        if(pw.length<6){busy(false); return msg('A senha precisa ter pelo menos 6 caracteres.');}
        if(pw!==$('#fPw2').value){busy(false); return msg('As senhas não conferem.');}
        const {data,error}=await SB.auth.updateUser({password:pw}); if(error) throw error;
        RECOVERY=false; await loadMe(data.user); toast('Senha alterada com sucesso'); history.replaceState(null,'',BASE_URL+'#home'); route();
      }
    }catch(e){ busy(false); msg(ptErr(e)); }
  };
  $('#aGo').onclick=go; $('#af').addEventListener('keydown',e=>{if(e.key==='Enter') go();});
}
async function logout(){
  try{ if(beforeSave) beforeSave(); }catch(e){}
  if(dirty) await saveNow(true);
  try{ await SB.auth.signOut(); }catch(e){}
  STORE={session:null,users:{},org:{}}; dirty=false; ADMIN_LOADED=false; updSave();
  location.hash='#login'; route();
}
function validarView(){
  const logged=!!U();
  if(!logged) document.body.classList.add('noauth'); else { setTab(''); renderSide(); }
  setLv(2);
  main.innerHTML=`<div class="col" style="max-width:720px;margin:0 auto"><header class="lhead"><div class="meta"><span class="chip">Consulta pública</span></div><h1>Validar certificado</h1><p class="lead" style="margin:0">Digite o código de verificação impresso no certificado (ex.: MT-F1-0A1B2C3).</p></header>
  <div class="search"><input id="vq" placeholder="Código do certificado" aria-label="Código do certificado" autocomplete="off"><button class="btn" id="vGo" type="button">Validar</button></div><div id="vout"></div>
  <p style="margin-top:20px"><a href="${logged?'#home':'#login'}">${logged?'Voltar ao treinamento':'Entrar no treinamento'}</a></p></div>`;
  const run=async()=>{ const c=$('#vq').value.trim(); if(!c) return; const out=$('#vout'); out.innerHTML='<p class="muted">Consultando…</p>';
    if(!SB){ out.innerHTML='<div class="note erro"><div class="ni">✕</div><p><b>Indisponível</b>O aplicativo ainda não está ligado ao banco de dados.</p></div>'; return; }
    const {data,error}=await SB.rpc('verificar_certificado',{p_codigo:c});
    if(error){ out.innerHTML=`<div class="note erro"><div class="ni">✕</div><p><b>Erro na consulta</b>${esc(ptErr(error))}</p></div>`; return; }
    const r=(data||[])[0];
    out.innerHTML=r?`<div class="note dica"><div class="ni">✓</div><p><b>Certificado válido</b>Emitido para <strong>${esc(r.nome)}</strong> no treinamento <strong>${esc((COURSES[r.curso]||{}).nome||r.curso)}</strong>, ${r.nivel==='0'?'trilha completa':'nível '+esc(r.nivel)}, com nota ${esc(r.nota)}%, em ${new Date(r.emitido_em).toLocaleDateString('pt-BR')}.</p></div>`
      :`<div class="note erro"><div class="ni">✕</div><p><b>Código não encontrado</b>Confira se o código foi digitado corretamente, incluindo os hífens.</p></div>`; };
  $('#vGo').onclick=run; $('#vq').addEventListener('keydown',e=>{if(e.key==='Enter') run();});
  const pre=(location.hash.split('/')[1]||''); if(pre){ $('#vq').value=decodeURIComponent(pre); run(); }
}

function lesson(id){
  const i=ALL.findIndex(l=>l.id===id); if(i<0) return home();
  const l=ALL[i], L=LEVELS[l.lv-1], prev=ALL[i-1], next=ALL[i+1];
  setTab('home'); renderSide(id); setLv(l.lv); if(!canLv(l.lv)) return locked(l.lv);
  const nextLink = next && next.lv===l.lv ? `#l/${next.id}` : `#q/${l.lv}`;
  const nextLabel = next && next.lv===l.lv ? next.t : `Exercícios do nível ${l.lv}`;
  const note=D().notes[id];
  main.innerHTML=`<article class="col"><header class="lhead"><div class="meta"><span class="chip">Nível ${L.n} · ${L.title}</span><span>Aula ${l.ix+1} de ${L.lessons.length}</span></div><h1>${l.t}</h1>
  <div class="prog"><div class="bar"><i style="width:${Math.round(lvProg(L.n)*100)}%"></i></div><span>${Math.round(lvProg(L.n)*100)}% do nível concluído</span></div></header>
  <div id="lbody">${l.h}</div>
  <section class="notes"><h3>Minhas anotações</h3><p class="muted" style="margin:0 0 8px">Visíveis apenas para você.</p><textarea id="nTxt" placeholder="Escreva dúvidas, resumos ou exemplos da sua empresa…">${esc(note?note.t:'')}</textarea>
  <div class="bar2"><span class="muted" id="nInfo">${note?'Salva em '+fmtDate(note.u):'Nenhuma anotação salva'}</span><button class="btn" id="nSave" type="button">Salvar anotação</button></div></section>
  <div class="markrow">${D().done[id]
    ?`<span class="donebadge" id="doneBadge">✓ Aula concluída</span><a class="btn" href="${nextLink}" id="markBtn">Próxima: ${nextLabel} →</a><button class="linkbtn" id="unmarkBtn" type="button">Desmarcar conclusão</button>`
    :`<button class="btn" id="markBtn" type="button">Concluir aula e seguir</button>`}</div>
  <nav class="pager">${prev?`<a href="#l/${prev.id}"><small>← Anterior</small><b>${prev.t}</b></a>`:''}<a class="nx" href="${nextLink}"><small>Próxima →</small><b>${nextLabel}</b></a></nav>${foot()}</article>`;
  linkNorms($('#lbody'));
  $('#nTxt').oninput=()=>{dirty=true; updSave();};
  $('#nSave').onclick=async()=>{const t=$('#nTxt').value; if(t.trim()) D().notes[id]={t,u:Date.now()}; else delete D().notes[id]; await saveNow(true); $('#nInfo').textContent=t.trim()?'Salva em '+fmtDate(Date.now()):'Anotação removida'; toast('Anotação salva');};
  const keepNote=()=>{const t=$('#nTxt').value; if(t.trim()&&(!note||note.t!==t)){ D().notes[id]={t,u:Date.now()}; const ni=$('#nInfo'); if(ni) ni.textContent='Salva em '+fmtDate(Date.now()); }};
  beforeSave=keepNote;
  if(!D().done[id]) $('#markBtn').onclick=()=>{ keepNote(); D().done[id]=true; mark(); saveNow(true); toast('Aula concluída e salva'); location.hash=nextLink; };
  else { $('#markBtn').addEventListener('click',()=>{ keepNote(); if(dirty) saveNow(true); });
    let conf=false; $('#unmarkBtn').onclick=()=>{ if(!conf){conf=true; $('#unmarkBtn').textContent='Confirmar: desmarcar esta aula'; return;} keepNote(); delete D().done[id]; mark(); saveNow(true); toast('Conclusão removida'); lesson(id); }; }
}

function quiz(n){
  const L=LEVELS[n-1]; if(!L) return home();
  setTab('home'); renderSide('q'+n); setLv(n); if(!canLv(n)) return locked(n);
  const sh=D().settings.shuffle, qs=selectQs(n,'q',QUIZ_N).map(q=>({...q,ord:sh?shuffle(q.o.map((_,i)=>i)):q.o.map((_,i)=>i)})), att=qHist(n,'q').length+1; let answered=0, right=0;
  main.innerHTML=`<div class="col"><header class="lhead"><div class="meta"><span class="chip">Nível ${n} · ${L.title}</span><span>Exercícios de fixação · rodada ${att}</span></div><h1>Exercícios do nível ${n}</h1><p class="lead" style="margin:0">${QUIZ_N} questões com correção imediata, sorteadas de um banco de ${getPool(CUR,n).length}. Questões já vistas só voltam depois de ${ROTATE} rodadas. Para a avaliação formal, faça a <a href="#p/${n}">prova do nível</a>.</p></header>
  ${qs.map((q,qi)=>`<fieldset class="q" id="q${qi}"><legend><h3><span>${qi+1}.</span>${q.q}</h3></legend>${q.ord.map(oi=>`<label><input type="radio" name="r${qi}" value="${oi}"> <span>${q.o[oi]}</span></label>`).join('')}<div class="why">${q.w}</div></fieldset>`).join('')}
  <div id="scoreBox"></div>${foot()}</div>`;
  qs.forEach((q,qi)=>{
    const fs=$('#q'+qi);
    fs.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{
      if(fs.classList.contains('answered')) return;
      fs.classList.add('answered'); answered++; const v=+inp.value; if(v===q.a) right++;
      fs.querySelectorAll('label').forEach(lb=>{ const oi=+lb.querySelector('input').value; if(oi===q.a) lb.classList.add('ok'); else if(oi===v) lb.classList.add('no'); lb.querySelector('input').disabled=true; });
      linkNorms(fs.querySelector('.why'));
      if(answered===qs.length){
        D().quiz[n]=right; recordQs(n,'q',qs); mark(); renderSide('q'+n);
        $('#scoreBox').innerHTML=`<div class="score"><div class="big">${right}/${qs.length}</div><div style="flex:1;min-width:200px"><p style="margin:0">${right>=5?'Ótimo domínio do conteúdo. Que tal a prova do nível?':right>=4?'Bom resultado. Revise as questões marcadas em vermelho.':'Vale revisar as aulas antes da prova.'}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="redo">Nova rodada</button><a class="btn" href="#p/${n}">Ir para a prova</a></div></div>`;
        $('#redo').onclick=()=>quiz(n); $('#scoreBox').scrollIntoView({behavior:'smooth',block:'center'});
      }
    });
  });
}

/* =================== prova =================== */
let EXAM=null;
const shuffle=a=>{a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]];} return a;};
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function examIntro(n){
  const L=LEVELS[n-1]; if(!L) return home();
  setTab('home'); renderSide('p'+n); setLv(n); if(!canLv(n)) return locked(n);
  const s=D().settings, pool=getPool(CUR,n), hist=(D().exams[n]||[]).slice().reverse(), fr=freshCount(n,'p');
  main.innerHTML=`<div class="col"><header class="lhead"><div class="meta"><span class="chip">Nível ${n} · ${L.title}</span><span>Prova teste</span></div><h1>Prova do nível ${n}</h1><p class="lead" style="margin:0">Avaliação formal do conteúdo do nível. As respostas só são corrigidas ao entregar a prova.</p></header>
  <div class="rules"><div><b>${EXAM_N}</b><small>questões sorteadas de um banco de ${pool.length}</small></div><div><b>${Math.min(fr,pool.length)}</b><small>questões inéditas disponíveis para você</small></div><div><b>${s.examMin} min</b><small>tempo máximo</small></div><div><b>${s.passPct}%</b><small>nota mínima para aprovação</small></div><div><b>${hist.length}</b><small>tentativa(s) realizadas</small></div></div>
  <div class="note dica"><div class="ni">✓</div><p><b>Como funciona</b>Cada tentativa traz questões diferentes: as que você já respondeu só voltam depois de ${ROTATE} tentativas, embaralhadas e, nos cálculos, com novos valores. ${s.shuffle?'A ordem das alternativas também muda. ':''}Ao terminar o tempo, a prova é entregue automaticamente. O resultado fica salvo no seu histórico. Tempo, nota mínima e embaralhamento podem ser ajustados em Configurações.</p></div>
  <div class="markrow" style="margin-top:10px"><button class="btn" id="startEx">Iniciar prova</button><a class="btn ghost" href="#q/${n}">Treinar com exercícios</a></div>
  ${hist.length?`<h2>Histórico de tentativas</h2>${tbl(['Data','>Acertos','>Nota','>Tempo','Resultado'],hist.map(h=>[fmtDate(h.date),h.score+'/'+h.total,h.pct+'%',mmss(h.secs),h.pct>=h.pass?'<span class="stamp2 ok">Aprovado</span>':'<span class="stamp2 no">Reprovado</span>']))}`:''}
  ${foot()}</div>`;
  $('#startEx').onclick=()=>startExam(n);
}
function startExam(n){
  const s=D().settings; let qs=selectQs(n,'p',EXAM_N).map(q=>({...q,ord:s.shuffle?shuffle(q.o.map((_,i)=>i)):q.o.map((_,i)=>i)}));
  EXAM={n,qs,ans:{},start:Date.now(),limit:s.examMin*60,pass:s.passPct,timer:null};
  const L=LEVELS[n-1];
  main.innerHTML=`<div class="col"><div class="exhead"><div><b style="font-family:var(--fd)">Prova do nível ${n}</b><div style="font-size:13px;opacity:.8">${L.title}</div></div><div style="display:flex;align-items:center;gap:12px"><div class="bar"><i id="exBar" style="width:0%"></i></div><span id="exCount" style="font-size:13px">0/${qs.length}</span></div><div class="tm" id="exTm">${mmss(EXAM.limit)}</div></div>
  ${qs.map((q,qi)=>`<fieldset class="q" id="eq${qi}"><legend><h3><span>${qi+1}.</span>${q.q}</h3></legend>${q.ord.map(oi=>`<label><input type="radio" name="e${qi}" value="${oi}"> <span>${q.o[oi]}</span></label>`).join('')}</fieldset>`).join('')}
  <div class="msg" id="exMsg"></div><div class="markrow"><button class="btn" id="exSend">Entregar prova</button><button class="btn ghost" id="exQuit">Cancelar prova</button></div></div>`;
  qs.forEach((q,qi)=>$('#eq'+qi).querySelectorAll('input').forEach(inp=>inp.onchange=()=>{EXAM.ans[qi]=+inp.value; const c=Object.keys(EXAM.ans).length; $('#exCount').textContent=c+'/'+qs.length; $('#exBar').style.width=(c/qs.length*100)+'%';}));
  let warned=false;
  $('#exSend').onclick=()=>{const miss=qs.length-Object.keys(EXAM.ans).length; if(miss&&!warned){warned=true; const m=$('#exMsg'); m.className='msg err'; m.textContent=`Há ${miss} questão(ões) sem resposta. Clique em "Entregar prova" novamente para confirmar.`; return;} finishExam();};
  let quitW=false; $('#exQuit').onclick=()=>{ if(!quitW){quitW=true; $('#exQuit').textContent='Confirmar cancelamento'; return;} clearInterval(EXAM.timer); EXAM=null; examIntro(n); };
  EXAM.timer=setInterval(()=>{ if(!EXAM) return; const left=EXAM.limit-Math.floor((Date.now()-EXAM.start)/1000); const el=$('#exTm'); if(!el){clearInterval(EXAM.timer);return;} el.textContent=mmss(Math.max(0,left)); el.classList.toggle('low',left<=60); if(left<=0){toast('Tempo esgotado: prova entregue automaticamente'); finishExam();} },1000);
  window.scrollTo(0,0);
}
function finishExam(){
  const E=EXAM; if(!E) return; clearInterval(E.timer); EXAM=null;
  const secs=Math.min(E.limit,Math.round((Date.now()-E.start)/1000));
  const score=E.qs.filter((q,i)=>E.ans[i]===q.a).length, total=E.qs.length, pct=Math.round(score/total*100), ok=pct>=E.pass;
  (D().exams[E.n]=D().exams[E.n]||[]).push({date:Date.now(),score,total,pct,secs,pass:E.pass});
  recordQs(E.n,'p',E.qs); saveNow(true); const novos=checkCerts()||[]; renderSide('p'+E.n);
  const L=LEVELS[E.n-1], nx=LEVELS[E.n], hasCert=!!D().certs[E.n];
  main.innerHTML=`<div class="col"><div class="cert"><div class="big">${pct}%</div><div style="flex:1;min-width:220px"><span class="stamp2 ${ok?'ok':'no'}">${ok?'Aprovado':'Não aprovado'}</span><h2 style="color:#fff;margin:10px 0 0">Prova do nível ${E.n} · ${L.title}</h2><p>${esc(U().nome)} · ${score} de ${total} acertos · ${mmss(secs)} · ${fmtDate(Date.now())} · nota mínima ${E.pass}%</p></div></div>
  ${ok&&!hasCert?`<div class="note aten"><div class="ni">!</div><p><b>Quase lá</b>Para emitir o certificado do nível, conclua também todas as aulas (${L.lessons.filter(l=>D().done[l.id]).length} de ${L.lessons.length}).</p></div>`:''}
  <div class="markrow">${hasCert?`<a class="btn" href="#cert/${E.n}">🎓 ${novos.includes(E.n)?'Ver meu novo certificado':'Ver certificado'}</a>`:''}<button class="btn ${hasCert?'ghost':''}" id="exAgain">Refazer prova</button>${ok&&nx?`<a class="btn ghost" href="#l/${nx.lessons[0].id}">Seguir para o nível ${nx.n}</a>`:`<a class="btn ghost" href="#l/${L.lessons[0].id}">Revisar as aulas</a>`}</div>
  <h2>Gabarito comentado</h2>
  ${E.qs.map((q,qi)=>{const a=E.ans[qi], st=a==null?'na':a===q.a?'ok':'no'; return `<fieldset class="q answered rev"><legend><h3><span class="qtag ${st}">${st==='ok'?'Correta':st==='no'?'Incorreta':'Sem resposta'}</span><span>${qi+1}.</span>${q.q}</h3></legend>${q.ord.map(oi=>`<label class="${oi===q.a?'ok':''} ${oi===a?'pick':''}"><input type="radio" disabled ${oi===a?'checked':''}> <span>${q.o[oi]}</span></label>`).join('')}<div class="why">${q.w}</div></fieldset>`;}).join('')}
  ${foot()}</div>`;
  main.querySelectorAll('.why').forEach(linkNorms);
  $('#exAgain').onclick=()=>startExam(E.n); window.scrollTo(0,0);
  toast(ok?'Parabéns, prova aprovada!':'Resultado salvo no histórico');
}

function cfopView(){
  setTab('ref'); renderSide(); setLv(1);

  main.innerHTML=`<div class="col"><header class="lhead"><div class="meta"><span class="chip">${CFOPS.length} códigos</span></div><h1>Consulta CFOP</h1><p class="lead" style="margin:0">Pesquise os códigos mais usados por número ou palavra. A tabela completa está no Convênio s/nº de 1970 e suas atualizações.</p></header>
  <div class="search"><input id="cq" type="search" placeholder="Ex.: 5102, devolução, conserto, ativo" aria-label="Pesquisar CFOP"><select id="cg" aria-label="Filtrar por grupo"><option value="">Todos os grupos</option>${groups.map(g=>`<option>${g}</option>`).join('')}</select>
  <select id="cd" aria-label="Filtrar por direção"><option value="">Entradas e saídas</option><option value="e">Só entradas (1, 2, 3)</option><option value="s">Só saídas (5, 6, 7)</option></select></div>
  <div id="cout"></div>${foot()}</div>`;
  linkNorms(main.querySelector('.lhead'));
  const run=()=>{const q=$('#cq').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); const qd=q.replace(/\D/g,''); const g=$('#cg').value, d=$('#cd').value;
    const r=CFOPS.filter(c=>{const desc=c[1].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); const code=c[0].replace('.','');
      if(g&&c[2]!==g) return false; if(d==='e'&&+code[0]>3) return false; if(d==='s'&&+code[0]<5) return false;

  ['cq','cg','cd'].forEach(id=>$('#'+id).addEventListener('input',run)); run();
}

    $('#uSave').onclick=async()=>{
      for(const row of main.querySelectorAll('.urow')){const x=STORE.users[row.dataset.u]; if(!x) continue;
        const ch=[...row.querySelectorAll('[data-lv]')]; if(ch.length){ x.access={}; Object.keys(COURSES).forEach(cid=>x.access[cid]=ch.filter(c=>c.checked&&c.dataset.lv.startsWith(cid+':')).map(c=>+c.dataset.lv.split(':')[1])); x.courses=[...row.querySelectorAll('[data-crs]')].filter(c=>c.checked).map(c=>c.dataset.crs); if(x.cur&&!x.courses.includes(x.cur)) x.cur=null; }
        const rl=row.querySelector('[data-role]'); if(rl) x.role=rl.value;
        const at=row.querySelector('[data-ativo]'); if(at) x.ativo=at.checked;
        if(x.id!==U().id){ try{ await saveProfileAdmin(x); }catch(e){ msg('uMsg','Erro ao salvar '+x.nome+': '+ptErr(e)); return; } } }
      STORE.org.defCourses=[...main.querySelectorAll('[data-defc]')].filter(c=>c.checked).map(c=>c.dataset.defc);
      try{ await saveOrg(); }catch(e){ msg('uMsg',ptErr(e)); return; }
      config('usuarios'); toast('Usuários salvos no banco de dados');
    };
  }
  if(sec==='certificado') $('#oSave').onclick=async()=>{const o=ORG(); o.empresa=$('#oEmp').value.trim()||ORG_DEF.empresa; o.resp=$('#oResp').value.trim()||ORG_DEF.resp; o.cargo=$('#oCargo').value.trim(); main.querySelectorAll('[data-h]').forEach(i=>{const [c,n]=i.dataset.h.split(':'); o.horas[c][n]=Math.max(1,+i.value||ORG_DEF.horas[c][n]);}); try{ await saveOrg(); toast('Configurações do certificado salvas'); }catch(e){ toast(ptErr(e)); } };
  if(sec==='sair'){ $('#oOut').onclick=logout; }
}

/* =================== escolha de treinamento =================== */
function useCourse(id){ const u=U(); if(!u||!canCourse(id)) return; u.cur=id; setCourse(id); mark(); }
function coursesView(){
  setTab(''); setLv(1); const u=U(); migrateUser(u);
  const cards=Object.values(COURSES).map(c=>{const ok=canCourse(c.id), d=u.cd[c.id]||newCD(), tot=c.levels.reduce((a,L)=>a+L.lessons.length,0), done=Object.keys(d.done||{}).length, pct=Math.round(done/tot*100), certs=Object.keys(d.certs||{}).length;
    return `<div class="lvl crsbox ${c.id===CUR?'cur':''} ${ok?'':'off'}"><div class="top2"><span class="num" style="background:var(--hero);font-size:22px">${c.icon}</span><span class="chip">${!ok?'Não liberado':c.id===CUR?'Em andamento':done?'Iniciado':'Novo'}</span></div><h3>${c.nome}</h3><p>${c.sub}</p>
    <div class="bar"><i style="width:${pct}%"></i></div><div class="ft"><span>${done} de ${tot} aulas · ${pct}%</span><span>${certs} certificado(s)</span></div>
    ${ok?`<button class="btn" data-go="${c.id}" type="button" style="justify-content:center;margin-top:8px">${c.id===CUR?'Continuar':'Abrir treinamento'}</button>`:'<p class="muted" style="margin-top:8px">Peça ao administrador para liberar este treinamento.</p>'}</div>`;}).join('');
  side.innerHTML=''; 
  main.innerHTML=`<div class="col" style="max-width:1040px"><header class="lhead"><div class="meta"><span class="chip">${Object.keys(COURSES).length} treinamentos</span></div><h1>Escolha o treinamento</h1><p class="lead" style="margin:0">Cada treinamento tem seus próprios níveis, provas e certificados. Você pode alternar quando quiser; o progresso de cada um fica salvo separadamente.</p></header>
  <div class="lvls">${cards}</div>${foot()}</div>`;
  main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{useCourse(b.dataset.go); toast('Treinamento: '+COURSES[b.dataset.go].nome); if(location.hash==='#home') route(); else location.hash='#home';});
}

/* =================== roteamento =================== */
function route(){
  side.classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false');
  if(drawer.classList.contains('open')) closeNorm();
  if(EXAM){clearInterval(EXAM.timer); EXAM=null;}
  beforeSave=null;
  applySettings(); updSave();
  const hh=(location.hash||'').slice(1);
  if(hh.startsWith('validar')) return validarView();
  if(RECOVERY) return authView('reset');
  if(!U()){ return authView(hh==='signup'?'signup':'login'); }
  document.body.classList.remove('noauth');
  const u=U(); migrateUser(u);
  const h=location.hash.slice(1)||'home'; const [a,b]=h.split('/');
  if(a==='l'){ const own=Object.values(COURSES).find(c=>c.levels.some(L=>L.lessons.some(l=>l.id===b))); if(own&&own.id!==u.cur&&canCourse(own.id)){ u.cur=own.id; dirty=true; setTimeout(()=>saveNow(true),0);} }
  if(!u.cur||!canCourse(u.cur)){ const av=Object.keys(COURSES).filter(canCourse); u.cur=av.length===1?av[0]:null; }
  if(u.cur) setCourse(u.cur);
  applySettings();
  if(!u.cur){ return coursesView(); }
  if(a==='l') lesson(b); else if(a==='q') quiz(+b); else if(a==='p') examIntro(+b); else if(a==='calc') calcView(b); else if(a==='cfop'||a==='ref') COURSES[CUR].ref.fn(); else if(a==='cursos') coursesView(); else if(a==='leis') library(); else if(a==='config') config(b); else if(a==='cert') (b==null||b===''?certList():certView(+b)); else home();
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener('hashchange',route);
$('#menuBtn').onclick=()=>{const o=side.classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded',o);};
setInterval(()=>{ if(dirty&&U()&&D().settings.autosave) saveNow(true); },30000);
let RECOVERY=false;
async function boot(){
  if(!SB){ route(); return; }
  main.innerHTML='<div class="col"><p class="muted" style="padding:40px 0">Conectando ao banco de dados…</p></div>'; document.body.classList.add('noauth');
  SB.auth.onAuthStateChange((ev,session)=>{ if(ev==='PASSWORD_RECOVERY'){ RECOVERY=true; route(); } if(ev==='USER_UPDATED'&&RECOVERY){ RECOVERY=false; } });
  try{ const {data}=await SB.auth.getSession(); if(data&&data.session&&!/type=recovery/.test(location.hash)){ await loadMe(data.session.user); } }catch(e){ setTimeout(()=>toast(ptErr(e)),300); }
  if(/type=recovery/.test(location.hash)) RECOVERY=true;
  if(/access_token|type=/.test(location.hash)&&!RECOVERY) history.replaceState(null,'',BASE_URL+'#home');
  route();
}
boot();
</script>

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
