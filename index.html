<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mestre - Treinamento · Treinamento da área fiscal</title>
<meta name="theme-color" content="#1A2142">
<meta name="description" content="Mestre - Treinamento: treinamentos de Área Fiscal, Departamento Pessoal e Contabilidade.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Archivo:wdth,wght@75..110,400..750&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --sunk:#EDEFF5; --ink:#151B2E; --ink2:#5B6479; --ink3:#8A92A5; --line:#E2E5EE; --line2:#EEF0F5;
  --hero:#1A2142; --hero2:#262F5C; --onhero:#EEF0FA;
  --l1:#0E8A7D; --l2:#2E5BD8; --l3:#7B4FD1; --l4:#C2386A;
  --l1t:#E3F4F1; --l2t:#E7EDFC; --l3t:#EFE9FA; --l4t:#FBE8EF;
  --warn:#A86A00; --warnt:#FFF4DC; --bad:#C2363F; --badt:#FDE9EA; --good:#0E8A7D; --goodt:#E3F4F1;
  --lv:var(--l1); --lvt:var(--l1t);
  --r:16px; --r2:10px;
  --sh:0 1px 2px rgba(21,27,46,.05), 0 8px 24px -12px rgba(21,27,46,.12);
  --sh2:0 24px 60px -20px rgba(21,27,46,.35);
  --fd:"Bricolage Grotesque", "Archivo", system-ui, sans-serif;
  --fb:"Archivo", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#161B2C; --sunk:#1C2236; --ink:#E8EBF5; --ink2:#A5ADC2; --ink3:#7A839A; --line:#262D44; --line2:#1F2539;
  --hero:#1A2142; --hero2:#2A3366; --onhero:#EEF0FA;
  --l1:#3CC2B2; --l2:#6E93FF; --l3:#A985F5; --l4:#F06E9C;
  --l1t:#12302D; --l2t:#18244A; --l3t:#251B42; --l4t:#3A1828;
  --warn:#F0B54A; --warnt:#33280F; --bad:#F2727A; --badt:#3A1A1E; --good:#3CC2B2; --goodt:#12302D;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#161B2C; --sunk:#1C2236; --ink:#E8EBF5; --ink2:#A5ADC2; --ink3:#7A839A; --line:#262D44; --line2:#1F2539;
  --hero:#1A2142; --hero2:#2A3366; --onhero:#EEF0FA;
  --l1:#3CC2B2; --l2:#6E93FF; --l3:#A985F5; --l4:#F06E9C;
  --l1t:#12302D; --l2t:#18244A; --l3t:#251B42; --l4t:#3A1828;
  --warn:#F0B54A; --warnt:#33280F; --bad:#F2727A; --badt:#3A1A1E; --good:#3CC2B2; --goodt:#12302D;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark; }
.lv1{--lv:var(--l1);--lvt:var(--l1t)} .lv2{--lv:var(--l2);--lvt:var(--l2t)} .lv3{--lv:var(--l3);--lvt:var(--l3t)} .lv4{--lv:var(--l4);--lvt:var(--l4t)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16.5px;line-height:1.65;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--lv);text-underline-offset:3px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lv);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:14px;padding:10px 22px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.logo{width:34px;height:34px;border-radius:10px;background:var(--hero);display:grid;place-items:center;position:relative;overflow:hidden}
.logo i{position:absolute;width:6px;border-radius:3px;bottom:7px}
.logo i:nth-child(1){left:7px;height:10px;background:var(--l1)}.logo i:nth-child(2){left:14px;height:15px;background:var(--l2)}.logo i:nth-child(3){left:21px;height:20px;background:var(--l4)}
.brand b{font-family:var(--fd);font-weight:750;font-size:19px;letter-spacing:-.02em}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs a{text-decoration:none;color:var(--ink2);padding:6px 14px;border-radius:999px;font-weight:600;font-size:14.5px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.iconbtn{border:1px solid var(--line);background:var(--surface);height:36px;min-width:36px;padding:0 10px;border-radius:999px;cursor:pointer;font-size:15px;color:var(--ink)}
.menubtn{display:none}

.wrap{display:grid;grid-template-columns:300px minmax(0,1fr)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);height:calc(100vh - 57px);overflow:auto;padding:22px 14px 40px;border-right:1px solid var(--line)}
.sl{margin-bottom:14px}
.sl .h{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r2);text-decoration:none;color:var(--ink)}
.sl .h .dot{width:28px;height:28px;border-radius:9px;background:var(--lvt);color:var(--lv);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:14px;flex:none}
.sl .h b{font-family:var(--fd);font-weight:700;font-size:15px;display:block;line-height:1.2}
.sl .h small{display:block;color:var(--ink3);font-size:12.5px}
.sl .mini{height:4px;background:var(--line);border-radius:4px;margin:2px 10px 6px 48px;overflow:hidden}
.sl .mini i{display:block;height:100%;background:var(--lv);border-radius:4px}
.sl a.it{display:flex;gap:10px;align-items:flex-start;padding:6px 10px 6px 14px;margin-left:34px;border-radius:8px;text-decoration:none;color:var(--ink2);font-size:14px;line-height:1.35}
.sl a.it:hover{background:var(--sunk);color:var(--ink)}
.sl a.it.on{background:var(--lvt);color:var(--ink);font-weight:650}
.sl a.it .ck{flex:0 0 15px;height:15px;border-radius:50%;border:1.5px solid var(--ink3);margin-top:2px;display:grid;place-items:center;font-size:9px;color:#fff}
.sl a.it.done .ck{background:var(--lv);border-color:var(--lv)}
.sl a.it.done .ck::after{content:"✓"}
.sl a.it.qz .ck{border-radius:4px}

main{padding:30px clamp(18px,4vw,56px) 90px;min-width:0}
.col{max-width:860px}

h1{font-family:var(--fd);font-weight:780;font-size:clamp(30px,4.6vw,50px);line-height:1.04;letter-spacing:-.03em;margin:0 0 14px}
h2{font-family:var(--fd);font-weight:720;font-size:25px;line-height:1.15;letter-spacing:-.02em;margin:44px 0 12px}
h3{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:26px 0 6px}
p{margin:0 0 14px;max-width:72ch}
.lead{font-size:19px;color:var(--ink2);max-width:62ch;line-height:1.55}
ul,ol{padding-left:22px;max-width:72ch} li{margin:5px 0} li::marker{color:var(--lv)}
code{background:var(--sunk);padding:1px 6px;border-radius:6px;font-size:.92em}

/* norm chip */
.norm{display:inline;border:0;background:var(--lvt);color:var(--lv);font-weight:650;padding:1px 7px;border-radius:6px;cursor:pointer;font-size:.95em;line-height:1.5;box-shadow:inset 0 -1.5px 0 color-mix(in srgb,var(--lv) 45%,transparent);transition:background .15s}
.norm:hover{background:var(--lv);color:#fff}

/* lesson head */
.lhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px 22px;margin-bottom:28px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.lhead::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--lv)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--lvt);color:var(--lv);font-weight:700;font-size:13px;padding:4px 11px;border-radius:999px}
.lhead .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;color:var(--ink3);font-size:13.5px}
.lhead h1{margin-bottom:12px}
.lhead .prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink3)}
.lhead .prog .bar{flex:1;max-width:260px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lv);border-radius:6px}

/* blocks */
.lei{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:22px 0;box-shadow:var(--sh)}
.lei .ic{width:44px;height:44px;border-radius:12px;background:var(--hero);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-size:22px;font-weight:800}
.lei small{display:block;color:var(--ink3);font-size:12.5px;font-weight:600;margin-bottom:2px}
.lei b{display:block;font-family:var(--fd);font-weight:700;font-size:16.5px;margin-bottom:4px;line-height:1.4}
.lei p{margin:0;color:var(--ink2);font-size:15.5px}
.note{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 16px;border-radius:var(--r2);margin:20px 0;background:var(--c2)}
.note .ni{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.note p{margin:0;font-size:15.5px}
.note p b{display:block;color:var(--c);font-family:var(--fd);font-weight:700;margin-bottom:2px}
.aten{--c:var(--warn);--c2:var(--warnt)} .erro{--c:var(--bad);--c2:var(--badt)} .dica{--c:var(--good);--c2:var(--goodt)}

.ex{margin:26px 0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.ex>header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);font-family:var(--fd);font-weight:700;font-size:16px}
.ex>header i{font-style:normal;font-family:var(--fb);font-size:12.5px;font-weight:700;color:var(--lv);background:var(--lvt);padding:3px 10px;border-radius:999px}
.ex .in{padding:16px 18px}
.ex .in p:last-child{margin:0}
.ex .in h3:first-child{margin-top:0}

.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
th{font-weight:700;color:var(--ink2);font-size:13px;background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
tr.tot td{font-weight:750;background:var(--lvt)}

/* DANFE: o documento fiscal mantém aparência de formulário */
.danfe{border:1.5px solid var(--ink);border-radius:8px;background:var(--surface);font-size:13.5px;margin:6px 0;overflow:hidden}
.danfe .row{display:grid;border-bottom:1px solid var(--ink)}
.danfe .row:last-child{border-bottom:0}
.danfe .f{padding:4px 9px 6px;border-right:1px solid var(--ink);min-width:0}
.danfe .f:last-child{border-right:0}
.danfe .f small{display:block;font-stretch:78%;font-size:11px;color:var(--ink3);font-weight:600;line-height:1.25}
.danfe .f span{display:block;font-weight:650;overflow-wrap:anywhere}
.danfe .hd{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--hero);color:var(--onhero);font-family:var(--fd);font-weight:750}
.danfe .hd em{font-style:normal;font-family:var(--fb);font-weight:600;font-size:12px;opacity:.8}
.danfe .tw{border-radius:0;background:transparent}
.danfe table{font-size:13px}
.danfe th{background:transparent;font-stretch:80%;font-size:11.5px;color:var(--ink3);border-bottom:1px solid var(--ink)}
.danfe .hl{background:var(--warnt)}

/* sequences */
.flow{display:flex;gap:0;margin:22px 0;overflow-x:auto;padding:2px 2px 8px;counter-reset:f}
.flow div{flex:1 0 140px;position:relative;padding:14px 16px 14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);margin-right:14px;box-shadow:var(--sh)}
.flow div:not(:last-child)::after{content:"";position:absolute;right:-13px;top:50%;width:12px;height:2px;background:var(--lv)}
.flow div b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--lv);color:#fff;font-size:13px;margin-bottom:8px}
.flow div span{display:block;font-family:var(--fd);font-weight:700;font-size:15px;line-height:1.25}
.flow div small{display:block;color:var(--ink2);font-size:13px;line-height:1.4;margin-top:3px}

.tl{margin:24px 0;position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl .y{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 16px;margin-bottom:10px;display:grid;grid-template-columns:72px 1fr;gap:12px;box-shadow:var(--sh)}
.tl .y::before{content:"";position:absolute;left:-24px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--lv)}
.tl .y.now{border-color:var(--lv);background:var(--lvt)}
.tl .y.now::before{background:var(--lv)}
.tl .y b{font-family:var(--fd);font-weight:800;font-size:22px;color:var(--lv)}
.tl .y p{margin:0;font-size:15px}

.cfopdigits{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.cfopdigits div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.cfopdigits b{font-family:var(--fd);font-size:30px;color:var(--lv);line-height:1;display:block}
.cfopdigits small{color:var(--ink2);font-size:13.5px}

/* home */
.hero{background:radial-gradient(120% 140% at 100% 0%,var(--hero2) 0%,var(--hero) 55%);color:var(--onhero);border-radius:24px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:30px;align-items:center;box-shadow:var(--sh2);position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:clamp(32px,5vw,56px)}
.hero .lead{color:#C4C9E2}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--l1) 0 var(--p1),var(--l2) 0 var(--p2),var(--l3) 0 var(--p3),var(--l4) 0 var(--p4),rgba(255,255,255,.12) 0 100%)}
.ring div{width:146px;height:146px;border-radius:50%;background:var(--hero);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--fd);font-size:42px;font-weight:800;line-height:1;color:#fff}
.ring small{display:block;color:#AEB4D3;font-size:12.5px;margin-top:4px}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:26px 0}
.lvl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.lvl:hover{transform:translateY(-2px);border-color:var(--lv)}
.lvl .top2{display:flex;justify-content:space-between;align-items:center}
.lvl .num{width:40px;height:40px;border-radius:12px;background:var(--lv);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:19px}
.lvl h3{margin:4px 0 0;font-size:20px}
.lvl p{font-size:14.5px;color:var(--ink2);margin:0;flex:1}
.lvl .ft{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);margin-top:6px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:18px 0}
.feat a{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--ink)}
.feat a:hover{border-color:var(--ink3)}
.feat .fi{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:18px;flex:none}
.feat b{display:block;font-family:var(--fd);font-weight:700}
.feat small{color:var(--ink2);font-size:14px;line-height:1.4;display:block}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--lv);color:#fff;padding:11px 20px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.light{background:#fff;color:var(--hero)}
.btn.glass{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:44px}
.pager a{text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.pager a:hover{border-color:var(--lv)}
.pager a small{display:block;color:var(--ink3);font-size:13px}
.pager a b{font-family:var(--fd);font-weight:700}
.pager a.nx{text-align:right;grid-column:2}
.markrow{display:flex;align-items:center;gap:12px;margin-top:34px;flex-wrap:wrap}

/* forms / calcs */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 16px;margin:14px 0 20px}
.form label{display:flex;flex-direction:column;font-size:13px;font-weight:650;color:var(--ink2);gap:6px}
.form input,.form select{border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px;font-weight:500;color:var(--ink);border-radius:var(--r2);width:100%}
.form input:focus,.form select:focus{border-color:var(--lv);outline:none;box-shadow:0 0 0 3px var(--lvt)}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin:20px 0;box-shadow:var(--sh)}
.calc h2{margin-top:0;font-size:23px}
.res{background:var(--lvt);border-radius:var(--r2);padding:16px 18px}
.res .big{font-family:var(--fd);font-weight:800;font-size:34px;color:var(--lv);line-height:1.1}
.steps{font-size:14.5px;color:var(--ink2);margin-top:12px}
.steps div{padding:6px 0;border-top:1px dashed color-mix(in srgb,var(--lv) 30%,transparent)}
.steps div b{color:var(--ink)}
.calcnav{display:flex;gap:4px;flex-wrap:wrap;background:var(--sunk);padding:4px;border-radius:999px;width:max-content;max-width:100%;margin:16px 0}
.calcnav button{border:0;background:transparent;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:650;font-size:14.5px;color:var(--ink2)}
.calcnav button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.res .tw{background:var(--surface)}
.stack{display:flex;height:36px;border-radius:10px;overflow:hidden;margin:14px 0 8px;background:var(--surface)}
.stack div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
input[type=range]{accent-color:var(--lv)}

/* quiz */
.q{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px 20px;margin:16px 0;box-shadow:var(--sh)}
.q legend{display:contents}
.q h3{margin:0 0 12px;font-size:17px;line-height:1.4}
.q h3 span{color:var(--lv);margin-right:6px}
.q label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);cursor:pointer;margin:6px 0;transition:border-color .15s}
.q label:hover{border-color:var(--lv)}
.q input{margin-top:5px;accent-color:var(--lv)}
.q.answered label{cursor:default}
.q label.ok{border-color:var(--good);background:var(--goodt)}
.q label.no{border-color:var(--bad);background:var(--badt)}
.q .why{margin-top:10px;font-size:14.5px;color:var(--ink2);display:none;padding:10px 12px;background:var(--sunk);border-radius:var(--r2)}
.q.answered .why{display:block}
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}
.score .big{font-family:var(--fd);font-weight:800;font-size:48px;line-height:1;color:var(--lv)}
.badge{display:inline-block;background:var(--good);color:#fff;font-weight:750;padding:5px 12px;border-radius:999px}

/* cfop & library */
.search{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.search input{flex:1 1 260px;border:1px solid var(--line);background:var(--surface);padding:12px 16px;font-size:16.5px;border-radius:999px;box-shadow:var(--sh)}
.search input:focus{outline:none;border-color:var(--lv);box-shadow:0 0 0 3px var(--lvt)}
.search select{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:999px}
td.code{font-family:var(--fd);font-weight:800;font-size:16px;white-space:nowrap;color:var(--lv)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:12px 0 26px}
.lib button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.lib button:hover,.lib button:focus-visible{border-color:var(--lv);outline:none}
.lib button b{font-family:var(--fd);font-weight:700;font-size:15.5px;line-height:1.3}
.lib button small{color:var(--ink2);font-size:13.5px}
.lib button em{font-style:normal;font-size:12px;color:var(--ink3)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(14,18,32,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:61;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--sh2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dhead{padding:22px 24px 18px;background:var(--hero);color:var(--onhero);position:relative}
.dhead small{color:#AEB4D3;font-weight:600;font-size:12.5px}
.dhead h2{color:#fff;margin:6px 40px 6px 0;font-size:24px}
.dhead p{color:#C4C9E2;margin:0;font-size:15px}
.dclose{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer}
.dbody{padding:20px 24px 30px;overflow:auto;flex:1}
.dbody h3{font-size:16px;margin:22px 0 8px;color:var(--ink2)}
.dbody h3:first-child{margin-top:0}
.dbody ul{padding-left:20px}
.dbody .uses a{display:inline-block;margin:0 6px 6px 0;padding:5px 11px;border-radius:999px;background:var(--sunk);text-decoration:none;color:var(--ink);font-size:13.5px}
.dbody .uses a:hover{background:var(--lvt)}
.dbody .src{margin-top:22px;padding:14px 16px;border-radius:var(--r2);background:var(--sunk);font-size:14px;color:var(--ink2)}

.foot{margin-top:60px;font-size:13px;color:var(--ink3);border-top:1px solid var(--line);padding-top:16px;max-width:860px}

@media (max-width: 960px){
  .wrap{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 57px);bottom:0;height:auto;width:min(320px,88vw);background:var(--surface);z-index:50;transform:translateX(-102%);transition:transform .22s;border-right:1px solid var(--line);box-shadow:var(--sh2);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  .side.open{transform:none}
  .menubtn{display:inline-block}
  .hero{grid-template-columns:1fr}
  .ring{width:150px;height:150px}.ring div{width:114px;height:114px}.ring b{font-size:32px}
}
@media (max-width: 640px){
  .brand b{display:none}
  .top{padding:8px 12px;gap:8px}
  .tabs a{padding:6px 10px;font-size:13.5px}
  .tabs a.opt{display:none}
  body{font-size:16px}
  .danfe .row{grid-template-columns:1fr 1fr!important}
  .danfe .f{border-bottom:1px solid var(--line)}
  .tl .y{grid-template-columns:1fr;gap:2px}
  .pager{grid-template-columns:1fr}.pager a.nx{grid-column:1}
  .lhead{padding:22px 18px 18px}
}

/* salvar, usuário, toast */
.savebtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:650;font-size:14px;color:var(--ink)}
.savebtn .sd{width:8px;height:8px;border-radius:50%;background:var(--good)}
.savebtn.dirty{background:var(--l2);border-color:var(--l2);color:#fff}
.savebtn.dirty .sd{background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.usr{display:grid;place-items:center;text-decoration:none;font-weight:800;font-family:var(--fd);padding:0;width:36px}
.usr.av{background:var(--hero);color:#fff;border-color:var(--hero)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--hero);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:var(--sh2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.noauth .tabs,body.noauth .savebtn,body.noauth .usr,body.noauth .menubtn,body.noauth .side{display:none}
body.noauth .wrap{grid-template-columns:1fr}
body.big{font-size:18.5px} body.big .sl a.it{font-size:15.5px} body.big table{font-size:16px}
body.calm *{transition:none!important;animation:none!important}

/* auth */
.auth{min-height:calc(100vh - 140px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,440px);gap:28px;align-items:center;max-width:1040px;margin:0 auto}
.auth .hero{grid-template-columns:1fr}
.authcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--sh)}
.authcard h2{margin:0 0 4px}
.seg{display:flex;background:var(--sunk);padding:4px;border-radius:999px;margin:4px 0 18px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:999px;font-weight:650;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.stackf{display:flex;flex-direction:column;gap:12px}
.stackf label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:650;color:var(--ink2)}
.stackf input,.stackf select,.stackf textarea,.cfg input,.cfg select{border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px;color:var(--ink);border-radius:var(--r2);width:100%;font-weight:500}
.stackf input:focus,.stackf select:focus,.stackf textarea:focus,.cfg input:focus,.cfg select:focus{outline:none;border-color:var(--lv);box-shadow:0 0 0 3px var(--lvt)}
.msg{font-size:14px;padding:10px 12px;border-radius:var(--r2);display:none}
.msg.err{display:block;background:var(--badt);color:var(--bad)}
.msg.ok{display:block;background:var(--goodt);color:var(--good)}
.muted{color:var(--ink3);font-size:13.5px}

/* configurações */
.cfgwrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.cfgnav{position:sticky;top:80px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.cfgnav button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:var(--r2);cursor:pointer;font-weight:600;color:var(--ink2);font-size:14.5px}
.cfgnav button:hover{background:var(--sunk);color:var(--ink)}
.cfgnav button[aria-current="true"]{background:var(--lvt);color:var(--lv)}
.cfg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.cfg h2{margin-top:0;font-size:22px}
.cfg .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 18px;margin:14px 0}
.cfg label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:650;color:var(--ink2)}
.cfg .sw{flex-direction:row;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r2);font-size:15px;color:var(--ink);font-weight:600}
.cfg .sw small{display:block;font-weight:500;color:var(--ink3);font-size:13px}
.cfg .sw input{width:auto;accent-color:var(--lv);transform:scale(1.3)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.urow{display:grid;grid-template-columns:minmax(0,1.4fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.urow:last-child{border-bottom:0}
.urow b{font-family:var(--fd)}
.lvchk{display:flex;gap:6px;flex-wrap:wrap}
.lvchk label{flex-direction:row;align-items:center;gap:4px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink)}
.lvchk input{accent-color:var(--lv)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink2)}
.pill.adm{background:var(--l3t);color:var(--l3)}

/* anotações */
.notes{margin-top:34px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh)}
.notes h3{margin:0 0 8px}
.notes textarea{width:100%;min-height:110px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r2);padding:12px;font-size:15.5px;resize:vertical;color:var(--ink)}
.notes textarea:focus{outline:none;border-color:var(--lv);box-shadow:0 0 0 3px var(--lvt)}
.notes .bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}

/* prova */
.exhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:20;display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--hero);color:#fff;border-radius:var(--r);padding:12px 18px;margin-bottom:18px;box-shadow:var(--sh2);flex-wrap:wrap}
.exhead .tm{font-family:var(--fd);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.exhead .tm.low{color:#FFB4B9}
.exhead .bar{background:rgba(255,255,255,.18);width:180px}
.exhead .bar i{background:#fff}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0}
.rules div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:14px}
.rules b{display:block;font-family:var(--fd);font-size:26px;color:var(--lv);line-height:1.1}
.rules small{color:var(--ink2)}
.cert{background:radial-gradient(120% 140% at 100% 0%,var(--hero2) 0%,var(--hero) 60%);color:#fff;border-radius:22px;padding:28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh2)}
.cert .big{font-family:var(--fd);font-weight:800;font-size:56px;line-height:1}
.cert p{color:#C4C9E2;margin:4px 0 0}
.stamp2{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:800;font-size:14px}
.stamp2.ok{background:var(--l1);color:#fff}.stamp2.no{background:var(--bad);color:#fff}
.q.rev label.pick:not(.ok){border-color:var(--bad);background:var(--badt)}
.q .qtag{float:right;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.q .qtag.ok{background:var(--goodt);color:var(--good)}.q .qtag.no{background:var(--badt);color:var(--bad)}.q .qtag.na{background:var(--sunk);color:var(--ink3)}
.lockbox{text-align:center;padding:50px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.lockbox .ic{font-size:40px}
.sl.locked a.it{opacity:.45}
.sl.locked .h small::after{content:" · bloqueado"}
@media (max-width: 760px){ .auth{grid-template-columns:1fr} .auth .hero{display:none} .cfgwrap{grid-template-columns:1fr} .cfgnav{position:static;flex-direction:row;overflow-x:auto} .cfgnav button{white-space:nowrap} .urow{grid-template-columns:1fr} .savebtn #saveTxt{display:none} .savebtn{padding:0 12px} }

#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff!important;padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea svg{width:297mm;height:210mm;display:block}
}
.brand .bt{display:flex;flex-direction:column;line-height:1.15}
.brand .bt small{font-size:12px;color:var(--ink3);font-weight:500}
@media (max-width: 640px){.brand .bt{display:none}}

/* treinamentos */
.crsbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;background:var(--hero);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.crsbtn:hover{filter:brightness(1.15)}
body.noauth .crsbtn{display:none}
.crschip{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.1);color:#fff;text-decoration:none;padding:5px 12px;border-radius:999px;font-size:13.5px;font-weight:650;margin-bottom:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.crschip span{opacity:.7}
.crscard{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:12px;border-radius:var(--r);background:var(--hero);color:#fff;text-decoration:none}
.crscard .ci{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:18px;flex:none}
.crscard small{display:block;color:#AEB4D3;font-size:11.5px;font-weight:600}
.crscard b{font-family:var(--fd);font-size:15px;line-height:1.2;display:block}
.crscard .sw2{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:999px}
.crsbox{cursor:default}
.crsbox.cur{border-color:var(--lv);box-shadow:0 0 0 2px var(--lvt),var(--sh)}
.crsbox.off{opacity:.6}
.crsbox:hover{transform:none}
.lvchk .crsl{border-color:var(--ink3)}
@media (max-width: 640px){ #crsTxt{display:none} .crsbtn{padding:0 10px} }
.donebadge{display:inline-flex;align-items:center;gap:6px;background:var(--goodt);color:var(--good);font-weight:750;padding:9px 16px;border-radius:999px}
.linkbtn{border:0;background:none;color:var(--ink3);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.linkbtn:hover{color:var(--bad)}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn menubtn" id="menuBtn" aria-label="Abrir menu de aulas" aria-expanded="false">☰</button>
  <a class="brand" href="#home"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><span class="bt"><b>Mestre - Treinamento</b><small>Treinamento da área fiscal</small></span></a>
  <a class="crsbtn" id="crsBtn" href="#cursos" aria-label="Trocar de treinamento"><span id="crsIc">🧾</span><span id="crsTxt">Fiscal</span><span aria-hidden="true">▾</span></a>
  <nav class="tabs" aria-label="Seções">
    <a href="#home" data-tab="home">Trilha</a>
    <a href="#leis" data-tab="leis">Biblioteca legal</a>
    <a href="#calc" data-tab="calc" class="opt">Calculadoras</a>
    <a href="#cert" data-tab="cert">Certificados</a>
    <a href="#ref" data-tab="ref" class="opt">CFOP</a>
  </nav>
  <button class="savebtn" id="saveBtn" type="button"><span class="sd" aria-hidden="true"></span><span id="saveTxt">Salvar</span></button>
  <a class="iconbtn usr" id="usrBtn" href="#config" aria-label="Configurações"><span id="usrIni">⚙</span></a>
</header>
<div class="wrap">
  <aside class="side" id="side" aria-label="Aulas"></aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true"></aside>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>

const R = n => (Math.round(n*100)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const P = n => (Math.round(n*100)/100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
const lei = (t,txt) => `<div class="lei"><div class="ic" aria-hidden="true">§</div><div class="body"><small>Base legal · toque na norma para abrir</small><b>${t}</b><p>${txt}</p></div></div>`;
const aten = t => `<div class="note aten"><div class="ni" aria-hidden="true">!</div><p><b>Atenção</b>${t}</p></div>`;
const erro = t => `<div class="note erro"><div class="ni" aria-hidden="true">✕</div><p><b>Erro comum</b>${t}</p></div>`;
const dica = t => `<div class="note dica"><div class="ni" aria-hidden="true">✓</div><p><b>Na prática</b>${t}</p></div>`;
const ex = (t,inner,tag='Exemplo') => `<section class="ex"><header><span>${t}</span><i>${tag}</i></header><div class="in">${inner}</div></section>`;
const tbl = (head,rows,cls='') => `<div class="tw"><table class="${cls}"><thead><tr>${head.map(h=>`<th${h.startsWith('>')?' class="r"':''}>${h.replace(/^>/,'')}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr${r._tot?' class="tot"':''}>${(r.c||r).map((c,i)=>`<td${String(head[i]||'').startsWith('>')?' class="r"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const tot = c => ({_tot:true,c});
const flow = arr => `<div class="flow">${arr.map((a,i)=>`<div><b>${i+1}</b><span>${a[0]}</span><small>${a[1]}</small></div>`).join('')}</div>`;
function danfe(d){
  const f=(l,v,cls='')=>`<div class="f ${cls}"><small>${l}</small><span>${v}</span></div>`;
  const it = d.itens.map(i=>`<tr><td>${i.d}</td><td>${i.ncm||'—'}</td><td>${i.cst}</td><td><b>${i.cfop}</b></td><td class="r">${i.q}</td><td class="r">${R(i.v)}</td><td class="r">${i.bc!=null?R(i.bc):'—'}</td><td class="r">${i.icms!=null?R(i.icms):'—'}</td><td class="r">${i.al!=null?P(i.al):'—'}</td></tr>`).join('');
  return `<div class="danfe">
  <div class="hd"><span>DANFE · NF-e ${d.num||'000.123'}</span><em>${d.tipo||'1 – Saída'}</em></div>
  <div class="row" style="grid-template-columns:2fr 1fr">${f('Natureza da operação',d.nat,'hl')}${f('Data de emissão',d.data||'05/10/2026')}</div>
  <div class="row" style="grid-template-columns:2fr 1fr 1fr">${f('Emitente',d.em[0])}${f('UF',d.em[1])}${f('Regime',d.em[2]||'Lucro Real')}</div>
  <div class="row" style="grid-template-columns:2fr 1fr 1fr">${f('Destinatário',d.de[0])}${f('UF',d.de[1])}${f('Indicador IE',d.de[2]||'Contribuinte')}</div>
  <div class="tw" style="margin:0;border:0;border-bottom:1.5px solid var(--ink)"><table><thead><tr><th>Produto</th><th>NCM</th><th>CST</th><th>CFOP</th><th class="r">Qtd</th><th class="r">Valor</th><th class="r">BC ICMS</th><th class="r">ICMS</th><th class="r">Alíq.</th></tr></thead><tbody>${it}</tbody></table></div>
  <div class="row" style="grid-template-columns:repeat(${d.tot.length},1fr)">${d.tot.map(t=>f(t[0],t[1],t[2]||'')).join('')}</div>
  ${d.obs?`<div class="row" style="grid-template-columns:1fr">${f('Informações complementares',d.obs)}</div>`:''}
  </div>`;
}

const LEVELS_FISCAL = [
{ n:1, title:'Nível básico', sub:'Escrituração fiscal, movimentações, legislação base e CFOP', lessons:[

{id:'b1', t:'O que é escrituração fiscal', h:`
<p class="lead">Escriturar é registrar, de forma organizada e com base em documento fiscal, tudo o que entra e sai da empresa, para apurar corretamente os tributos e prestar contas ao Fisco.</p>
<p>Pense na escrituração fiscal como o "diário oficial" das mercadorias e serviços da empresa. Cada nota fiscal recebida ou emitida vira um lançamento, e é a soma desses lançamentos que mostra quanto de ICMS, IPI, PIS e Cofins a empresa deve ou tem de crédito.</p>
<h2>O ciclo fiscal mensal</h2>
<p>Todo mês o setor fiscal percorre a mesma sequência. Errar uma etapa contamina todas as seguintes.</p>
${flow([['Documento','A operação gera uma NF-e, CT-e, NFS-e ou NFC-e'],['Conferência','Validar CFOP, CST, NCM, alíquotas e valores'],['Escrituração','Registrar entradas e saídas no sistema fiscal'],['Apuração','Débitos menos créditos de cada tributo'],['Pagamento','Emitir GARE, DARF, GNRE ou DAS'],['Declaração','Transmitir EFD, DCTFWeb e demais obrigações']])}
<h2>Os livros fiscais</h2>
<p>Antigamente eram livros de papel. Hoje são registros dentro da EFD ICMS/IPI (SPED Fiscal), mas a lógica continua a mesma.</p>
${tbl(['Livro','O que registra','Na EFD hoje'],[
['Registro de Entradas','Todas as notas de compra, devolução recebida, transferências recebidas','Bloco C (C100/C170/C190)'],
['Registro de Saídas','Todas as notas emitidas: vendas, remessas, devoluções','Bloco C e D'],
['Apuração do ICMS','Confronto mensal de débitos e créditos','Bloco E (E110)'],
['Apuração do IPI','Confronto mensal de débitos e créditos de IPI','Bloco E (E520)'],
['Registro de Inventário','Estoque existente em 31/12 (ou data exigida)','Bloco H'],
['Controle de Produção e Estoque','Movimentação física de insumos e produtos','Bloco K'],
['CIAP','Crédito de ICMS do ativo imobilizado em 1/48 avos','Bloco G']])}
<h2>Princípios que guiam a escrituração</h2>
<ul>
<li><strong>Documento hábil:</strong> só se escritura o que tem documento fiscal idôneo. Sem nota, sem crédito.</li>
<li><strong>Competência:</strong> a nota é lançada no período da entrada efetiva ou da saída, não quando é paga.</li>
<li><strong>Não cumulatividade:</strong> o imposto pago na etapa anterior vira crédito na etapa seguinte (ICMS, IPI e PIS/Cofins no regime não cumulativo).</li>
<li><strong>Legalidade:</strong> todo tratamento (alíquota, benefício, crédito) precisa de previsão em lei ou regulamento.</li>
<li><strong>Uniformidade e cronologia:</strong> lançamentos em ordem, sem rasuras e sem lacunas de numeração.</li>
</ul>
${lei('Convênio SINIEF s/nº de 15/12/1970 e Ajuste SINIEF 02/2009','O Convênio de 1970 criou os livros e documentos fiscais e a tabela de CFOP. O Ajuste SINIEF 02/2009 instituiu a EFD ICMS/IPI, que substituiu os livros em papel. O SPED foi criado pelo Decreto 6.022/2007.')}
${dica('Crie o hábito de conciliar o que está no sistema com o que está na SEFAZ. Notas emitidas contra o CNPJ da empresa e não escrituradas são um dos principais alvos de fiscalização eletrônica.')}
`},

{id:'b2', t:'Legislação base', h:`
<p class="lead">A tributação brasileira é organizada em camadas. Saber em qual camada está a regra ajuda a saber onde procurar a resposta.</p>
${flow([['Constituição','Define quem pode cobrar cada tributo e os limites'],['Leis complementares','Normas gerais nacionais (CTN, Lei Kandir)'],['Leis ordinárias','Cada ente institui seu tributo'],['Regulamentos','Decretos: RICMS, RIPI'],['Normas complementares','Portarias, INs, convênios, soluções de consulta']])}
<h2>Principais normas por tributo</h2>
${tbl(['Tributo','Competência','Norma base','Regulamento / observação'],[
['ICMS','Estados e DF','CF art. 155, II · LC 87/1996 (Lei Kandir)','RICMS de cada UF (SP: Decreto 45.490/2000) e convênios CONFAZ'],
['IPI','União','CF art. 153, IV · Lei 4.502/1964','RIPI (Decreto 7.212/2010) e TIPI (Decreto 11.158/2022)'],
['PIS / Cofins','União','CF art. 195 · Leis 9.718/1998, 10.637/2002 e 10.833/2003','IN RFB 2.121/2022 (consolidação)'],
['ISS','Municípios','CF art. 156, III · LC 116/2003','Lei de cada município'],
['Simples Nacional','União, Estados e Municípios','LC 123/2006','Resoluções CGSN'],
['Normas gerais','—','CTN – Lei 5.172/1966','Fato gerador, crédito, prescrição, decadência'],
['Reforma do consumo','União, Estados e Municípios','EC 132/2023 · LC 214/2025 · LC 227/2026','IBS, CBS e Imposto Seletivo (ver Nível 4)']])}
<h2>Conceitos do CTN que você vai usar todo dia</h2>
<ul>
<li><strong>Fato gerador:</strong> a situação que faz nascer o tributo. No ICMS, em regra, é a saída da mercadoria do estabelecimento.</li>
<li><strong>Base de cálculo:</strong> o valor sobre o qual se aplica a alíquota.</li>
<li><strong>Contribuinte:</strong> quem pratica o fato gerador. <strong>Responsável:</strong> quem a lei obriga a pagar no lugar dele (por exemplo, o substituto tributário).</li>
<li><strong>Obrigação principal:</strong> pagar o tributo. <strong>Obrigação acessória:</strong> emitir notas, escriturar, declarar.</li>
<li><strong>Decadência e prescrição:</strong> em regra, 5 anos. Por isso documentos e arquivos devem ser guardados por pelo menos esse prazo.</li>
</ul>
${ex('Onde procurar a resposta',`<p>Pergunta: "Posso tomar crédito de ICMS da energia elétrica usada no escritório?"</p><p>Caminho: LC 87/1996, art. 33, II, define quando o crédito de energia é permitido (consumo no processo de industrialização, por exemplo). Depois confira o RICMS do seu estado, que repete e detalha a regra. Resposta: no escritório administrativo de um comércio, não.</p>`,'Raciocínio')}
${aten('Convênios ICMS (CONFAZ) precisam ser internalizados por cada estado para produzir efeito. Sempre confira se o seu RICMS já incorporou o convênio.')}
`},

{id:'b3', t:'Anatomia da nota fiscal', h:`
<p class="lead">Antes de escriturar, é preciso ler a nota. Cada campo diz algo sobre o tratamento tributário da operação.</p>
${danfe({nat:'Venda de mercadoria adquirida de terceiros',em:['Comercial Alfa Ltda.','SP'],de:['Loja Beta Ltda.','SP'],itens:[{d:'Cadeira de escritório',ncm:'9401.30.10',cst:'000',cfop:'5.102',q:10,v:5000,bc:5000,icms:900,al:18}],tot:[['Base de cálculo ICMS',R(5000)],['Valor do ICMS',R(900)],['Frete',R(0)],['Valor total da nota',R(5000),'hl']]})}
<h2>Campos essenciais</h2>
${tbl(['Campo','O que significa','Por que importa'],[
['Natureza da operação','Descrição da operação em texto','Precisa ser coerente com o CFOP'],
['CFOP','Código Fiscal de Operações e Prestações','Define o tipo da operação e impacta crédito e apuração'],
['NCM','Nomenclatura Comum do Mercosul, 8 dígitos','Define alíquota de IPI, ST, benefícios e monofásico'],
['CST / CSOSN','Código de Situação Tributária','Diz se é tributado, isento, com ST, com redução etc.'],
['CEST','Código Especificador da ST','Obrigatório para produtos listados no Conv. ICMS 142/2018'],
['Base de cálculo','Valor sobre o qual incide o imposto','Erros aqui geram débito ou crédito indevido'],
['Indicador de IE do destinatário','Contribuinte, isento ou não contribuinte','Determina DIFAL e alíquota interestadual']])}
<h2>Lendo o CST do ICMS</h2>
<p>O CST tem 3 dígitos. O primeiro é a <strong>origem</strong> da mercadoria, os dois seguintes a <strong>tributação</strong>.</p>
${tbl(['Origem','Significado'],[['0','Nacional'],['1','Estrangeira, importação direta'],['2','Estrangeira, adquirida no mercado interno'],['3, 5, 8','Nacional com conteúdo de importação (faixas)'],['4','Nacional, processos produtivos básicos'],['6, 7','Estrangeira sem similar nacional (lista CAMEX)']])}
${tbl(['Tributação','Significado'],[['00','Tributada integralmente'],['10','Tributada e com cobrança do ICMS por ST'],['20','Com redução de base de cálculo'],['30','Isenta ou não tributada, com cobrança de ST'],['40 / 41','Isenta / Não tributada'],['50','Suspensão'],['51','Diferimento'],['60','ICMS cobrado anteriormente por ST'],['70','Redução de base e cobrança de ST'],['90','Outras']])}
${ex('Montando a base de cálculo do ICMS',`<p>Venda interna em SP: mercadorias R$ 10.000, frete cobrado do cliente R$ 500, seguro R$ 100, desconto incondicional R$ 600. IPI de R$ 1.000 (cliente é revendedor).</p>
${tbl(['Componente','>Valor','Entra na base?'],[['Mercadorias',R(10000),'Sim'],['Frete cobrado na nota',R(500),'Sim'],['Seguro',R(100),'Sim'],['Desconto incondicional','− '+R(600),'Reduz a base'],['IPI',R(1000),'Não, porque o cliente vai revender (CF art. 155, §2º, XI)'],tot(['Base de cálculo do ICMS',R(10000),'']),tot(['ICMS a 18%',R(1800),''])])}
<p>Se o mesmo cliente comprasse para <strong>uso e consumo</strong>, o IPI entraria na base: R$ 11.000 × 18% = R$ 1.980.</p>`)}
${lei('LC 87/1996, art. 13','Integram a base do ICMS o próprio imposto (cálculo "por dentro"), seguros, juros, frete cobrado e demais importâncias pagas ou recebidas, e excluem-se os descontos incondicionais.')}
`},

{id:'b4', t:'Compras', h:`
<p class="lead">Na entrada, a pergunta-chave é: <strong>para que esta compra vai ser usada?</strong> A finalidade decide o CFOP, o direito a crédito e até o DIFAL.</p>
${tbl(['Finalidade','CFOP estadual','CFOP interestadual','Crédito de ICMS'],[
['Revenda (comércio)','1.102','2.102','Sim'],
['Industrialização (matéria-prima, embalagem)','1.101','2.101','Sim'],
['Uso e consumo (material de escritório, limpeza)','1.556','2.556','Não (permitido só a partir de 2033, LC 87 art. 33, I)'],
['Ativo imobilizado (máquinas, equipamentos)','1.551','2.551','Sim, em 48 parcelas mensais via CIAP'],
['Revenda com ST já retida','1.403','2.403','Não, o imposto já foi pago antecipadamente']])}
${ex('Compra para revenda dentro de SP',`
${danfe({tipo:'Nota do fornecedor',nat:'Venda de mercadoria',em:['Distribuidora Gama S.A.','SP'],de:['Comercial Alfa Ltda.','SP'],itens:[{d:'Cadeira de escritório',ncm:'9401.30.10',cst:'000',cfop:'5.102',q:20,v:8000,bc:8000,icms:1440,al:18}],tot:[['Base ICMS',R(8000)],['ICMS',R(1440)],['Total',R(8000),'hl']]})}
<p><strong>Escrituração na Comercial Alfa:</strong> a nota chega com CFOP 5.102 (do fornecedor). Na entrada, a Alfa lança com <strong>1.102</strong>, porque vai revender.</p>
${tbl(['Registro de entradas','>Valor'],[['Valor contábil',R(8000)],['Base de cálculo',R(8000)],['ICMS creditado',R(1440)],['CFOP de entrada','1.102']])}
<p>Se fosse Lucro Real, a Alfa também teria crédito de PIS (1,65%) e Cofins (7,6%) sobre a compra para revenda.</p>`)}
${ex('Compra de material de uso e consumo vinda de MG',`<p>A Alfa (SP) compra R$ 1.000 de material de limpeza de um fornecedor de MG, com ICMS destacado a 12%.</p>
<ul><li>CFOP de entrada: <strong>2.556</strong>.</li><li>Crédito de ICMS: <strong>nenhum</strong>.</li><li>DIFAL: a Alfa deve recolher a diferença entre a alíquota interna de SP (18%) e a interestadual (12%). Veja o cálculo no Nível 2.</li></ul>`)}
${ex('Compra de máquina para o ativo',`<p>Indústria compra uma máquina por R$ 48.000 com ICMS de R$ 8.640. O crédito não é tomado de uma vez: entra no CIAP e é apropriado em 48 meses.</p>
${tbl(['Cálculo mensal do CIAP','>Valor'],[['ICMS do bem',R(8640)],['Parcela de 1/48',R(180)],['× fator (saídas tributadas ÷ saídas totais), ex.: 90%','× 0,90'],tot(['Crédito do mês',R(162)])])}`)}
${erro('Lançar compra de uso e consumo com CFOP 1.102 só porque o fornecedor usou 5.102. O CFOP de entrada reflete a finalidade de quem compra, não a de quem vende.')}
${lei('LC 87/1996, arts. 19, 20 e 33','Asseguram o crédito do imposto anteriormente cobrado em mercadorias e no ativo imobilizado (este em 1/48 por mês) e adiam o crédito de uso e consumo para 1º/01/2033.')}
`},

{id:'b5', t:'Vendas', h:`
<p class="lead">Na saída, três perguntas definem a nota: <strong>o que estou vendendo</strong> (produção própria ou revenda), <strong>para onde</strong> (mesmo estado, outro estado ou exterior) e <strong>para quem</strong> (contribuinte ou consumidor final).</p>
${tbl(['Situação','CFOP','Observação'],[
['Venda de produção própria, mesmo estado','5.101','Indústria'],
['Venda de mercadoria de terceiros, mesmo estado','5.102','Comércio'],
['Venda de produção para outro estado','6.101','Alíquota interestadual'],
['Venda de revenda para outro estado','6.102','Alíquota interestadual'],
['Venda para outro estado a não contribuinte','6.107 / 6.108','Gera DIFAL ao estado de destino (EC 87/2015)'],
['Venda com ST, como substituto','5.403 / 6.403','Remetente retém o ICMS-ST'],
['Venda de mercadoria com ST já retida','5.405','Remetente substituído, sem novo destaque'],
['Exportação','7.101 / 7.102','Imune de ICMS, IPI, PIS e Cofins'],
['Venda a consumidor no varejo (NFC-e)','5.102','Documento modelo 65']])}
${ex('Venda interestadual SP → BA para contribuinte',`
${danfe({nat:'Venda de mercadoria adquirida de terceiros',em:['Comercial Alfa Ltda.','SP'],de:['Comercial Delta Ltda.','BA'],itens:[{d:'Cadeira de escritório',ncm:'9401.30.10',cst:'000',cfop:'6.102',q:10,v:6000,bc:6000,icms:420,al:7}],tot:[['Base ICMS',R(6000)],['ICMS',R(420)],['Total',R(6000),'hl']]})}
<p>De SP (Sudeste) para a BA (Nordeste), a alíquota interestadual é <strong>7%</strong>. A Delta revende a cadeira, então não há DIFAL. Ela credita R$ 420 e, ao vender na BA, paga a diferença pela alíquota interna.</p>`)}
${ex('A mesma venda para um consumidor final na BA',`<p>Se a Delta fosse uma clínica sem inscrição estadual (não contribuinte), a Alfa usaria CFOP <strong>6.108</strong>, destacaria 7% e recolheria o DIFAL para a BA: diferença entre a alíquota interna baiana e os 7%, mais eventual FCP. Recolhimento por GNRE ou inscrição no estado de destino.</p>`)}
${aten('Mercadoria importada (origem 1, 2, 3 ou 8) em operação interestadual sai a 4%, conforme Resolução do Senado 13/2012, independentemente da rota.')}
`},

{id:'b6', t:'Transferências', h:`
<p class="lead">Transferência é a remessa de mercadoria entre estabelecimentos da <strong>mesma empresa</strong> (mesmo CNPJ raiz). Não há venda, não há mudança de dono.</p>
${tbl(['Situação','Saída','Entrada'],[
['Transferência de produção própria','5.151 / 6.151','1.151 / 2.151 (industrialização) ou 1.152 / 2.152 (comercialização)'],
['Transferência de mercadoria adquirida','5.152 / 6.152','1.152 / 2.152'],
['Transferência de ativo imobilizado','5.552 / 6.552','1.552 / 2.552'],
['Transferência de material de uso e consumo','5.557 / 6.557','1.557 / 2.557']])}
<h2>O que mudou: não há mais ICMS na transferência</h2>
<p>Por anos, os estados cobravam ICMS em transferências. O STF decidiu que não há fato gerador quando a mercadoria apenas muda de endereço dentro da mesma empresa. A LC 204/2023 alterou a Lei Kandir para refletir isso e garantir que o crédito acumulado na origem seja transferido ao destino.</p>
${lei('ADC 49 (STF), LC 204/2023 e Convênio ICMS 178/2023','Não incide ICMS no deslocamento entre estabelecimentos do mesmo titular. O crédito relativo às operações anteriores é transferido ao estabelecimento destinatário, com destaque na NF-e, pelas regras do Convênio 178/2023.')}
${ex('Transferência SP → PR de mercadoria para revenda',`<p>A Alfa (matriz em SP) comprou mercadorias por R$ 10.000 com ICMS de R$ 1.800 e transfere tudo para a filial no PR.</p>
${tbl(['Etapa','>Valor'],[['Valor da transferência (custo de aquisição)',R(10000)],['Alíquota interestadual SP → PR','12%'],['Crédito transferido destacado na NF-e',R(1200)],['Matriz SP: estorna/ajusta o crédito correspondente','− '+R(1200)],['Filial PR: lança o crédito recebido (CFOP 2.152)',R(1200)]])}
<p>Na prática, a nota sai com CFOP 6.152, sem incidência de ICMS, mas com o valor do crédito transferido informado conforme as regras da SEFAZ e da Nota Técnica vigente.</p>`)}
${aten('A transferência continua exigindo NF-e. O IPI continua incidindo em transferências entre estabelecimentos industriais quando há fato gerador pelas regras do RIPI. Verifique sempre o seu caso.')}
`},

{id:'b7', t:'Outras movimentações', h:`
<p class="lead">Nem toda nota é compra ou venda. Remessas e retornos movimentam mercadoria sem transferir propriedade, e cada uma tem CFOP e tratamento próprios.</p>
${tbl(['Operação','Saída','Retorno / entrada','Tratamento usual de ICMS'],[
['Devolução de compra (para comercialização)','5.202 / 6.202','—','Destaca o mesmo ICMS creditado na compra'],
['Devolução de venda recebida','—','1.202 / 2.202','Credita o ICMS debitado na venda'],
['Remessa para conserto','5.915 / 6.915','1.916 / 2.916','Suspensão (em geral 180 dias)'],
['Remessa para demonstração','5.912 / 6.912','1.913 / 2.913','Suspensão por prazo definido no RICMS'],
['Bonificação, doação ou brinde','5.910 / 6.910','1.910 / 2.910','Tributada normalmente na maioria dos estados'],
['Remessa para industrialização por encomenda','5.901 / 6.901','1.902 / 2.902 (retorno do insumo) e 1.124 / 2.124 (serviço)','Suspensão; o serviço agregado pode ser tributado'],
['Comodato','5.908 / 6.908','1.909 / 2.909','Não incidência'],
['Remessa para armazém geral','5.905 / 6.905','1.906 / 2.906','Não incidência em operação interna'],
['Venda para entrega futura','5.922 (faturamento) e 5.117 (remessa)','—','ICMS destacado na remessa'],
['Perda, roubo ou deterioração','5.927','—','Estorno do crédito da entrada']])}
${ex('Devolução de venda',`<p>A Alfa vendeu 10 cadeiras para a Beta por R$ 5.000 (ICMS R$ 900, CFOP 5.102). A Beta devolve 2 cadeiras com defeito.</p>
${tbl(['Quem','Documento','CFOP','>Valor','>ICMS'],[['Beta (contribuinte)','Emite NF-e de devolução','5.202',R(1000),R(180)],['Alfa','Escritura a entrada da devolução','1.202',R(1000),R(180)+' crédito']])}
<p>A NF-e de devolução precisa referenciar a chave da nota original. Se a Beta não for contribuinte, a própria Alfa emite uma nota de entrada.</p>`)}
${ex('Conserto de máquina',`<p>A indústria envia uma máquina para conserto em outra empresa em SP. Nota de saída CFOP <strong>5.915</strong>, com ICMS suspenso. Quando volta, o prestador emite nota de retorno (5.916) e, se cobrar peças, uma nota de venda das peças e a nota de serviço (ISS).</p>`)}
${dica('Remessas com suspensão têm prazo. Se a mercadoria não retornar dentro dele, o imposto suspenso passa a ser devido. Controle esses prazos numa planilha ou no ERP.')}
`},

{id:'b8', t:'CFOP em detalhe', h:`
<p class="lead">O CFOP tem 4 dígitos. O primeiro diz <strong>de onde ou para onde</strong>; os três seguintes, <strong>que tipo de operação</strong> é.</p>
<div class="cfopdigits">
<div><b>1</b><small>Entrada do mesmo estado</small></div><div><b>2</b><small>Entrada de outro estado</small></div><div><b>3</b><small>Entrada do exterior</small></div>
<div><b>5</b><small>Saída para o mesmo estado</small></div><div><b>6</b><small>Saída para outro estado</small></div><div><b>7</b><small>Saída para o exterior</small></div></div>
${tbl(['Grupo','Tipo de operação'],[['x.100','Compras e vendas'],['x.150','Transferências'],['x.200','Devoluções e anulações'],['x.250','Energia elétrica'],['x.300','Serviços de comunicação'],['x.350','Serviços de transporte'],['x.400','Operações com substituição tributária'],['x.500','Remessas com fim específico de exportação'],['x.550','Ativo imobilizado e uso e consumo'],['x.600','Créditos e ressarcimentos de ICMS'],['x.650','Combustíveis e lubrificantes'],['x.900','Outras operações (remessas, retornos, bonificações)']])}
<h2>A regra do espelho</h2>
<p>A nota de saída do fornecedor e o lançamento de entrada do cliente "conversam": troca-se o primeiro dígito (5→1, 6→2) e, quando necessário, ajusta-se a finalidade.</p>
${tbl(['Fornecedor emite','Cliente revendedor lança','Cliente que usa no escritório lança','Indústria que usa como insumo lança'],[['5.102','1.102','1.556','1.101'],['6.102','2.102','2.556','2.101'],['5.405','1.403','1.407','1.401*']])}
<p style="font-size:14px;color:var(--ink2)">* Conforme o caso; consulte a tabela completa do Convênio s/nº de 1970 e suas atualizações.</p>
${ex('Teste rápido',`<p>Uma loja em Guarulhos (SP) compra notebooks de um distribuidor do Paraná para vender. Qual CFOP de entrada?</p><p><strong>Resposta:</strong> 2.102. Vem de outro estado (2) e é compra para comercialização (102).</p>`,'Pratique')}
${erro('Usar 5.949 ("outras saídas") por comodidade. CFOPs genéricos chamam a atenção do fisco e escondem o tratamento correto. Use sempre o código específico.')}
<p>Use a aba <a href="#cfop">Consulta CFOP</a> para pesquisar códigos por número ou palavra.</p>
`}
]},

{ n:2, title:'Nível intermediário', sub:'Alíquotas, DIFAL, ST, IPI, PIS/Cofins, ISS e apuração', lessons:[

{id:'i1', t:'ICMS: alíquotas e cálculo por dentro', h:`
<p class="lead">O ICMS tem alíquotas internas (definidas por cada estado) e interestaduais (definidas pelo Senado). E é calculado "por dentro": o imposto faz parte da própria base.</p>
<h2>Alíquotas interestaduais</h2>
${tbl(['Origem','Destino','Alíquota'],[['S e SE (exceto ES)','N, NE, CO e ES','7%'],['S e SE (exceto ES)','S e SE (exceto ES)','12%'],['N, NE, CO e ES','Qualquer estado','12%'],['Qualquer estado','Mercadoria importada ou com conteúdo de importação acima de 40%','4%']])}
${lei('Resoluções do Senado 22/1989 e 13/2012','Fixam as alíquotas interestaduais de 12% e 7% e a alíquota de 4% para bens importados.')}
<h2>Alíquotas internas</h2>
<p>Cada estado define a sua alíquota modal. SP mantém 18%; vários estados elevaram a modal para 19% a 22% entre 2023 e 2024. Há ainda alíquotas diferenciadas por produto (por exemplo, 7% ou 12% para itens da cesta básica em alguns estados) e o adicional do Fundo de Combate à Pobreza (FCP) de até 2% em certos produtos.</p>
${aten('Alíquotas internas mudam com frequência. Sempre confira a tabela vigente no RICMS do estado de destino antes de calcular DIFAL ou ST.')}
<h2>O que significa "por dentro"</h2>
${ex('Gross-up do ICMS',`<p>Um produto custa R$ 820 "limpo" e você quer saber o preço com ICMS de 18% embutido.</p>
${tbl(['Passo','>Cálculo'],[['Preço com ICMS = valor ÷ (1 − alíquota)','820 ÷ 0,82'],tot(['Preço de venda',R(1000)]),['ICMS = 18% de R$ 1.000',R(180)],['Carga efetiva sobre o valor limpo','180 ÷ 820 = 21,95%']])}
<p>A alíquota "nominal" é 18%, mas a carga real sobre o valor do produto é quase 22%. Essa é uma das distorções que a reforma tributária elimina com o cálculo "por fora".</p>`)}
`},

{id:'i2', t:'DIFAL', h:`
<p class="lead">O diferencial de alíquotas (DIFAL) garante que o estado de destino receba a parte dele quando a mercadoria vem de outro estado para <strong>consumo final</strong>.</p>
<h2>Quando ocorre</h2>
${tbl(['Situação','Quem recolhe','Base legal'],[['Contribuinte compra de outro estado para uso, consumo ou ativo','O próprio adquirente','LC 87/1996, art. 12, XV e RICMS do destino'],['Venda interestadual para não contribuinte (consumidor final)','O remetente (vendedor)','EC 87/2015 · LC 190/2022 · Conv. ICMS 236/2021']])}
${lei('EC 87/2015 e LC 190/2022','A EC 87 estendeu o DIFAL às vendas para não contribuintes. A LC 190/2022 regulamentou a cobrança e o STF validou a sua aplicação a partir de abril de 2022.')}
<h2>Base única x base dupla</h2>
<p>Há duas formas de cálculo, e a escolha depende da legislação do estado de destino.</p>
${ex('Compra de material de consumo: SP → MG, R$ 1.000',`<p>Alíquota interestadual 12%, alíquota interna de MG 18%.</p>
<h3>Base única</h3>
${tbl(['Passo','>Valor'],[['Base','R$ 1.000,00'],['Diferença de alíquotas','18% − 12% = 6%'],tot(['DIFAL',R(60)])])}
<h3>Base dupla (cálculo por dentro no destino)</h3>
${tbl(['Passo','>Valor'],[['ICMS da origem: 1.000 × 12%',R(120)],['Valor sem ICMS da origem: 1.000 − 120',R(880)],['Nova base: 880 ÷ (1 − 0,18)',R(1073.17)],['ICMS no destino: 1.073,17 × 18%',R(193.17)],tot(['DIFAL: 193,17 − 120',R(73.17)])])}
<p>A base dupla resulta em valor maior porque o ICMS do destino é incluído na própria base. Muitos estados adotam a base dupla para contribuintes e consumidores finais.</p>`)}
${ex('Venda para não contribuinte com FCP',`<p>Loja de SP vende R$ 2.000 para pessoa física no RJ (alíquota interna hipotética 20% + FCP 2%). Interestadual 12%.</p>
${tbl(['Passo','>Valor'],[['ICMS próprio para SP: 2.000 × 12%',R(240)],['DIFAL (base única): 2.000 × (20% − 12%)',R(160)],['FCP: 2.000 × 2%',R(40)],tot(['Total devido ao RJ',R(200)])])}
<p>A loja recolhe R$ 200 ao RJ por GNRE antes da saída da mercadoria (ou até o prazo, se tiver inscrição estadual de substituto no RJ).</p>`)}
<p>Faça seus próprios cálculos na <a href="#calc/difal">calculadora de DIFAL</a>.</p>
${dica('Empresas do Simples Nacional também recolhem DIFAL nas compras para uso, consumo e ativo, conforme LC 123/2006 art. 13, §1º, XIII, "h", observado o entendimento do estado.')}
`},

{id:'i3', t:'Substituição tributária (ICMS-ST)', h:`
<p class="lead">Na ST, um contribuinte da cadeia (normalmente a indústria ou o importador) recolhe antecipadamente o ICMS das etapas seguintes, até o consumidor final.</p>
${flow([['Indústria (substituta)','Recolhe o ICMS próprio e o ICMS-ST'],['Atacado (substituído)','Não recolhe mais ICMS sobre esse produto'],['Varejo (substituído)','Vende com CST 60, sem destaque'],['Consumidor','Paga o preço com o imposto já embutido']])}
${lei('LC 87/1996, arts. 6º a 10 · Convênio ICMS 142/2018','Autorizam a ST e definem as regras gerais: MVA, CEST, responsabilidade, ressarcimento. Os produtos sujeitos e as MVAs constam no RICMS de cada estado e nos protocolos e convênios específicos.')}
<h2>Conceitos</h2>
<ul><li><strong>MVA:</strong> margem de valor agregado, que presume o preço final ao consumidor.</li><li><strong>MVA ajustada:</strong> usada em operação interestadual para compensar a diferença entre a alíquota interestadual e a interna.</li><li><strong>CEST:</strong> código que identifica o produto sujeito a ST.</li><li><strong>Pauta / PMPF:</strong> alguns estados usam preço fixado em vez da MVA (comum em combustíveis e bebidas).</li></ul>
${ex('ST em operação interna em SP',`<p>Indústria vende autopeça: produto R$ 1.000, IPI 10% (R$ 100), MVA 40%, alíquota interna 18%.</p>
${tbl(['Passo','>Valor'],[['ICMS próprio: 1.000 × 18%',R(180)],['Base ST: (1.000 + 100) × 1,40',R(1540)],['ICMS total da cadeia: 1.540 × 18%',R(277.20)],tot(['ICMS-ST a reter: 277,20 − 180',R(97.20)]),['Total da nota: 1.000 + 100 + 97,20',R(1197.20)]])}`)}
${ex('ST interestadual com MVA ajustada: SP → PR',`<p>Mesmo produto, agora para o PR. Interestadual 12%, interna no destino 18%.</p>
${tbl(['Passo','>Valor'],[['MVA ajustada = [(1 + 0,40) × (1 − 0,12) ÷ (1 − 0,18)] − 1','50,24%'],['ICMS próprio: 1.000 × 12%',R(120)],['Base ST: 1.100 × 1,5024',R(1652.68)],['ICMS no destino: 1.652,68 × 18%',R(297.48)],tot(['ICMS-ST a reter: 297,48 − 120',R(177.48)])])}
<p>Repare: o IPI entra na base da ST, mas não na base do ICMS próprio (venda para revenda).</p>`)}
${aten('Se o preço final real for menor que o presumido, o substituído pode pedir ressarcimento (STF, Tema 201 – RE 593.849). Os estados regulamentam o procedimento, e alguns também exigem complemento quando o preço real é maior.')}
<p>Teste outros cenários na <a href="#calc/st">calculadora de ST</a>.</p>
`},

{id:'i4', t:'IPI', h:`
<p class="lead">O IPI incide sobre produtos industrializados, na saída do estabelecimento industrial ou equiparado e no desembaraço de importação.</p>
${lei('CF art. 153, IV · RIPI (Decreto 7.212/2010) · TIPI (Decreto 11.158/2022)','A alíquota é definida pela TIPI conforme o NCM. O IPI é não cumulativo e seletivo em função da essencialidade do produto.')}
<ul><li><strong>Contribuinte:</strong> indústria, importador e estabelecimentos equiparados a industrial.</li><li><strong>Base:</strong> valor da operação, incluindo frete e despesas cobradas.</li><li><strong>Cálculo "por fora":</strong> o IPI é somado ao preço, não está embutido.</li><li><strong>Crédito:</strong> sobre matérias-primas, produtos intermediários e embalagens.</li></ul>
${ex('Venda de indústria para comerciante',`${tbl(['Item','>Valor'],[['Produto',R(10000)],['IPI 5% (TIPI)',R(500)],['ICMS 18% sobre R$ 10.000 (sem IPI, cliente revende)',R(1800)],tot(['Total da nota',R(10500)])])}`)}
${aten('Com a reforma tributária, o IPI terá alíquota zero a partir de 2027 para a maioria dos produtos, sendo mantido para produtos que tenham industrialização incentivada na Zona Franca de Manaus.')}
`},

{id:'i5', t:'PIS e Cofins', h:`
<p class="lead">PIS e Cofins incidem sobre a receita. O regime depende do regime de tributação do IRPJ da empresa.</p>
${tbl(['Regime','Quem','PIS','Cofins','Créditos'],[['Cumulativo (Lei 9.718/1998)','Lucro Presumido','0,65%','3,00%','Não'],['Não cumulativo (Leis 10.637/2002 e 10.833/2003)','Lucro Real','1,65%','7,60%','Sim, sobre insumos, revenda, energia, aluguéis etc.'],['Simples Nacional','ME e EPP','Dentro do DAS','Dentro do DAS','Não'],['Monofásico','Combustíveis, medicamentos, cosméticos, autopeças, bebidas','Concentrado no fabricante/importador','Idem','Revendedor tem alíquota zero']])}
${lei('STF, Tema 69 (RE 574.706)','O ICMS destacado na nota não compõe a base de PIS e Cofins. Pela Lei 14.592/2023, o ICMS destacado também deve ser excluído da base de cálculo dos créditos.')}
${ex('Apuração não cumulativa simplificada',`${tbl(['Item','>Base','>PIS 1,65%','>Cofins 7,6%'],[
['Receita de vendas',R(100000),'',''],['(−) ICMS destacado nas vendas','− '+R(18000),'',''],['Base dos débitos',R(82000),R(1353),R(6232)],
['Compras para revenda',R(50000),'',''],['(−) ICMS destacado nas compras','− '+R(9000),'',''],['Base dos créditos',R(41000),'− '+R(676.50),'− '+R(3116)],
tot(['A recolher','',R(676.50),R(3116)])])}
<p>Recolhimento por DARF até o dia 25 do mês seguinte (antecipa se não for dia útil).</p>`)}
`},

{id:'i6', t:'ISS e Simples Nacional', h:`
<p class="lead">Serviços são tributados pelo ISS municipal. Pequenas empresas podem recolher quase tudo em uma guia única, o DAS.</p>
<h2>ISS</h2>
${lei('CF art. 156, III · LC 116/2003','Lista os serviços tributáveis, fixa a alíquota mínima de 2% e a máxima de 5%. Em regra, o imposto é devido no município do prestador; para os serviços listados no art. 3º, no local da prestação.')}
${ex('Retenção de ISS',`<p>Empresa em Guarulhos contrata limpeza (serviço do item 7.10, devido no local da prestação) de prestador de São Paulo por R$ 10.000. Alíquota de Guarulhos: hipotéticos 5%. O tomador retém R$ 500 e recolhe a Guarulhos.</p>`)}
<h2>Simples Nacional</h2>
<ul><li>Receita bruta até R$ 4,8 milhões por ano (LC 123/2006).</li><li>Tributos unificados no DAS, calculado no PGDAS-D sobre a receita mensal, com alíquota efetiva pelas faixas dos anexos.</li><li>Na NF-e usa-se o <strong>CSOSN</strong> no lugar do CST.</li><li>ICMS-ST, DIFAL e ICMS na importação ficam fora do DAS.</li></ul>
${tbl(['CSOSN','Significado'],[['101','Tributada com permissão de crédito'],['102','Tributada sem permissão de crédito'],['103','Isenção do ICMS para faixa de receita'],['201 / 202','Com cobrança de ICMS por ST'],['300','Imune'],['400','Não tributada'],['500','ICMS cobrado anteriormente por ST'],['900','Outros']])}
${dica('Quem compra de optante do Simples só credita ICMS se a nota tiver CSOSN 101 com o percentual de crédito informado.')}
`},

{id:'i7', t:'Apuração de impostos', h:`
<p class="lead">Apurar é confrontar, no fim do período, tudo o que foi debitado com tudo o que foi creditado. O resultado é imposto a pagar ou saldo credor a transportar.</p>
${flow([['Débitos','ICMS das saídas tributadas'],['Créditos','ICMS das entradas com direito a crédito'],['Ajustes','Estornos, CIAP, créditos outorgados, ST'],['Saldo anterior','Saldo credor do mês passado'],['Resultado','Imposto a recolher ou saldo credor']])}
${ex('Apuração mensal de ICMS: Comercial Alfa, outubro',`${tbl(['Lançamento','>Débito','>Crédito'],[
['Vendas internas 5.102 (R$ 120.000 × 18%)',R(21600),''],['Vendas interestaduais 6.102 (R$ 40.000 × 12%)',R(4800),''],
['Compras para revenda 1.102 (R$ 70.000 × 18%)','',R(12600)],['Compras para revenda 2.102 (R$ 30.000 × 7%)','',R(2100)],
['Devolução de venda 1.202','',R(540)],['CIAP: parcela do mês','',R(162)],['Estorno de crédito: perda de estoque 5.927',R(360),''],
['Saldo credor do mês anterior','',R(1200)],
tot(['Totais',R(26760),R(16602)]),tot(['ICMS a recolher (E110)',R(10158),''])])}
<p>Esse valor vai para o registro E110 da EFD e é pago por GARE (em SP), no prazo do calendário estadual, que varia conforme a atividade (CNAE).</p>`)}
<h2>Apuração dos outros tributos</h2>
${tbl(['Tributo','Período','Guia','Vencimento usual'],[['ICMS próprio','Mensal','GARE / DAE estadual','Conforme RICMS e CNAE'],['ICMS-ST e DIFAL','Mensal ou por operação','GARE / GNRE','Conforme UF de destino'],['IPI','Mensal','DARF','Dia 25 do mês seguinte'],['PIS / Cofins','Mensal','DARF','Dia 25 do mês seguinte'],['IRPJ / CSLL','Trimestral ou mensal por estimativa','DARF','Último dia útil do mês seguinte'],['ISS','Mensal','Guia municipal','Conforme o município'],['Simples Nacional','Mensal','DAS','Dia 20 do mês seguinte']])}
${erro('Esquecer o saldo credor do mês anterior ou não transportar o saldo credor para o mês seguinte. A EFD acusa a diferença, e o fisco cruza os valores.')}
<p>Simule a sua apuração na <a href="#calc/apur">calculadora de apuração</a>.</p>
`}
]}
];

LEVELS_FISCAL.push(
{ n:3, title:'Nível avançado', sub:'Obrigações acessórias: preparo, informações, entrega e prazos', lessons:[

{id:'a1', t:'Panorama das obrigações acessórias', h:`
<p class="lead">Obrigação acessória é tudo o que a empresa precisa informar ao fisco além de pagar: arquivos, declarações e documentos. Hoje quase tudo passa pelo SPED, e os fiscos cruzam as informações entre si.</p>
${tbl(['Obrigação','O que informa','Quem entrega','Periodicidade'],[
['EFD ICMS/IPI','Escrituração de entradas, saídas, apuração de ICMS e IPI, inventário, CIAP, estoque','Contribuintes de ICMS/IPI (exceto Simples, salvo exigência estadual)','Mensal'],
['EFD-Contribuições','Apuração de PIS e Cofins e CPRB','Lucro Real e Presumido','Mensal'],
['EFD-Reinf','Retenções e informações sem vínculo trabalhista (serviços tomados, IR, CSRF)','PJ em geral','Mensal'],
['eSocial','Folha, vínculos e eventos trabalhistas','Empregadores','Por evento e mensal'],
['DCTFWeb + MIT','Débitos federais confessados: previdenciários e, via MIT, IRPJ, CSLL, PIS, Cofins, IPI','PJ em geral','Mensal'],
['ECD','Escrituração contábil (Livro Diário e Razão)','Lucro Real; Presumido que distribui lucros acima do presumido; outras','Anual'],
['ECF','IRPJ e CSLL, LALUR/LACS','Praticamente todas as PJ, exceto Simples e inativas','Anual'],
['DeSTDA','ICMS-ST, DIFAL e antecipação do Simples Nacional','Optantes do Simples','Mensal'],
['PGDAS-D e DEFIS','Receitas e cálculo do DAS; informações socioeconômicas','Optantes do Simples','Mensal / anual'],
['Declarações estaduais','Informações específicas da UF (ex.: GIA e similares)','Conforme a UF','Conforme a UF']])}
${aten('A DIRF foi extinta a partir dos fatos geradores de 2025: as informações migraram para o eSocial e a EFD-Reinf. A antiga DCTF foi substituída pela DCTFWeb com o MIT (Módulo de Inclusão de Tributos) a partir de janeiro de 2025.')}
${lei('Decreto 6.022/2007 (SPED) e normas de cada obrigação','EFD ICMS/IPI: Ajuste SINIEF 02/2009 e Guia Prático. EFD-Contribuições: IN RFB 1.252/2012. EFD-Reinf: IN RFB 2.043/2021. ECD: IN RFB 2.003/2021. ECF: IN RFB 2.004/2021. DCTFWeb: IN RFB 2.005/2021, alterada pela IN RFB 2.237/2024.')}
`},

{id:'a2', t:'EFD ICMS/IPI (SPED Fiscal)', h:`
<p class="lead">É o arquivo digital que substitui os livros fiscais. Tudo o que você estudou nos níveis 1 e 2 desemboca aqui.</p>
<h2>Estrutura em blocos</h2>
${tbl(['Bloco','Conteúdo','Registros-chave'],[
['0','Abertura, cadastros: participantes, produtos, unidades, natureza','0000, 0150, 0190, 0200'],
['B','Escrituração do ISS (somente DF)','B020'],
['C','Documentos de mercadorias: NF-e, NFC-e, energia','C100 (nota), C170 (itens), C190 (resumo por CST/CFOP/alíquota)'],
['D','Documentos de serviços: CT-e, comunicação','D100, D190, D500'],
['E','Apuração do ICMS, ST, DIFAL/FCP e IPI','E110, E200/E210, E300/E310, E520'],
['G','CIAP: crédito do ativo imobilizado','G110, G125'],
['H','Inventário físico','H005, H010'],
['K','Controle da produção e do estoque','K200, K230, K235'],
['1','Outras informações (ex.: exportação, cartões)','1010, 1601'],
['9','Encerramento e totalização','9900, 9999']])}
<h2>Informações necessárias</h2>
<ul><li>XMLs de todas as NF-e, CT-e e NFC-e emitidas e recebidas no mês.</li><li>Cadastro de participantes (CNPJ, IE, UF) e de produtos (NCM, unidade, tipo de item).</li><li>Parâmetros fiscais: CFOP, CST, alíquotas, benefícios e seus códigos de ajuste (tabela 5.1.1 da UF).</li><li>Controle do CIAP com os bens e as saídas tributadas x totais.</li><li>Saldo credor do período anterior e ajustes (estornos, créditos outorgados).</li><li>Inventário, no período em que for exigido (em regra, informado na EFD de fevereiro, referente a 31/12).</li></ul>
<h2>Como preparar</h2>
${flow([['Baixar XMLs','Portal da SEFAZ, distribuição DF-e, manifestação do destinatário'],['Conciliar','Notas emitidas e recebidas x sistema; canceladas e denegadas'],['Revisar parâmetros','CFOP de entrada, CST, crédito, ST, DIFAL'],['Apurar','Conferir E110 com a memória de cálculo'],['Gerar o arquivo','Exportar do ERP no leiaute vigente'],['Validar no PVA','Corrigir erros e analisar advertências']])}
${ex('O registro C190 explicado',`<p>O C190 resume cada nota por combinação de CST, CFOP e alíquota. É ele que alimenta a apuração.</p>
${tbl(['CST','CFOP','Alíq.','>Valor operação','>Base ICMS','>ICMS'],[['000','5.102','18%',R(5000),R(5000),R(900)],['060','5.405','0%',R(1200),R(0),R(0)]])}
<p>Se o C190 diz 5.102 a 18% e o C170 está com 12%, o PVA acusa inconsistência.</p>`)}
${aten('Prazo: varia por UF. Em SP, a EFD ICMS/IPI é entregue até o dia 20 do mês seguinte. Confira o calendário da SEFAZ do seu estado.')}
`},

{id:'a3', t:'EFD-Contribuições', h:`
<p class="lead">Arquivo de apuração de PIS e Cofins, com o detalhamento das receitas e dos créditos.</p>
${tbl(['Bloco','Conteúdo'],[['0','Abertura e cadastros, regime de apuração (0110)'],['A','Documentos de serviço (NFS-e)'],['C','Documentos de mercadorias (NF-e, NFC-e)'],['D','Transporte e comunicação'],['F','Demais documentos e operações (receitas financeiras, aluguéis, depreciação)'],['M','Apuração de PIS e Cofins e créditos'],['P','Contribuição previdenciária sobre a receita bruta (CPRB)'],['1','Complemento: controle de créditos, processos judiciais']])}
<h2>Informações necessárias</h2>
<ul><li>Regime: cumulativo, não cumulativo ou misto.</li><li>CST de PIS/Cofins por item (01 tributado, 04 monofásico revenda, 06 alíquota zero, 50 a 56 créditos, 70 a 75 aquisição sem crédito).</li><li>Base de crédito por natureza (tabela 4.3.7: insumos, revenda, energia, aluguel, depreciação).</li><li>Exclusão do ICMS da base dos débitos e créditos.</li><li>Processos judiciais e saldos de crédito de períodos anteriores.</li></ul>
${aten('Prazo: até o 10º dia útil do segundo mês seguinte ao de referência. Exemplo: outubro/2026 é entregue até o 10º dia útil de dezembro/2026.')}
`},

{id:'a4', t:'DCTFWeb, MIT, EFD-Reinf e eSocial', h:`
<p class="lead">Essas obrigações formam o ecossistema federal de confissão de débitos. Os dados do eSocial e da Reinf alimentam automaticamente a DCTFWeb.</p>
${flow([['eSocial','Folha e contribuições previdenciárias'],['EFD-Reinf','Retenções de INSS, IR, CSRF, CPRB'],['MIT','IRPJ, CSLL, PIS, Cofins, IPI e outros'],['DCTFWeb','Consolida e confessa os débitos'],['DARF','Gerado pela própria DCTFWeb']])}
${tbl(['Obrigação','Prazo usual'],[['eSocial (eventos periódicos)','Dia 15 do mês seguinte'],['EFD-Reinf','Dia 15 do mês seguinte (antecipa se não houver expediente)'],['DCTFWeb (com MIT)','Último dia útil do mês seguinte']])}
${ex('Contratação de serviço com retenção',`<p>Empresa contrata serviço de limpeza com cessão de mão de obra por R$ 20.000.</p>
${tbl(['Retenção','>Alíquota','>Valor','Onde informar'],[['INSS',`11%`,R(2200),'EFD-Reinf R-2010'],['IRRF','1%',R(200),'EFD-Reinf R-4020'],['CSRF (PIS/Cofins/CSLL)','4,65%',R(930),'EFD-Reinf R-4020']])}
<p>Os valores fluem para a DCTFWeb, que gera o DARF. Confirme sempre se o serviço e o prestador estão sujeitos a cada retenção.</p>`)}
`},

{id:'a5', t:'ECD e ECF', h:`
<p class="lead">São as obrigações anuais da contabilidade e do imposto de renda. Não são do setor fiscal no sentido estrito, mas usam os mesmos dados e precisam bater com as EFDs.</p>
${tbl(['','ECD','ECF'],[['O que é','Livro Diário, Razão e balancetes digitais','Apuração do IRPJ e da CSLL, LALUR e LACS'],['Quem entrega','Lucro Real; Presumido que distribui lucros acima da base presumida sem retenção; imunes/isentas com receita acima de R$ 4,8 milhões','Todas as PJ, exceto Simples, inativas e órgãos públicos'],['Prazo','Último dia útil de junho do ano seguinte','Último dia útil de julho do ano seguinte'],['Base legal','IN RFB 2.003/2021','IN RFB 2.004/2021']])}
${dica('Antes de transmitir a ECF, recupere a ECD já autenticada. Os saldos contábeis precisam fechar com as receitas da EFD-Contribuições e os tributos confessados na DCTFWeb.')}
`},

{id:'a6', t:'Como entregar', h:`
<p class="lead">Quase todas as obrigações do SPED seguem o mesmo roteiro de entrega.</p>
